干通信网，应采用光纤通信方式；中压配电通信接入网可灵活采用多种通信方式，满足海量终端数据传输的可靠性和实时性，以及配电网络多样性、数据资源高速同步   等方面需求，支撑终端远程通信与业务应用。"}, {"category": "配电网规划", "type": "单选题", "question": "110（66）kV 变电站和 B 类及以上供电区域的 35kV 变电站应具备至少 （）条光缆路由，具备条件时采用环形或网状组网；", "options": [{"label": "A", "text": "1"}, {"label": "B", "text": "2"}, {"label": "C", "text": "3"}, {"label": "D", "text": "4"}], "answer": "B", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第10章：10.6.3"}, {"category": "配电网规划", "type": "单选题", "question": "10kV 配电网应采用（），架空及架空电缆混合线路应配置重合闸。", "options": [{"label": "A", "text": "过流、速断保护"}, {"label": "B", "text": "过电压保护"}, {"label": "C", "text": "电流延时速断保护"}, {"label": "D", "text": "零序电流保护"}], "answer": "A", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：10kV 配电网应采用过流、速断保护，架空及架空电缆混合线路应配置重合闸；低电阻接地系统中的线路应增设零序电流保护；合环运行的配电线路应增设相应保护装置，确保能够快速切除故障。"}, {"category": "配电网规划", "type": "多选题", "question": "配电网应配电网应具有科学的（）和必要的数字化、自动化、智能化水平，以提高供电保障能力、应急处置能力、资源配置能力。", "options": [{"label": "A", "text": "网架结构"}, {"label": "B", "text": "必备的容量裕度"}, {"label": "C", "text": "适当的转供能力"}, {"label": "D", "text": "合理的装备水平"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第4章：配电网应具有科学的网架结构、必备的容量裕度、适当的转供能力、合理的装备水平和必要的数字化、自动化、智能化水平，以提高供电保障能力、应急处置能力、资源配置能力。"}, {"category": "配电网规划", "type": "多选题", "question": "以下属于配电网智能化的一般要求的是（）。", "options": [{"label": "A", "text": "配电网智能化应采用先进的信息、通信、控制技术，支撑配电网状态感知、自动控制、智能应   用，满足电网运行、客户服务、企业运营、新兴业务的需求。"}, {"label": "B", "text": "配电网智能化应遵循先进适用原则，优先选用可靠、成熟的技术。对于新技术和新设备，应充   分考虑效率效益，可在小范围内试点应用后，经技术经济比较论证后确定推广应用范围。"}, {"label": "C", "text": "配电网智能化应适应能源互联网发展方向，以实际需求为导向，差异化部署智能终端感知电网   多元信息，灵活采用多种通信方式满足信息传输可靠性和实时性，依托统一的企业中台和物联管理平台   实现数据融合、开放共享。"}, {"label": "D", "text": "配电网智能化应采用差异化建设策略，以不同供电区域供电可靠性、多元主体接入等实际需求为导向，结合一次网架有序投资。"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第10章"}, {"category": "配电网规划", "type": "多选题", "question": "应根据（）确定负荷发展曲线，并以此作为规划的依据。", "options": [{"label": "A", "text": "不同区域"}, {"label": "B", "text": "不同社会发展阶段"}, {"label": "C", "text": "不同用户类型"}, {"label": "D", "text": "空间负荷预测结果"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第6章6.1.3 应根据不同区域、不同社会发展阶段、不同用户类型以及空间负荷预测结果，确定负荷发展曲线，并以此作为规划的依据。"}, {"category": "配电网规划", "type": "多选题", "question": "负荷预测主要包括（）预测和（）负荷预测。", "options": [{"label": "A", "text": "近期预测"}, {"label": "B", "text": "饱和负荷"}, {"label": "C", "text": "中期"}, {"label": "D", "text": "近中期"}], "answer": "BD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第6章6.1.2 负荷预测主要包括饱和负荷预测和近中期负荷预测，饱和负荷预测是构建目标网架的基础，近中期负荷预测主要用于制定过渡网架方案和指导项目安排。"}, {"category": "配电网规划", "type": "多选题", "question": "以下选项属于配电网规划常用的负荷预测方法有：（）等。", "options": [{"label": "A", "text": "弹性系数法"}, {"label": "B", "text": "单耗法"}, {"label": "C", "text": "人均电量法"}, {"label": "D", "text": "负荷密度法"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第6章6.2.1 配电网规划常用的负荷预测方法有：弹性系数法、单耗法、负荷密度法、趋势外推法、人均电量法等。当考虑分布式电源与新型负荷接入时，可采用概率建模法、神经网络法、蒙特卡洛模拟法等。"}, {"category": "配电网规划", "type": "多选题", "question": "电力平衡应（）进行，并考虑各类分布式电源和储能设施、电动汽车充换电设施等新型负荷的影响。", "options": [{"label": "A", "text": "分区"}, {"label": "B", "text": "分站"}, {"label": "C", "text": "分电压等级"}, {"label": "D", "text": "分年度"}], "answer": "ACD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第6章6.3.1 电力平衡应分区、分电压等级、分年度进行，并考虑各类分布式电源和储能设施、电动汽车充换电设施等新型负荷的影响。"}, {"category": "配电网规划", "type": "多选题", "question": "分电压等级电力平衡应结合（），确定该电压等级所需新增的变压器容量。", "options": [{"label": "A", "text": "负荷预测结果"}, {"label": "B", "text": "电压等级"}, {"label": "C", "text": "电源装机发展情况"}, {"label": "D", "text": "现有变压器容量"}], "answer": "ACD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第6章6.3.2 分电压等级电力平衡应结合负荷预测结果、电源装机发展情况和现有变压器容量，确定该电压等级所需新增的变压器容量。"}, {"category": "配电网规划", "type": "多选题", "question": "水电能源的比例较高时，电力平衡应根据其在不同季节的构成比例，分（）进行平衡。", "options": [{"label": "A", "text": "丰期"}, {"label": "B", "text": "季节"}, {"label": "C", "text": "地区"}, {"label": "D", "text": "枯期"}], "answer": "AD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第6章6.3.3 水电能源的比例较高时，电力平衡应根据其在不同季节的构成比例，分丰期、枯期进行平衡。"}, {"category": "配电网规划", "type": "多选题", "question": "分电压等级电力平衡应考虑（）等灵活性资源的影响，根据其资源库规模和区域负荷特性，确定规划计算负荷与最大负荷的比例关系。", "options": [{"label": "A", "text": "需求响应"}, {"label": "B", "text": "储能设施"}, {"label": "C", "text": "工业负荷"}, {"label": "D", "text": "电动汽车充换电设施"}], "answer": "ABD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第6章6.3.5 分电压等级电力平衡应考虑需求响应、储能设施、电动汽车充换电设施等灵活性资源的影响， 根据其资源库规模和区域负荷特性，确定规划计算负荷与最大负荷的比例关系。"}, {"category": "配电网规划", "type": "多选题", "question": "下列属于第一级供电安全水平要求的是（）", "options": [{"label": "A", "text": "对于停电范围不大于2MW的组负荷，允许故障修复后恢复供电，恢复供电的时间与故障修复时间相同。"}, {"label": "B", "text": "该级停电故障主要涉及低压线路故障、配电变压器故障，或采用特殊安保设计（如分段及联络开关均采用断路器，且全线采用纵差保护等）的中压线段故障。停电范围仅限于低压线路、配电变压器故障所影响的负荷、或特殊安保设计的中压线段，中压线路的其它线段不允许停电。"}, {"label": "C", "text": "该级标准要求单台配电变压器所带的负荷不宜超过2MW，或采用特殊安保设计的中压分段上的负荷不宜超过2MW。"}, {"label": "D", "text": "对于停电范围不大于2MW的组负荷，允许故障修复后恢复供电，恢复供电的时间与故障修复时间相同。"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第2章 第一级供电安全水平要求：\n（1）对于停电范围不大于2MW的组负荷，允许故障修复后恢复供电，恢复供电的时间与故障修复时间相同。\n（2）该级停电故障主要涉及低压线路故障、配电变压器故障，或采用特殊安保设计（如分段及联络开关均采用断路器，且全线采用纵差保护等）的中压线段故障。停电范围仅限于低压线路、配电变压器故障所影响的负荷、或特殊安保设计的中压线段，中压线路的其它线段不允许停电。\n（3）该级标准要求单台配电变压器所带的负荷不宜超过2MW，或采用特殊安保设计的中压分段上的负荷不宜超过2MW。"}, {"category": "配电网规划", "type": "多选题", "question": "下列属于第一级供电安全水平要求的是（）", "options": [{"label": "A", "text": "对于停电范围不大于2MW的组负荷，允许故障修复后恢复供电，恢复供电的时间与故障修复时间相同。"}, {"label": "B", "text": "该级停电故障主要涉及低压线路故障、配电变压器故障，或采用特殊安保设计（如分段及联络开关均采用断路器，且全线采用纵差保护等）的中压线段故障。停电范围仅限于低压线路、配电变压器故障所影响的负荷、或特殊安保设计的中压线段，中压线路的其它线段不允许停电。"}, {"label": "C", "text": "该级标准要求单台配电变压器所带的负荷不宜超过2MW，或采用特殊安保设计的中压分段上的负荷不宜超过2MW。"}, {"label": "D", "text": "对于停电范围在2～12MW的组负荷，其中不小于组负荷减2MW的负荷应在3小时内恢复供电；余下的负荷允许故障修复后恢复供电，恢复供电时间与故障修复时间相同。"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第七章7.2"}, {"category": "配电网规划", "type": "多选题", "question": "下列属于第二级供电安全水平要求的是（）", "options": [{"label": "A", "text": "对于停电范围在2～12MW的组负荷，其中不小于组负荷减2MW的负荷应在3小时内恢复供电；余下的负荷允许故障修复后恢复供电，恢复供电时间与故障修复时间相同。"}, {"label": "B", "text": "该级停电故障主要涉及中压线路故障，停电范围仅限于故障线路所供负荷，A+类供电区域的故障线路的非故障段应在5分钟内恢复供电，A类供电区域的故障线路的非故障段应在15分钟内恢复供电，B、C类供电区域的故障线路的非故障段应在3小时内恢复供电，故障段所供负荷应小于2MW，可在故障修复后恢复供电。"}, {"label": "C", "text": "该级标准要求中压线路应合理分段，每段上的负荷不宜超过2MW，且线路之间应建立适当的联络。"}, {"label": "D", "text": "对于停电范围在12～180MW的组负荷，其中不小于组负荷减12MW的负荷或者不小于三分之二的组负荷（两者取小值）应在15分钟内恢复供电，余下的负荷应在3小时内恢复供电。"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.2"}, {"category": "配电网规划", "type": "多选题", "question": "下列属于第三级供电安全水平要求的是（）", "options": [{"label": "A", "text": "对于停电范围在12～180MW的组负荷，其中不小于组负荷减12MW的负荷或者不小于三分之二的组负荷（两者取小值）应在15分钟内恢复供电，余下的负荷应在3小时内恢复供电。"}, {"label": "B", "text": "A+、A类供电区域故障变电站所供负荷应在15分钟内恢复供电；B、C类供电区域故障变电站所供负荷，其大部分负荷（不小于三分之二）应在15分钟内恢复供电，其余负荷应在3小时内恢复供电。"}, {"label": "C", "text": "该级停电故障主要涉及变电站的高压进线或主变压器，停电范围仅限于故障变电站所供负荷，其中大部分负荷应在15分钟内恢复供电，其它负荷应在3小时内恢复供电。"}, {"label": "D", "text": "该级标准要求变电站的中压线路之间宜建立站间联络，变电站主变及高压线路可按N-1原则配置。"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.2"}, {"category": "配电网规划", "type": "多选题", "question": "容载比的确定要考虑（）负荷增长率、负荷转移能力等因素的影响。", "options": [{"label": "A", "text": "负荷分散系数"}, {"label": "B", "text": "平均功率因数"}, {"label": "C", "text": "变压器负载率"}, {"label": "D", "text": "储备系数"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.3.2 容载比的确定要考虑负荷分散系数、平均功率因数、变压器负载率、储备系数、负荷增长率、负荷转移能力等因素的影响"}, {"category": "配电网规划", "type": "多选题", "question": "根据行政区县或供电分区经济增长和社会发展的不同阶段，对应的配电网负荷增长速度可分为哪几种情况。", "options": [{"label": "A", "text": "饱和"}, {"label": "B", "text": "较慢"}, {"label": "C", "text": "中等"}, {"label": "D", "text": "较快"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.3.4 根据行政区县或供电分区经济增长和社会发展的不同阶段，对应的配电网负荷增长速度可分为饱和、较慢、中等、较快四种情况，总体宜控制在 1.5～2.0。"}, {"category": "配电网规划", "type": "多选题", "question": "对于省级、地市级110～35kV电网容载比，还应充分考虑各行政区县（供电分区）之间的（），确定（），合理（）。", "options": [{"label": "A", "text": "负荷特性差异"}, {"label": "B", "text": "负荷发展水平"}, {"label": "C", "text": "负荷分散系数"}, {"label": "D", "text": "选取控制范围"}], "answer": "ACD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.3.5 对于省级、地市级 110～35kV 电网容载比，还应充分考虑各行政区县（供电分区）之间的负荷特性差异，确定负荷分散系数，合理选取控制范围。"}, {"category": "配电网规划", "type": "多选题", "question": "供电质量主要包括（）和（）两个方面", "options": [{"label": "A", "text": "经济性"}, {"label": "B", "text": "供电可靠性"}, {"label": "C", "text": "电能质量"}, {"label": "D", "text": "安全性"}], "answer": "BC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.4.1 供电质量主要包括供电可靠性和电能质量两个方面，配电网规划重点考虑供电可靠率和综合电压合格率两项指标。"}, {"category": "配电网规划", "type": "多选题", "question": "供电可靠性指标主要包括系统（）等，宜在成熟地区逐步推广以终端用户为单位的供电可靠性统计。", "options": [{"label": "A", "text": "平均停电时间"}, {"label": "B", "text": "平均负荷"}, {"label": "C", "text": "系统平均停电频率"}, {"label": "D", "text": "平均电压"}], "answer": "AC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.4.2 供电可靠性指标主要包括系统平均停电时间、系统平均停电频率等，宜在成熟地区逐步推广以终端用户为单位的供电可靠性统计。"}, {"category": "配电网规划", "type": "多选题", "question": "配电网规划应分析供电可靠性（）和（）的差距。", "options": [{"label": "A", "text": "远期目标"}, {"label": "B", "text": "中期目标"}, {"label": "C", "text": "现状指标"}, {"label": "D", "text": "近期目标"}], "answer": "AC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.4.3 配电网规划应分析供电可靠性远期目标和现状指标的差距，提出改善供电可靠性指标的投资需求，并进行电网投资与改善供电可靠性指标之间的灵敏度分析，提出供电可靠性近期目标。"}, {"category": "配电网规划", "type": "多选题", "question": "配电网应有足够的电压调节能力，将电压维持在规定范围内，主要有下列电压调整方式（）。", "options": [{"label": "A", "text": "通过配置无功补偿装置进行电压调节；"}, {"label": "B", "text": "选用有载或无载调压变压器，通过改变分接头进行电压调节；"}, {"label": "C", "text": "通过切除配变；"}, {"label": "D", "text": "通过线路调压器进行电压调节。"}], "answer": "ABD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.4.6"}, {"category": "配电网规划", "type": "多选题", "question": "配电网规划应从网架结构、（）等方面合理控制各电压等级的短路容量。", "options": [{"label": "A", "text": "变压器容量"}, {"label": "B", "text": "电压等级"}, {"label": "C", "text": "阻抗选择"}, {"label": "D", "text": "运行方式"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.5"}, {"category": "配电网规划", "type": "多选题", "question": "为合理控制配电网的短路容量，可采取以下主要技术措施：", "options": [{"label": "A", "text": "配电网络分片、开环，母线分段，主变分列"}, {"label": "B", "text": "控制单台主变压器容量"}, {"label": "C", "text": "合理选择接线方式（如二次绕组为分裂式）或采用高阻抗变压器"}, {"label": "D", "text": "主变压器低压侧加装电抗器等限流装置"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.5"}, {"category": "配电网规划", "type": "多选题", "question": "中性点接地方式对（）等有直接影响。配电网应综合考虑可靠性与经济性，选择合理的中性点接地方式。", "options": [{"label": "A", "text": "供电可靠性"}, {"label": "B", "text": "人身安全"}, {"label": "C", "text": "设备绝缘水平"}, {"label": "D", "text": "继电保护方式"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.5.4 中性点接地方式对供电可靠性、人身安全、设备绝缘水平及继电保护方式等有直接影响。配电网应综合考虑可靠性与经济性，选择合理的中性点接地方式。中压线路有联络的变电站宜采用相同的中   性点接地方式，以利于负荷转供；中性点接地方式不同的配电网应避免互带负荷。"}, {"category": "配电网规划", "type": "多选题", "question": "对处于系统末端、短路容量较小的供电区域，可通过适当（）、采用（）等方式，增加系统短路容量，提高配电网的电压稳定性。", "options": [{"label": "A", "text": "增大主变容量"}, {"label": "B", "text": "配电网络分片、开环，母线分段"}, {"label": "C", "text": "主变并列运行"}, {"label": "D", "text": "主变分列运行"}], "answer": "AC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.5"}, {"category": "配电网规划", "type": "多选题", "question": "以下属于无功补偿配置原则的是：", "options": [{"label": "A", "text": "无功补偿装置应按就地平衡和便于调整电压的原则进行配置，可采用变电站集中补偿和分散就地补偿相结合，电网补偿与用户补偿相结合，高压补偿与低压补偿相结合等方式。接近用电端的分散补偿装置主要用于提高功率因数，降低线路损耗；集中安装在变电站内的无功补偿装置主要用于控制电压水平。"}, {"label": "B", "text": "应从系统角度考虑无功补偿装置的优化配置，以利于全网无功补偿装置的优化投切。"}, {"label": "C", "text": "变电站无功补偿配置应与变压器分接头的选择相配合，以保证电压质量和系统无功平衡。"}, {"label": "D", "text": "在配置无功补偿装置时不用考虑谐波治理措施。"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）：第7章7.6"}, {"category": "配电网规划", "type": "多选题", "question": "配电变压器的无功补偿装置容量应依据变压器（）数等进行配置。", "options": [{"label": "A", "text": "短路电流"}, {"label": "B", "text": "最大负载率"}, {"label": "C", "text": "网络结构"}, {"label": "D", "text": "负荷自然功率因数"}], "answer": "BD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：7.6.4 配电变压器的无功补偿装置容量应依据变压器最大负载率、负荷自然功率因数等进行配置。"}, {"category": "配电网规划", "type": "多选题", "question": "配电网规划要保证网络中各节点满足电压损失及其分配要求，各类用户受电电压质量正确的是（）。", "options": [{"label": "A", "text": "35～110kV 供电电压正负偏差的绝对值之和不超过额定电压的 10%。"}, {"label": "B", answer": "BCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：7.5.9"}, {"category": "配电网规划", "type": "多选题", "question": "分布式电源接入时，继电保护和安全自动装置配置方案应符合相关（）的规定，定值应与电网继电保护和安全自动装置配合整定；", "options": [{"label": "A", "text": "继电保护技术规程"}, {"label": "B", "text": "运行规程"}, {"label": "C", "text": "反事故措施"}, {"label": "D", "text": "安全自动装置"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第七章：7.7.9 分布式电源接入时，继电保护和安全自动装置配置方案应符合相关继电保护技术规程、运行规程和反事故措施的规定，定值应与电网继电保护和安全自动装置配合整定；接入公共电网的所有线路投   入自动重合闸时，应校核重合闸时间。"}, {"category": "配电网规划", "type": "多选题", "question": "A+、A、B、C 类供电区的配电网结构应满足以下基本要求：（）。", "options": [{"label": "A", "text": "正常运行时，各变电站应有相互独立的供电区域，供电区不交叉、不重叠，故障或检修时，变电站之间应有一定比例的负荷转供能力。"}, {"label": "B", "text": "变电站（包括直接配出 10kV 线路的 220kV 变电站）的 10kV 出线所供负荷宜均衡，应有合理的分段和联络；故障或检修时，应具有转供非停运段负荷的能力。"}, {"label": "C", "text": "接入一定容量的分布式电源时，应合理选择接入点，控制短路电流及电压水平。"}, {"label": "D", "text": "高可靠性的配电网结构应具备网络重构能力，便于实现故障自动隔离。"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第八章：8.1.2"}, {"category": "配电网规划", "type": "多选题", "question": "以下选项哪些是配电网转供能力主要考虑因素的是（）", "options": [{"label": "A", "text": "变压器容量裕度"}, {"label": "B", "text": "线路容量裕度"}, {"label": "C", "text": "中压主干线的合理分段数和联络情况"}, {"label": "D", "text": "线路长度"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第8章：8.2 转供能力主要取决于正常运行时的变压器容量裕度、线路容量裕度、中压主干线的合理分段数和联络情况等。"}, {"category": "配电网规划", "type": "多选题", "question": "高压配电网结构主要有：", "options": [{"label": "A", "text": "单环式"}, {"label": "B", "text": "链式"}, {"label": "C", "text": "环网"}, {"label": "D", "text": "辐射状"}], "answer": "BCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第8章：8.2"}, {"category": "配电网规划", "type": "多选题", "question": "中压配电网结构主要有：", "options": [{"label": "A", "text": "双环式"}, {"label": "B", "text": "单环式"}, {"label": "C", "text": "多分段适度联络"}, {"label": "D", "text": "辐射状"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第8章：8.3"}, {"category": "配电网规划", "type": "多选题", "question": "35～110kV 线路导线截面的选取应符合下述要求()", "options": [{"label": "A", "text": "线路导线截面应按照最大电流选取。"}, {"label": "B", "text": "线路导线截面宜综合饱和负荷状况、线路全寿命周期选定。"}, {"label": "C", "text": "线路导线截面应与电网结构、变压器容量和台数相匹配。"}, {"label": "D", "text": "线路导线截面应按照安全电流裕度选取，并以经济载荷范围校核。"}], "answer": "BCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.3"}, {"category": "配电网规划", "type": "多选题", "question": "以下说法正确的是：", "options": [{"label": "A", "text": "A+、A、B 类供电区域 110（66）kV 架空线路截面不宜小于 150mm2"}, {"label": "B", "text": "A+、A、B 类供电区域 35kV 架空线路截面不宜小\n于 150mm2"}, {"label": "C", "text": "C、D、E 类供电区域 110kV 架空线路截面不宜小于 240mm2"}, {"label": "D", "text": "C、D、E 类供电区域 66kV、35kV 架空线路截面不宜小于 120mm2"}], "answer": "BD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.3"}, {"category": "配电网规划", "type": "多选题", "question": "下列有关线路导线选择正确的是（）", "options": [{"label": "A", "text": "35～110kV 架空线路导线宜采用钢芯铝绞线及新型节能导线，沿海及有腐蚀性地区可选用防腐型导线。"}, {"label": "B", "text": "35～110kV 电缆线路宜选用交联聚乙烯绝缘铜芯电缆，载流量应与该区域架空线路相匹配。"}, {"label": "C", "text": "中压架空线路通常为铝芯，沿海高盐雾地区可采用铜绞线，A+、A、B、C 类供电区域的中压架空线路宜采用架空绝缘线。"}, {"label": "D", "text": "35～110kV线路跨区供电时，导线截面宜按建设标准较低区域选取。"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.3"}, {"category": "配电网规划", "type": "多选题", "question": "下列关于配电网智能化的说法正确的有（）。", "options": [{"label": "A", "text": "配电网智能化应采用先进的信息、通信、控制技术，支撑配电网状态感知、自动控制、智能应用，满足电网运行、客户服务、企业运营、新兴业务的需求。"}, {"label": "B", "text": "配电网智能化应遵循标准化设计原则，采用标准化信息模型与接口规范，落实公司信息化统一   架构设计、安全防护总体要求。"}, {"label": "C", "text": "配电网智能化应采用差异化建设策略，以不同供电区域供电可靠性、多元主体接入等实际需求为导向，结合一次网架有序投资。"}, {"label": "D", "text": "配电网智能化应遵循统筹协调规划原则。"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第10章：10.1"}, {"category": "配电网规划", "type": "多选题", "question": "下列选项正确的有（）。", "options": [{"label": "A", "text": "重要电力用户供电电源应采用多电源、双电源或双回路供电。"}, {"label": "B", "text": "一级重要电力用户宜采用双回路供电"}, {"label": "C", "text": "二级重要电力用户宜采用双回路供电。"}, {"label": "D", "text": "重要电力用户应自备应急电源"}], "answer": "ACD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.1.5 重要电力用户供电电源配置应符合 GB/T 29328 的规定。重要电力用户供电电源应采用多电源、双电源或双回路供电，当任何一路或一路以上电源发生故障时，至少仍有一路电源应能满足保安负荷供电要求。特级重要电力用户应采用多电源供电；一级重要电力用户至少应采用双电源供电；二级重要电力用户至少应采用双回路供电。"}, {"category": "配电网规划", "type": "多选题", "question": "下列有关电源接入电源总容量范围和并网电压等级相符的是（）。", "options": [{"label": "A", "text": "8kW 及以下，220V"}, {"label": "B", "text": "8kW～400kW，380V"}, {"label": "C", "text": "400kW～6MW，10kV、35KV"}, {"label": "D", "text": "6MW～50MW，35kV、66kV、110kV"}], "answer": "ABD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.2"}, {"category": "配电网规划", "type": "多选题", "question": "在分布式电源接入前，应以保障电网安全稳定运行和分布式电源消纳为前提，应对接入的配电线路（）进行校核，并对接入的母线、线路、开关等进行短路电流和热稳定校核，如有必要也可进行动稳定校核。", "options": [{"label": "A", "text": "线路长度"}, {"label": "B", "text": "载流量"}, {"label": "C", "text": "变压器容量"}, {"label": "D", "text": "短路电流"}], "answer": "BC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.2.4 在分布式电源接入前，应以保障电网安全稳定运行和分布式电源消纳为前提，对接入的配电线   路载流量、变压器容量进行校核，并对接入的母线、线路、开关等进行短路电流和热稳定校核，如有必   要也可进行动稳定校核。不满足运行要求时，应进行相应电网改造或重新规划分布式电源的接入。"}, {"category": "配电网规划", "type": "多选题", "question": "用户的供电电压等级应根据（），经过技术经济比较后确定。", "options": [{"label": "A", "text": "当地电网条件"}, {"label": "B", "text": "最大用电负荷"}, {"label": "C", "text": "用户报装容量"}, {"label": "D", "text": "供电可靠性"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.1.2 用户的供电电压等级应根据当地电网条件、供电可靠性要求、供电安全要求、最大用电负荷、   用户报装容量，经过技术经济比较论证后确定。可参考表 13，结合用户负荷水平确定，并符合下列规定："}, {"category": "配电网规划", "type": "多选题", "question": "下列关于配电网智能终端的说法正确的有（）。", "options": [{"label": "A", "text": "配电网智能终端应以状态感知、即插即用、资源共享、安全可靠、智能高效为发展方向，统一终端标准，支持数据源端唯一、边缘处理。"}, {"label": "B", "text": "配电自动化终端宜按照监控对象分为站所终端（DTU）、馈线终端（FTU）、故障指示器等，   均应实现“三遥”、功能。"}, {"label": "C", "text": "配电网智能终端应按照差异化原则逐步覆盖配电站室、配电线路、分布式电源及电动汽车充电   桩等配用电设备，采集配电网设备运行状态、电能计量、环境监测等各类数据。"}, {"label": "D", "text": "110～35kV 架空线路在重要跨越、自然灾害频发、运维困难的区段，可配置运行环境监测智能终端。"}], "answer": "ACD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第10章"}, {"category": "配电网规划", "type": "多选题", "question": "配电自动化系统是提升配电网运行管理水平的有效手段，应具备配电 （）等功能。", "options": [{"label": "A", "text": "SCADA"}, {"label": "B", "text": "馈线自动化"}, {"label": "C", "text": "配电网分析应用"}, {"label": "D", "text": "负荷控制管理"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第10章：10.4.3 配电自动化系统是提升配电网运行管理水平的有效手段，应具备配电 SCADA、馈线自动化及配电网分析应用等功能。配电自动化系统主站应遵循 DL/T 5542、DL/T 5729 相关要求，应根据各区域电网规模和应用需求进行差异化配置，合理确定主站功能模块。"}, {"category": "配电网规划", "type": "多选题", "question": "配电网应具有科学的网架结构、（）、（）、（）和（），以提高供电保障能力、应急处置能力、资源配置能力。", "options": [{"label": "A", "text": "科学的网架结构"}, {"label": "B", "text": "必备的容量裕度"}, {"label": "C", "text": "适当的转供能力"}, {"label": "D", "text": "合理的装备水平和必要的数字化、自动化、智能化水平"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第4章：4.2 配电网应具有科学的网架结构、必备的容量裕度、适当的转供能力、合理的装备水平和必要的数字化、自动化、智能化水平，以提高供电保障能力、应急处置能力、资源配置能力。"}, {"category": "配电网规划", "type": "多选题", "question": "一下概念，表述正确的有（）", "options": [{"label": "A", "text": "负荷组：由多个供电点构成的集合。"}, {"label": "B", "text": "组负荷：负荷组的最大负荷。"}, {"label": "C", "text": "容载比：某一规划区域、某一电压等级电网的公用变电设备总容量与对应网供最大负荷的比值。"}, {"label": "D", "text": "双回路：为同一用户负荷供电的两回供电线路，两回供电线路可以来自同一变电站的同一母线段。"}], "answer": "BCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第3章"}, {"category": "配电网规划", "type": "多选题", "question": "以下选项属于负荷预测的基础数据的是（）。", "options": [{"label": "A", "text": "经济社会发展规划和国土空间规划数据"}, {"label": "B", "text": "自然气候数据"}, {"label": "C", "text": "重大项目建设情况"}, {"label": "D", "text": "历史年负荷和电量数据"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第6章：6.1.4 负荷预测的基础数据包括经济社会发展规划和国土空间规划数据、自然气候数据、重大项目建设情况、上级电网规划对本规划区域的负荷预测结果、历史年负荷和电量数据等。配电网规划应积累和   采用规范的负荷及电量历史数据作为预测依据。"}, {"category": "配电网规划", "type": "多选题", "question": "配电网规划常用的负荷预测方法有：（）等。", "options": [{"label": "A", "text": "空间负荷预测法"}, {"label": "B", "text": "弹性系数法"}, {"label": "C", "text": "负荷密度法"}, {"label": "D", "text": "定量分析预测法"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第6章：6.1配电网规划常用的负荷预测方法有：空间负荷预测法、弹性系数法、单耗法、负荷密度法、趋势外推法等。"}, {"category": "配电网规划", "type": "多选题", "question": "以下关于电力平衡的说法正确的是：（）。", "options": [{"label": "A", "text": "对于分布式电源较多的区域，应同时进行电力平衡和电量平衡计算，以分析规划方案的财务可行性。"}, {"label": "B", "text": "分电压等级电力平衡应结合负荷预测结果和现有变电容量，确定该电压等级所需新增的变电容量"}, {"label": "C", "text": "电力平衡应分区、分电压等级、分年度进行"}, {"label": "D", "text": "电力平衡可不考虑各类新能源、电动汽车、储能装置的影响"}], "answer": "ABC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第6章：6.3"}, {"category": "配电网规划", "type": "多选题", "question": "下列关于供电安全准则的说法错误的是（）.", "options": [{"label": "A", "text": "对于停电范围不大于 2MW 的组负荷，允许故障修复后恢复供电，恢复供电的时间与故障修复时间相同。"}, {"label": "B", "text": "对于停电范围在 2～12MW 的组负荷，其中不小于组负荷减 2MW 的负荷应在 2小时内恢复供电；余下的负荷允许故障修复后恢复供电，恢复供电的时间与故障修复时间相同。"}, {"label": "C", "text": "对于停电范围在 12～180MW 的组负荷，其中不小于组负荷减 12MW 的负荷或者不小于三分之二的组负荷（两者取小值）应在 15分钟内恢复供电，余下的负荷应在 3 小时内恢复供电。"}, {"label": "D", "text": "第三级供电安全水平哟要求，停电故障主要涉及变电站的高压进线或主变压器，停电范围仅限于故障变电站所带的负荷，其中大部分负荷应在 15 分钟内恢复供电，其它负荷应在 2小时内恢复供电。"}], "answer": "BD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：7.2"}, {"category": "配电网规划", "type": "多选题", "question": "A+、A、B、C 类供电区的配电网结构应满足以下基本要求（）。", "options": [{"label": "A", "text": "接入一定容量的分布式电源时，应合理选择接入点，控制短路电流及电压水平。"}, {"label": "B", "text": "变电站（包括直接配出 10kV 线路的 220kV 变电站）的 10kV 出线所供负荷宜均衡，应有合理的分段和联络；故障或检修时，应具有转供非停运段负荷的能力。"}, {"label": "C", "text": "正常运行时，各变电站应有相互独立的供电区域，供电区不交叉、不重叠，故障或检修时，变电站之间应有一定比例的负荷转供能力。"}, {"label": "D", "text": "高可靠性的配电网结构应具备网络重构能力，便于实现故障自动隔离。"}], "answer": "ABCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第8章：8.1.2"}, {"category": "配电网规划", "type": "多选题", "question": "以下哪些选项是确定容载比要考虑的因素（）。", "options": [{"label": "A", "text": "负荷分散系数"}, {"label": "B", "text": "线路负载率"}, {"label": "C", "text": "平均功率因数"}, {"label": "D", "text": "负荷增长率"}], "answer": "ACD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：7.3容载比的确定要考虑负荷分散系数、平均功率因数、变压器负载率、储备系数、负荷增长率等主要因素的影响。"}, {"category": "配电网规划", "type": "多选题", "question": "有关容载比的选项正确的是（）。", "options": [{"label": "A", "text": "容载比是35～110kV 电网规划中衡量供电能力的重要宏观性指标，合理的容载比与网架结构相结合，可确保故障时负荷的有序转移，保障供电可靠性，满足负荷增长需求。"}, {"label": "B", "text": "根据行政区县或供电分区经济增长和社会发展的不同阶段，对应的配电网负荷增长速度可分为饱和、较慢、中等、较快四种情况，总体宜控制在 1.5～1.9。"}, {"label": "C", "text": "对处于负荷发展初期或负荷快速发展阶段的规划区域、需满足“N-1-1”安全准则的规划区域以及负荷分散程度较高的规划区域，可取容载比建议值上限。"}, {"label": "D", "text": "a)    对于变电站内主变台数配置较多、中压配电网转移能力较强的区域，可取容载比建议值下限；   反之可取容载比建议值上限。"}], "answer": "ACD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：7.3"}, {"category": "配电网规划", "type": "多选题", "question": "有关无功补偿的选项正确的是（）。", "options": [{"label": "A", "text": "在供电距离远、功率因数低的 10kV 架空线路上可适当安装无功补偿装置，其容量应经过计算确定， 且不宜在低谷负荷时向系统倒送无功。"}, {"label": "B", "text": "分布式电源接入电网后，原则上不应从电网吸收无功，否则需配置合理的无功补偿装置。"}, {"label": "C", "text": "10～35kV 电网应根据网络结构、电缆所占比例、主变负载率、负荷侧功率因数等条件，经计算确定无功配置方案。"}, {"label": "D", "text": "配电变压器的无功补偿装置容量应依据变压器最大负载率、负荷自然功率因数等进行配置。"}], "answer": "ABD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：7.6"}, {"category": "配电网规划", "type": "多选题", "question": "有关中性点接地方式的选项错误的是（）。", "options": [{"label": "A", "text": "35kV、10kV 系统可采用不接地、消弧线圈接地或低电阻接地方式。"}, {"label": "B", "text": "中性点接地方式一般可分为直接接地方式和阻性接地方式两大类。"}, {"label": "C", "text": "110kV 系统采用非直接接地方式。"}, {"label": "D", "text": "66kV 系统宜采用经消弧线圈接地方式。"}], "answer": "BC", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：7.5"}, {"category": "配电网规划", "type": "多选题", "question": "10kV 配电网中性点接地方式的选择应遵循以下原则：（）。", "options": [{"label": "A", "text": "单相接地故障电容电流在 20A 及以下，宜采用中性点不接地方式。"}, {"label": "B", "text": "单相接地故障电容电流在 10A 及以下，宜采用中性点不接地方式。"}, {"label": "C", "text": "单相接地故障电容电流在 10A～150A，宜采用中性点经消弧线圈接地方式。"}, {"label": "D", "text": "单相接地故障电容电流达到 150A 以上，宜采用中性点经低电阻接地方式，并应将接地电流控制在 150A～800A 范围内。"}], "answer": "BCD", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第7章：7.5.7"}, {"category": "配电网规划", "type": "判断题", "question": "配电网规划在计算饱和负荷密度时，应扣除110（66）kV及以上专线负荷，以及高山、戈壁、荒漠、水域、森林等无效供电面积。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第5章"}, {"category": "配电网规划", "type": "判断题", "question": "配电网规划时供电区域面积不宜小于5km²。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第5章"}, {"category": "配电网规划", "type": "判断题", "question": "供电区域划分应在地市级公司指导下统一开展，在一个规划周期内（一般五年）供电区域类型应相对稳定。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第5章：供电区域划分应在省级公司指导下统一开展，在一个规划周期内（一般五年）供电区域类型应相对稳定。"}, {"category": "配电网规划", "type": "判断题", "question": "供电分区是开展高压配电网规划的基本单位，主要用于高压配电网变电站布点和目标网架构建。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第5章"}, {"category": "配电网规划", "type": "判断题", "question": "供电网格是开展中压配电网目标网架规划的基本单位。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第5章"}, {"category": "配电网规划", "type": "判断题", "question": "配电网规划设计的负荷预测主要包括饱和负荷预测和近中期负荷预测，饱和负荷预测主要用于制定过渡网架方案和指导项目安排，近中期负荷预测是构建目标网架的基础。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第6章"}, {"category": "配电网规划", "type": "判断题", "question": "容载比是中低压配电网规划中衡量供电能力的重要宏观性指标。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "配电网供电安全标准的一般原则为：接入的负荷规模越大、停电损失越大，其供电可靠性要求越高、恢复供电时间要求越短。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "根据组负荷规模的大小，配电网的供电安全水平可分为三个等级。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "配电网供电质量主要包括供电可靠性和电能质量两个方面。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "配电网供电可靠性指标主要包括系统平均停电时间、系统平均停电频率等，宜在成熟地区逐步推广以变压器为单位的供电可靠性统计。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "对处于系统末端、短路容量较小的供电区域，可通过适当增大主变容量、采用主变并列运行等方式，减小系统短路容量，保障电压合格率。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "10kV配电设备应逐步推广一二次融合开关等技术，快速隔离单相接地故障点，缩短接地运行时间，避免人身触电事件。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "配电网中性点接地方式对设备绝缘水平没有直接影响。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "中压线路有联络的变电站宜采用相同的中性点接地方式，以利于负荷转供", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "中性点接地方式不同的配电网应避免互带负荷。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "配电网无功补偿可采用变电站集中补偿和分散就地补偿相结合，接近用电端的分散补偿装置主要用于提高功率因数，降低线路损耗；集中安装在变电站内的无功补偿装置主要用于控制电压水平。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "对于电缆化率较高的地区，应配置适当容量的容性无功补偿装置。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章"}, {"category": "配电网规划", "type": "判断题", "question": "合理的电网结构是满足电网安全可靠、提高运行灵活性、降低网 线不含开关站的出线。"}, {"category": "配电网规划", "type": "判断题", "question": "供电安全水平是指配电网在运行中承受故障扰动的能力，其评价标准是某种停运条件下的供电恢复容量和供电恢复时间。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第3章：供电安全水平，配电网在运行中承受故障扰动（如失去元件或发生短路故障）的能力，其评价指标是某种停运条件下（通常指N-1或N-1-1停运后）的供电恢复容量和供电恢复时间。"}, {"category": "配电网规划", "type": "判断题", "question": "供电可靠性指标主要包括用户用电质量、用户年平均用电时间、用户年平均停电时间、用户年平均停电次数。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章： 供电可靠性指标主要包括系统平均停电时间、系统平均停电频率等，宜在成熟地区逐步推广以终端用户为单位的供电可靠性统计。"}, {"category": "配电网规划", "type": "判断题", "question": "供电可靠性是指配电网向用户持续供电的能力。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第3章"}, {"category": "配电网规划", "type": "判断题", "question": "35kV架空网宜采用中性点经消弧线圈接地方式；35kV电缆网宜采用中性点经高电阻接地方式。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第7章：35kV架空网宜采用中性点经消弧线圈接地方式；35kV电缆网宜采用中性点经低电阻接地方式，\n宜将接地电流控制在1000A以下。"}, {"category": "配电网规划", "type": "判断题", "question": "中压配电网结构主要有：链式、双环式、单环式、多分段适度联络和辐射状结构。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第8章：中压配电网结构应适度加强、范围清晰，中压线路之间联络应尽量在同一供电网格（单元）之内，避免过多接线组混杂交织，主要有双环式、单环式、多分段适度联络、多分段单联络、多分段单辐射结构。"}, {"category": "配电网规划", "type": "判断题", "question": "变电站间和中压线路间的转供能力与变压器容量裕度无关。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)第8章：变电站间和中压线路间的转供能力，主要取决于正常运行时的变压器容量裕度、线路容量裕度、\n中压主干线的合理分段数和联络情况等"}, {"category": "配电网规划", "type": "判断题", "question": "10kV及以下线路的供电距离指从变电站(配电变压器)出线到其供电的最远负荷点之间的线路长度。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "配电网规划设计技术导则(Q/GDW 10738-2020)：10kV及以下线路的供电距离指从变电站(配电变压器)出线到其供电的最远负荷点之间的线路长度。"}, {"category": "配电网规划", "type": "判断题", "question": "配电室为低压电力用户配送电能的户内配电场所，主要设有中压进线(可有少量配出线)、配电变压器和低压配电装置。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "配电网规划设计规程DL/T 5542-2018：2.0.22"}, {"category": "配电网规划", "type": "判断题", "question": "配电室一般配置双路电源， 10kV侧一般采用环网开关，220/380V侧为单母线分段接线。变压器接线组别一般采用 Dyn11。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "(Q/GDW 10738 - 2020)《配电网规划设计技术导则》第9.5.3配电室：\na)配电室一般配置双路电源， 10kV侧一般采用环网开关，220/380V侧为单母线分段接线。变压器接线组别一般采用 Dyn11，单台容量不宜超过800kVA，宜三相均衡接入负荷。"}, {"category": "配电网规划", "type": "判断题", "question": "配电室一般独立建设。受条件所限必须进楼时，可设置在地下一层，但不宜设置在最底层。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "(Q/GDW 10738 - 2020)《配电网规划设计技术导则》第9.5.3配电室 ：b)配电室一般独立建设。受条件所限必须进楼时，可设置在地下一层，但不宜设置在最底层。"}, {"category": "配电网规划", "type": "简答题", "question": "配电网规划设计近期（5年）、中期（10年）、远期（15年及以上）三个阶段研究重点分别是什么？", "options": [], "answer": "答：（1)近期规划设计研究重点为解决当前配电网存在的主要问题，提高供电能力和可靠性，满足负荷需要，并依据近期规划设计编制年度项目计划。\n（2）中期规划设计研究重点为将现有配电网网架逐步过渡到目标网架，预留变电站站址和线路通道；中期规划应与近期规划相衔接，明确配电网发展目标，对近期规划起指导作用。\n（3）远期规划设计研究侧重于战略性研究和展望，主要考虑配电网的长远发展目标，根据饱和负荷水平的预测结果，提出配电网发展需求，确定目标网架，预留高压变电站站址及高、中压线路廊道。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网规划设计宜逐年评估和滚动调整，当发生哪些情况时，应对配电网发展目标、建设方案和投资估算等进行修编？", "options": [], "answer": "答：（1）城乡发展规划发生调整或修改后；\n（2）上级电网规划发生调整或修改后；\n（3）接入配电网的电源规划发生重大调整或修改后；\n（4）预测负荷水平有较大变动时；\n（5）电网技术有较大发展时。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "供电区域划分主要依据有哪些？", "options": [], "answer": "答: 供电区域划分是配电网差异化规划的重要基础，用于确定区域内配电网规划建设标准，主要依据饱和负荷密度，也可参考行政级别、经济发达程度、城市功能定位、用户重要程度、用电水平、GDP等因素确定。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "A+、A、B、C、D、E类供电区域主要分布哪些地区？", "options": [], "answer": "答: A+类供电区域主要为直辖市市中心城区，或省会城市、计划单列市核心区。A类供电区域主要为地市级及以上城区。B类供电区域主要为县级及以上城区。C类供电区域主要城镇区域。D类供电区域主要乡村地区。E类供电区域主要为农牧区。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "A+、A、B、C、D、E类供电区域的电网结构应满足哪些基本要求？", "options": [], "answer": "答: A+、A、B、C类供电区域的配电网结构应满足以下基本要求：\n（1）正常运行时，各变电站（包括直接配出10kV线路的220kV变电站）应有相对独立的供电范围，供电范围不交叉、不重叠，故障或检修时，变电站之间应有一定比例的负荷转供能力。\n（2）变电站（包括直接配出10kV线路的220kV变电站）的10kV出线所供负荷宜均衡，应有合理的分段和联络；故障或检修时，应具有转供非停运段负荷的能力。\n（3）接入一定容量的分布式电源时，应合理选择接入点，控制短路电流及电压水平。\n（4）高可靠性的配电网结构应具备实现网络重构的条件，便于实现故障自动隔离。\nD、E类供电区域的配电网以满足基本用电需求为主，可采用辐射状结构。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "什么是配电网的转供能力？主要取决于哪些因素？", "options": [], "answer": "答：转供能力是指某一供电区域内，当电网元件发生停运时电网转移负荷的能力。一般量化为可转移的负荷占该区域总负荷的比例。\n变电站间和中压线路间的转供能力，主要取决于正常运行时的变压器容量裕度、线路容量裕度、中压主干线的合理分段数和联络情况等。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网主要电压序列有哪些？", "options": [], "answer": "答：配电网应优化配置电压序列，简化变压层次，避免重复降压。主要电压等级序列有：\n（1）110/10/0.38kV\n（2）66/10/0.38kV\n（3）35/10/0.38kV\n（4）110/35/10/0.38kV\n（5）35/0.38kV", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "什么是容载比？容载比的确定要考虑因素的影响？", "options": [], "answer": "答：容载比是指某一规划区域、某一电压等级电网的公用变电设备总容量与对应网供最大负荷的比值。容载比是110～35kV电网规划中衡量供电能力的重要宏观性指标，合理的容载比与网架结构相结合，可确保故障时负荷的有序转移，保障供电可靠性，满足负荷增长需求。容载比的确定要考虑负荷分散系数、平均功率因数、变压器负载率、储备系数、负荷增长率、负荷转移能力等因素的影响。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网供电安全标准的一般原则是什么？", "options": [], "answer": "答：配电网供电安全标准的一般原则为：接入的负荷规模越大、停电损失越大，其供电可靠性要求越高、恢复供电时间要求越短。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "什么是配电网的N-1停运？", "options": [], "answer": "答：配电网的N-1停运指高压配电网中一台变压器或一条线路故障或计划退出运行，中压配电线路中一个分段（包括架空线路的一个分段，电缆线路的一个环网单元或一段电缆进线本体）故障或计划退出运行。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "什么是配电网的N-1-1停运？", "options": [], "answer": "答：配电网的N-1-1停运指高压配电网中一台变压器或一条线路计划停运情况下，同级电网中相关联的另一台变压器或一条线路因故障退出运行。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "什么是配电网的供电安全水平？如何分级？", "options": [], "answer": "答：配电网的供电安全水平是配电网在运行中承受故障扰动（如失去元件或发生短路故障）的能力，其评价指标是某种停运条件下（通常指N-1或N-1-1停运后）的供电恢复容量和供电恢复时间。根据组负荷（负荷组的最大负荷）规模的大小，配电网的供电安全水平可分为第一级、第二级、第三级三个等级。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网的第一级供电安全水平有何要求？", "options": [], "answer": "答：（1）对于停电范围不大于2MW的组负荷，允许故障修复后恢复供电，恢复供电的时间与故障修复时间相同。\n（2）该级停电故障主要涉及低压线路故障、配电变压器故障，或采用特殊安保设计（如分段及联络开关均采用断路器，且全线采用纵差保护等）的中压线段故障。停电范围仅限于低压线路、配电变压器故障所影响的负荷、或特殊安保设计的中压线段，中压线路的其它线段不允许停电。\n（3）该级标准要求单台配电变压器所带的负荷不宜超过2MW，或采用特殊安保设计的中压分段上的负荷不宜超过2MW。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网的第二级供电安全水平有何要求？", "options": [], "answer": "答：（1）对于停电范围在2～12MW的组负荷，其中不小于组负荷减2MW的负荷应在3小时内恢复供电；余下的负荷允许故障修复后恢复供电，恢复供电时间与故障修复时间相同。\n（2）该级停电故障主要涉及中压线路故障，停电范围仅限于故障线路所供负荷，A+类供电区域的故障线路的非故障段应在5分钟内恢复供电，A类供电区域的故障线路的非故障段应在15分钟内恢复供电，B、C类供电区域的故障线路的非故障段应在3小时内恢复供电，故障段所供负荷应小于2MW，可在故障修复后恢复供电。\n（3）该级标准要求中压线路应合理分段，每段上的负荷不宜超过2MW，且线路之间应建立适当的联络。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网的第三级供电安全水平有何要求？", "options": [], "answer": "答：（1）对于停电范围在12～180MW的组负荷，其中不小于组负荷减12MW的负荷或者不小于三分之二的组负荷（两者取小值）应在15分钟内恢复供电，余下的负荷应在3小时内恢复供电。\n（2）该级停电故障主要涉及变电站的高压进线或主变压器，停电范围仅限于故障变电站所供负荷，其中大部分负荷应在15分钟内恢复供电，其它负荷应在3小时内恢复供电。\n（3）A+、A类供电区域故障变电站所供负荷应在15分钟内恢复供电；B、C类供电区域故障变电站所供负荷，其大部分负荷（不小于三分之二）应在15分钟内恢复供电，其余负荷应在3小时内恢复供电。\n（4）该级标准要求变电站的中压线路之间宜建立站间联络，变电站主变及高压线路可按N-1原则配置。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网的电压调节方式主要有哪些？", "options": [], "answer": "答：配电网应有足够的电压调节能力，将电压维持在规定范围内，主要有下列电压调整方式：\n（1）通过配置无功补偿装置进行电压调节；\n（2）选用有载或无载调压变压器，通过改变分接头进行电压调节；\n（3）通过线路调压器进行电压调节。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网近中期规划的供电质量目标应不低于什么标准？", "options": [], "answer": "答：配电网近中期规划的供电质量目标应不低于公司承诺标准：城市电网平均供电可靠率应达到99.9%，居民客户端平均电压合格率应达到98.5%；农村电网平均供电可靠率应达到99.8%，居民客户端平均电压合格率应达到97.5%；特殊边远地区电网平均供电可靠率和居民客户端平均电压合格率应符合国家有关监管要求。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "为合理控制配电网的短路容量，可采取哪些技术措施？", "options": [], "answer": "答：（1）配电网络分片、开环，母线分段，主变分列；\n（2）控制单台主变压器容量；\n（3）合理选择接线方式（如二次绕组为分裂式）或采用高阻抗变压器；\n（4）主变压器低压侧加装电抗器等限流装置。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "配电网中性点接地方式有哪几种? 分别适用何种电压等级？", "options": [], "answer": "答：中性点接地方式一般可分为有效接地方式和非有效接地方式两大类，非有效接地方式又分不接地、消弧线圈接地和阻性接地。\n（1）110kV系统应采用有效接地方式，中性点应经隔离开关接地；\n（2）66kV架空网系统宜采用经消弧线圈接地方式，电缆网系统宜采用低电阻接地方式；\n（3）35kV、10kV系统可采用不接地、消弧线圈接地或低电阻接地方式。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "35kV配电网中性点接地方式如何选择？", "options": [], "answer": "答：35kV架空网宜采用中性点经消弧线圈接地方式；35kV电缆网宜采用中性点经低电阻接地方式，宜将接地电流控制在1000A以下。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "10kV配电网中性点接地方式的选择应遵循什么原则？", "options": [], "answer": "答：（1）单相接地故障电容电流在10A及以下，宜采用中性点不接地方式；\n（2）单相接地故障电容电流超过10A且小于100～150A，宜采用中性点经消弧线圈接地方式；\n（3）单相接地故障电容电流超过100～150A以上，或以电缆网为主时，宜采用中性点经低电阻接地方式。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "10kV电缆和架空混合型配电网如采用中性点经低电阻接地方式，应采取哪些措施？", "options": [], "answer": "答：（1）提高架空线路绝缘化程度，降低单相接地跳闸次数；\n（2）完善线路分段和联络，提高负荷转供能力；\n（3）降低配电网设备、设施的接地电阻，将单相接地时的跨步电压和接触电压控制在规定范围内。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "消弧线圈改低电阻接地方式应符合哪些要求？", "options": [], "answer": "答：（1）馈线设零序保护，保护方式及定值选择应与低电阻阻值相配合；\n（2）低电阻接地方式改造，应同步实施用户侧和系统侧改造，用户侧零序保护和接地宜同步改造；\n（3）10kV配电变压器保护接地应与工作接地分开，间距经计算确定，防止变压器内部单相接地后低压中性线出现过高电压；\n（4）根据电容电流数值并结合区域规划成片改造。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "无功补偿的配置原则是什么？", "options": [], "answer": "答：电力系统配置的无功补偿装置应在系统有功负荷高峰和负荷低谷运行方式下，保证分（电压）层和分（供电）区的无功平衡。变电站、线路和配电台区的无功设备应协调配合，按以下原则进行无功补偿配置：\n（1）无功补偿装置应根据分层分区、就地平衡和便于调整电压的原则进行配置，可采用变电站集中补偿和分散就地补偿相结合，电网补偿与用户补偿相结合，高压补偿与低压补偿相结合等方式。接近用电端的分散补偿装置主要用于提高功率因数，降低线路损耗；集中安装在变电站内的无功补偿装置主要用于控制电压水平。\n（2）应从系统角度考虑无功补偿装置的优化配置，以利于全网无功补偿装置的优化投切。\n（3）变电站无功补偿配置应与变压器分接头的选择相配合，以保证电压质量和系统无功平衡。\n（4）对于电缆化率较高的地区，应配置适当容量的感性无功补偿装置。\n（5）接入中压及以上配电网的用户应按照电力系统有关电力用户功率因数的要求配置无功补偿装置，并不得向系统倒送无功。\n（6）在配置无功补偿装置时应考虑谐波治理措施。\n（7）分布式电源接入电网后，原则上不应从电网吸收无功，否则需配置合理的无功补偿装置。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "35～110kV变电站一般如何配置无功补偿装置？", "options": [], "answer": "答：110～35kV变电站一般宜在变压器低压侧配置自动投切或动态连续调节无功补偿装置，使变压器高压侧的功率因数在高峰负荷时不应低于0.95，在低谷负荷时不应高于0.95，无功补偿装置总容量应经计算确定。对于有感性无功补偿需求的，可采用静止无功发生器（SVG）。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "中压配电网如何配置无功补偿装置？", "options": [], "answer": "答：配电变压器的无功补偿装置容量应依据变压器最大负载率、负荷自然功率因数等进行配置。在电能质量要求高、电缆化率高的区域，配电室低压侧无功补偿方式可采用静止无功发生器（SVG）。在供电距离远、功率因数低的10kV架空线路上可适当安装无功补偿装置，其容量应经过计算确定，且不宜在低谷负荷时向系统倒送无功。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "各电压等级配电网的主要结构分别有哪些？", "options": [], "answer": "答：（1）高压配电网结构应适当简化，主要有：链式、环网和辐射状结构；变电站接入方式主要有：T接和π接等。\n（2）中压配电网结构应适度加强、范围清晰，中压线路之间联络应尽量在同一供电网格（单元）之内，避免过多接线组混杂交织，主要有：双环式、单环式、多分段适度联络、多分段单联络、多分段单辐射结构。\n（3）低压配电网实行分区供电，结构应尽量简单，一般采用辐射结构。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "什么是中压配电网的网络重构？", "options": [], "answer": "答：网络重构是指在中压配电网中，为实现隔离故障、恢复非故障区段、消除过载、平衡负荷、降低网损、提高电压质量的目的，通过改变分段开关、联络开关的分合状态，重新组合优化网络运行结构。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "根据《配电网规划设计技术导则》，什么是中低压配电线路的供电距离以及变电站、配电变压器的供电半径？", "options": [], "answer": "答：中低压配电线路的供电距离是指从变电站（配电变压器）出线到其供电的最远负荷点之间的线路长度。\n变电站的供电半径为变电站的10（20、6）kV出线供电距离的平均值。\n配电变压器的供电半径为配电变压器的低压出线供电距离的平均值。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "35～110kV线路导线截面的选取需符合哪些要求？", "options": [], "answer": "答：（1）线路导线截面宜综合饱和负荷状况、线路全寿命周期选定。\n（2）线路导线截面应与电网结构、变压器容量和台数相匹配。\n（3）线路导线截面应按照安全电流裕度选取，并以经济载荷范围校核。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "各类供电区域35～110kV架空线路截面积选取要求是多少？", "options": [], "answer": "答：A+、A、B类供电区域110（66）kV架空线路截面不宜小于240mm2，35kV架空线路截面不宜小于150mm2；C、D、E类供电区域110kV架空线路截面不宜小于150mm2，66kV、35kV架空线路截面不宜小于120mm2。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "中压架空线路分段、分支及联络点一般如何配置？", "options": [], "answer": "答：中压架空线路主干线应根据线路长度和负荷分布情况进行分段（一般分为3段，不宜超过5段），并装设分段开关，且不应装设在变电站出口首端出线电杆上。重要或较大分支线路首端宜安装分支开关。\n中压架空线路联络点的数量根据周边电源情况和线路负载大小确定，一般不超过3个联络点。架空网具备条件时，宜在主干线路末端进行联络。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "10kV配电室的配置原则是什么？", "options": [], "answer": "答：（1）配电室一般配置双路电源，10kV侧一般采用环网开关，220/380V侧为单母线分段接线。变压器绕组联结组别应采用Dyn11，单台容量不宜超过800kVA，宜三相均衡接入负荷。\n（2）配电室一般独立建设。受条件所限必须进楼时，可设置在地下一层，但不应设置在最底层。变压器宜选用干式（非独立式或者建筑物地下配电室应选用干式变压器），采取屏蔽、减振、降噪、防潮措施，并满足防火、防水和防小动物等要求。易涝区域配电室不应设置在地下。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "柱上开关的配置的原则是什么？", "options": [], "answer": "答：（1）一般采用柱上负荷开关作为线路分段、联络开关。长线路后段（超出变电站过流保护范围）、大分支线路首端、用户分界点处可采用柱上断路器，并上传动作信号。\n（2）规划实施配电自动化的地区，所选用的开关应满足自动化改造要求，并预留自动化接口。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "开关站的配置原则是什么？", "options": [], "answer": "答（1）开关站宜建于负荷中心区，一般配置双电源，分别取自不同变电站或同一座变电站的不同母线。\n（2）开关站接线宜简化，一般采用两路电源进线、6～12路出线，单母线分段接线，出线断路器带保护。开关站应按配电自动化要求设计并留有发展余地。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "双回路、双电源、多电源分别是什么？", "options": [], "answer": "答：双回路指为同一用户负荷供电的两回供电线路，两回供电线路可以来自同一变电站的同一母线段。\n双电源指为同一用户负荷供电的两回供电线路，两回供电线路可以分别来自两个不同变电站，或来自不同电源进线的同一变电站内两段母线。\n多电源指为同一用户负荷供电的两回以上供电线路，至少有两回供电线路分别来自两个不同变电站。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "重要电力用户供电电源如何配置？", "options": [], "answer": "答：重要电力用户供电电源应采用多电源、双电源或双回路供电，当任何一路或一路以上电源发生故障时，至少仍有一路电源应能满足保安负荷供电要求。特级重要电力用户应采用多电源供电；一级重要电力用户至少应采用双电源供电；二级重要电力用户至少应采用双回路供电。\n重要电力用户应自备应急电源，电源容量至少应满足全部保安负荷正常供电的要求，并应符合国家有关技术规范和标准要求。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网规划", "type": "简答题", "question": "电源接入配电网并网电压等级可根据装机容量进行初步选择，各电压等级对应的装机容量分别是多少？", "options": [], "answer": "答：接入配电网电源总容量范围在8kW及以下时可接入220V；8kW～400kW可接入380V；400kW～6MW可接入10kV；6MW～100MW可接入35kV、66kV、110kV，最终并网电压等级应根据电网条件，通过技术经济比较论证后确定。", "analysis": "出自《配电网规划设计技术导则》(Q/GDW 10738-2020)"}, {"category": "配电网一次设备", "type": "单选题", "question": "(   )是支承架空线路导线，并使导线与导线之间，导线与杆塔之间，以及导线对大地和交叉跨越物之间有足够的安全距离。", "options": [{"label": "A", "text": "扒杆"}, {"label": "B", "text": "杆塔"}, {"label": "C", "text": "撑杆"}, {"label": "D", "text": "塔吊"}], "answer": "B", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第一章,模块3：杆塔是支承架空线路导线，并使导线与导线之间，导线与杆塔之间，以及导线对大地和交叉跨越物之间有足够的安全距离。"}, {"category": "配电网一次设备", "type": "单选题", "question": "(   )用在线路首末的两终端处，是耐张杆的一种，正常情况下除承受导线的重量和水平风力荷载外，还要承受顺线路方向导线全部拉力的合力。", "options": [{"label": "A", "text": "末梢杆"}, {"label": "B", "text": "中继杆"}, {"label": "C", "text": "受电杆"}, {"label": "D", "text": "终端杆"}], "answer": "D", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第一章，模块3：终端杆用在线路首末的两终端处，是耐张杆的一种，正常情况下除承受导线的重量和水平风力荷载外，还要承受顺线路方向导线全部拉力的合力。"}, {"category": "配电网一次设备", "type": "单选题", "question": "(   )依靠自身重量和填土方的总合力来承受拉线的上拔力，以保持杆塔的平衡。", "options": [{"label": "A", "text": "底盘"}, {"label": "B", "text": "卡拉盘"}, {"label": "C", "text": "拉线盘"}, {"label": "D", "text": "卡盘"}], "answer": "C", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第一章，模块3：拉线盘依靠自身重量和填土方的总合力来承受拉线的上拔力，以保持杆塔的平衡。"}, {"category": "配电网一次设备", "type": "单选题", "question": "(   )是充分利用钢绞线的机械强度高和铝的导电性能好的特点，把这两种金属线结合起来而形成。", "options": [{"lab ype": "单选题", "question": "电缆的(   )的作用是阻止水分、潮气及其他有害物质侵入绝缘层，以确保绝缘层性能不变。", "options": [{"label": "A", "text": "外护套"}, {"label": "B", "text": "内护套"}, {"label": "C", "text": "防护套"}, {"label": "D", "text": "密闭套"}], "answer": "B", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第五章，模块2：内护套的作用是阻止水分、潮气及其他有害物质侵入绝缘层，以确保绝缘层性能不变。"}, {"category": "配电网一次设备", "type": "单选题", "question": "(   )是电缆具备必须的机械强度。", "options": [{"label": "A", "text": "金属层"}, {"label": "B", "text": "防护层"}, {"label": "C", "text": "外护套"}, {"label": "D", "text": "铠装层"}], "answer": "D", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第五章，模块2：铠装层是电缆具备必须的机械强度。"}, {"category": "配电网一次设备", "type": "单选题", "question": "电缆的(   )主要是用于保护铠装层或金属护套免受化学腐蚀及其他环境损害。", "options": [{"label": "A", "text": "外护套"}, {"label": "B", "text": "外接层"}, {"label": "C", "text": "外被层"}, {"label": "D", "text": "外护层"}], "answer": "C", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第五章，模块2：外被层主要是用于保护铠装层或金属护套免受化学腐蚀及其他环境损害。"}, {"category": "配电网一次设备", "type": "单选题", "question": "电缆分支箱的主要作用是将电缆(   )或转接。", "options": [{"label": "A", "text": "连接"}, {"label": "B", "text": "分送"}, {"label": "C", "text": "分接"}, {"label": "D", "text": "分配"}], "answer": "C", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第二章，模块2：电缆分支箱的主要作用是将电缆分接或转接。"}, {"category": "配电网一次设备", "type": "单选题", "question": "根据经验在(   )m以上的电缆线路上，如果电缆中间有多个中间接头，为了确保安全，会在其中考虑电缆分支箱进行转接。", "options": [{"label": "A", "text": "500"}, {"label": "B", "text": "1000"}, {"label": "C", "text": "1500"}, {"label": "D", "text": "2000"}], "answer": "B", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第二章，模块2：根据经验在1000米以上的电缆线路上，如果电缆中间有多个中间接头，为了确保安全，会在其中考虑电缆分支箱进行转接。"}, {"category": "配电网一次设备", "type": "单选题", "question": "随着技术的进步，出现了(   )负荷开关分断的电缆分支箱，可实现环网柜的功能，而且价格又低于环网柜，在户外起到代替开关站的重要作用。", "options": [{"label": "A", "text": "空气绝缘"}, {"label": "B", "text": "真空"}, {"label": "C", "text": "SF6"}, {"label": "D", "text": "固体绝缘"}], "answer": "C", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第二章，模块2：随着技术的进步，出现了SF6负荷开关分断的电缆分支箱，可实现环网柜的功能，而且价格又低于环网柜，在户外起 abel": "错误", "text": "错误"}], "answer": "错误", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《农电配电》第七章，模块6：无间隙氧化锌避雷器的额定电压为系统施加到其两端子间的最大允许工频电压有效值，它不等于系统的标称电压。"}, {"category": "配电网一次设备", "type": "判断题", "question": "箱式变电站是指将高低压开关设备和变压器共同安装于一个封闭箱体内的户外配电装置。(   )", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《配电线路运行》第二章，模块3：箱式变电站是指将高低压开关设备和变压器共同安装于一个封闭箱体内的户外配电装置。"}, {"category": "配电网一次设备", "type": "判断题", "question": "SF6封闭母线气室压力升高，应带电处理。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《电网调度》，北京：中国电力出版社，2015年"}, {"category": "配电网一次设备", "type": "判断题", "question": "发现母线绝缘子断裂、破损、放电等异常情况时，在停电换绝缘子前，应加强对破损绝缘子的监视，增加巡视检查次数，并做好事故预想与处理准备。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "国家电网公司生产技能人员职业能力培训专用教材《电网调度》，北京：中国电力出版社，2015年"}, {"category": "配电网一次设备", "type": "判断题", "question": "汽轮机振动方向分垂直、横向、轴向三种，轴向和垂直振动较大。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "集控运行.北京：中国电力出版社，2011.2(2015.7重印）"}, {"category": "配电网一次设备", "type": "判断题", "question": "对电缆外护套施加10kV直流，2min不发生击穿。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "全国电力高职高专“十二五”规划教材电力技术类（电力工程）专业系列教材《电气设备运行与检修》"}, {"category": "配电网一次设备", "type": "判断题", "question": "交叉互联箱与护层保护器运用在长线路的单相电缆中，来限制长电缆金属护套上的感应电", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "全国电力高职高专“十二五”规划教材电力技术类（电力工程）专业系列教材《电气设备运行与检修》"}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是导线？常见配电线路的导线种类有哪些？", "options": [], "answer": "导线用以传导电流、输送电能，它通过绝缘子串长期悬挂在杆塔上。配电线路的导线包括常用裸导线和绝缘导线，常用裸导线包括裸铝导线、裸铜导线、钢芯铝绞线、镀锌钢绞线、铝合金绞线五种。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "架空绝缘配电线路适用于何种区域？如何分类？", "options": [], "answer": "架空绝缘配电线路适用于城市人口密集地区，线路走廊狭窄、架设裸导线线路与建筑物的间距不能满足安全要求的地区，以及风景绿化区、林带区和污秽严重的地区等。架空绝缘配电线路按电压等级可分为中压绝缘导线、低压绝缘导线；按架设方式可分为分相架设、集束架设。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "架空绝缘导线主要采取的防雷措施是什么？", "options": [], "answer": "① 安装架空地线；② 安装防雷绝缘子；③ 安装放电线夹；④ 安装线路过电压保护器；⑤ 延长闪络路径；⑥ 局部剥离导线绝缘。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "架空裸导线主要采取的防雷措施是什么？", "options": [], "answer": "① 安装避雷线；② 安装避雷器；③ 改善配电网杆塔和防雷装置的接地条件；④ 电容电流大于 10A 的电网安装自动跟踪补偿消弧装置。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是电力电缆？", "options": [], "answer": "电力电缆是指外包绝缘的交合导线，有的还包金属外皮并加以接地。电力电缆的基本结构一般由导体、绝缘层、防护层三部分组成，6kV 及以上电缆导体外和绝缘层外还增加了屏蔽层（导体和绝缘层之间的屏蔽层，称为内屏蔽层；绝缘层和护层之间的屏蔽层，称为外屏蔽层，内外屏蔽层位置不同，作用也不同）。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "电力电缆如何分类？", "options": [], "answer": "电力电缆按电压等级可分为低压、中压、高压、超高压和特高压电缆五种；按安装电缆芯线的数量不同，可分为单芯电缆和多芯电缆两种；按电缆的绝缘材料不同，可分为油浸纸绝缘电缆、塑料绝缘电缆和橡皮绝缘电缆三种。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "电力电缆的敷设方式有哪些？有何优缺点？", "options": [], "answer": "电力电缆的敷设方式有直埋敷设、排管敷设、电缆沟敷设三种。（1）直埋敷设的优点是：电缆敷设后本体与空气不接触，防火性能好，有利于电缆散热；容易实施，投资少。缺点是：抗外力破坏能力差；电缆敷设后如进行更换，难度较大。（2）排管敷设的优点是：受外力破坏影响少，占地小，能承受较大的荷重，电缆敷设无相互影响，施工简单。缺点是：土建成本高，不能直接转弯，散热条件差。（3）电缆沟敷设的优点：检修、更换电缆较方便，灵活多样，转弯方便，可根据地坪高程变化调整电缆敷设高程。缺点是：施工检查及更换电缆时须搬运大量盖板，施工时外物不慎落入沟时易将电缆碰伤。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "35kV 及以下电压等级电缆线路主要采取的防雷措施是什么？", "options": [], "answer": "对于 35kV 及以下电压等级的电力电缆，基本上应采取在电缆终端头附近安装避雷器，同时终端头金属屏蔽、铠装必须接地良好。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "配电网配电设备一般有哪些？", "options": [], "answer": "配电网配电设备主要有配电变压器，测量设备（电压互感器、电流互感器），开断设备（断路器、负荷开关、熔断器、隔离开关、重合器、分段器），防雷与接地装置，无功补偿装置，成套配电装置（开关站、环网单元、箱变、电缆分箱），新型设备（多功能防雷器、无线遥控跌落式熔断器、高压分界真空断路器）。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是环网单元？有何用途？", "options": [], "answer": "环网单元也称环网柜或开闭器，用于中压电缆线路分段、联络及分接负荷。设备选用气体绝缘环网柜（共箱式）和固体绝缘环网柜。适用于电缆走廊紧张区域公用配电站和小容量 10kV 供电客户的前置环网，以减少多回路放射电缆，节约路径资源和电缆工程投资；适宜地势狭小、选址困难区域。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是开关站？有何用途？", "options": [], "answer": "开关站又称开闭所，是城市配电网的重要组成部分。它的主要作用是加强配电网的联络控制，提高配电网供电的灵活性和可靠性，是电缆线路的联络和支线节点，同时还具备变电站母线的延伸作用。在不改变电压等级的情况下，对电能进行二次分配，为周围的用户提供供电电源。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是配电室？有何用途？", "options": [], "answer": "配电室主要为低压用户配送电能，设有中压进线（可有少量出线）、配电变压器和低压配电装置，带有低压负荷的户内配电场所。配电室是最后一级变压场所，通常将电网电压从 10kV（20kV）降低到 400V，为局部供应电力。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是箱式变电站？有何用途？", "options": [], "answer": "箱式变电站是指将高低压开关设备和变压器共同安装于一个封闭箱体内的户外配电装置。主要作用就是为高压或低压用户提供所需电能。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "配电站所主要采取的防雷措施是什么？", "options": [], "answer": "配电站所（包括环网单元、开关站、配电室、箱式变电站）为防止侵入雷电波，应在每一路进（出）线及每一段母线上安装避雷器。具有电缆进（出）线段的架空线路，应在架空线路与电缆终端盒接续处，装设避雷器并作集中接地装置。避雷器的接地线还应和电缆头（电缆）金属外皮相连，电缆另一端的终端盒与变电站的接地网相连。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是电缆分支箱？有何主要作用？", "options": [], "answer": "电缆分支箱是配电线路中，电缆与电缆、电缆与其他电器设备连接的中间部分，其连接组合方式简单方便、灵活，具有全绝缘、全封闭、防腐蚀、免维护、安全可靠等性能，\n广泛用于商业中心、工业园区、城市住宅小区。随着配电网电缆化进程的发展，当容量不大的独立负荷分布较集中时，可使用电缆分支箱进行电缆多分支的连接。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是配电变压器？主要由哪些元件构成？", "options": [], "answer": "用于配电系统将中压配电电压的功率变换成低压配电电压功率，供各种低压电气设备用电的电力变压器，叫配电变压器。配电变压器容量小，一般在 2500kVA 及以下，一次电\n压也较低，都在 20kV 及以下。配电变压器的主要元件包括铁芯、绕组、套管、调压装置等。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是配电变压器的调压装置？主要有哪几种？", "options": [], "answer": "配电变压器的调压装置是控制变压器输出电压在指定范围内变动的调节组件，又称分接开关。工作原理是通过改变一次和二次绕组的匝数比来改变变压器的电压变化，从而达\n到调压的目的。\n配电变压器的调压装置分为无载调压装置和有载调压装置两种。无载调压装置俗称无载分接开关，是在变压器不带电条件下切换绕组中线圈抽头以实现调压的装置，通常采用手动操作。有载调压装置也叫有载分接开关，是在变压器不中断运行的带电状态下进行调压的装置。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "配电变压器的主要技术参数包括哪些？", "options": [], "answer": "配电变压器的主要技术参数包括相数、额定频率、额定容量、额定电压、额定电流、阻抗电压、负载损耗、空载电流、空载损耗和联结组别。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "三相配电变压器绕组连接方式主要有哪几种？", "options": [], "answer": "三相配电变压器绕组连接方式主要有星形和三角形连接方式两种。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "干式配电变压器有何特点？", "options": [], "answer": "干式配电变压器承受热冲击能力强，过负载能力大，难燃、防火性能高，对湿度、灰尘不敏感等优势，具有广泛的适应性。最适宜用于防火要求高，负荷波动大以及污秽潮湿\n的恶劣环境中。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "非晶合金铁芯配电变压器有何特点？", "options": [], "answer": "非晶合金配电变压器采用 Dyn11 联结组别，最突出的特点是比硅钢片铁芯变压器的空载损耗和空载电流低很多，它的空载损耗比传统的硅钢片铁芯的变压器低 60%～80%，\nCO2、SO2 排放量大大减少，具有明显的节能和环保效果。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "配电变压器主要采取的防雷措施是什么？", "options": [], "answer": "（1）阀式避雷器和金属氧化物避雷器是配电变压器防雷保护的基本保护元件，一般在配电变压器和跌落式熔断器之间安装避雷器，而阀式避雷器则要求尽量靠近变压器安装，\n距离越近越好。\n（2）采用“三位一体”的接线方式，即避雷器的接地线应与变压器低压绕组中性点及变压器金属外壳连接在一起共同接地。\n（3）采用 Z 型联结变压器。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "配电网柱上开关主要有哪几种？", "options": [], "answer": "配电网柱上开关主要有断路器、负荷开关、重合器、隔离开关等。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "柱上开关主要选用原则是什么？", "options": [], "answer": "1）规划实施配电自动化的地区，开关性能及自动化原理应一致，并预留自动化接口。\n（2）对过长的架空线路，当变电站出线断路器保护段不满足要求时，可在线路中后部安装重合器，或安装带过流保护的断路器。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "柱上开关主要采取的防雷措施是什么？", "options": [], "answer": "3～10kV 柱上断路器和负荷开关应装设避雷器保护。经常开路运行而又带电的柱上断路器、负荷开关或隔离开关，应在带电侧（联络开关应两侧）装设避雷器，其接地线应与\n柱上断路器等的金属外壳连接，且接地电阻不应超过 10Ω。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是断路器？有何特点？", "options": [], "answer": "断路器是指能够关合、承载和开断正常回路条件下的电流并能关合、在规定的时间内承载和开断异常回路条件下的电流的开关设备。断路器具有可靠的灭弧性能，不仅能通断正常的负荷电流，而且能接通和承担一定时间\n的短路电流，并能在保护装置作用下自动跳闸，切除短路故障。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "真空断路器的开断原理是什么？有何特点？", "options": [], "answer": "真空断路器的开断原理是：真空断路器灭弧室的静态压力极低，只需要相当小的触头间隙就可达到很高的电介质强度，在分闸过程中，电流在触头间产生的电弧，在电流第一次自然过零时熄灭。断路器除能开断正常的负荷电流外，还能断开短路故障电流。\n真空断路器的特点是：体积小；重量轻；适用于频繁操作；灭弧不用检修。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是负荷开关？与断路器有何区别？", "options": [], "answer": "负荷开关是指介于断路器和隔离开关之间的一种开关设备，具有简单的灭弧装置，能切断额定负荷电流和一定的过载电流，但不能切断短路电流。负荷开关与断路器的主要区别在于其不能开断短路电流。将负荷开关与熔断器串联形成组合电器，实现用负荷开关切断负荷电流，用熔断器切断短路电流及过载电流，在功率不大或不太重要的场所，可代替价格较高的断路器使用，降低配电装置成本且操作和维护也较简单。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "真空负荷开关的开断原理是什么？有何特点？", "options": [], "answer": "真空负荷开关的开断原理是：真空负荷开关动静触头带电分离时，真空介质对动静触头间产生的电弧在电流过零时熄灭。真空负荷开关只能断开小于自身额定电流的负荷电流。\n真空负荷开关的特点是：使用寿命长；开关触头免维护；操作过电压低；操作安全。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "SF6 负荷开关的开断原理是什么？有何特点？", "options": [], "answer": "SF6 负荷开关的开断原理是：SF6 气体具有优良的灭弧性能，分闸时，其电弧和气体之间产生相对运动熄灭电弧。SF6 负荷开关只能开断小于自身额定电流的负荷电流。\nSF6 负荷开关的特点是：使用寿命长；开关触头免维护；操作过电压低；操作简单\n安全。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是隔离开关？有何特点？", "options": [], "answer": "隔离开关是指在分闸位置时，触头间有符合规定要求的绝缘距离和明显的断开标志；\n在合闸位置时，能承载正常回路条件下电流和在规定时间内异常条件（如短路）下电流的开\n关设备。隔离开关的主要特点是无灭弧能力，只能在没有负荷电流的情况下分、合电路，但其断\n开时可以形成可见的明显开断点和安全距离。因没有断流能力，只能用其他设备将线路断开\n后再操作。一般需要带有防止开关带负荷误操作的联锁装置。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是重合器？与断路器有何区别？", "options": [], "answer": "重合器是指本身具备故障电流检测和操作顺序控制与执行功能，无须提供附加继电保护和操作装置的开关设备。它能够自动检测通过重合器主回路的电流，故障时按反时限保\n护自动开断故障电流，并依照预定的延时和顺序进行多次重合。\n重合器开关本体与断路器完全相同，区别在于控制器的功能上，断路器的控制器功能简\n单，仅具备控制和保护功能，其他功能靠馈线终端装置实现。而重合器的控制器除了具备断\n路器控制器的所有功能外，还具有三次以上的重合闸、多种特性曲线、相位判断、程序恢复、\n运行程序储存、自主判断、与自动化系统的连接等功能，但价格较高。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "跌落式熔断器主要作用是什么？", "options": [], "answer": "跌落式熔断器可装在杆上变压器高压侧、互感器和电容器与线路连接处，提供过载和短路保护，也可装在农村、山区的长线路末端或分支线路上，可作为继电保护装置的辅助设备。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "跌落式熔断器的动作原理是什么？", "options": [], "answer": "正常时，靠熔丝的张力使熔管上动触头与上静触头可靠接触，当故障时，过电流使熔丝熔断时，断口在熔管内产生电弧，熔管内衬的消弧管产气材料在电弧作用下产生高压力\n喷射气体，吹灭电弧。随后，弹簧支架迅速将熔丝从熔管内弹出，同时熔管在上、下弹性触头的推力和熔管自身重量的作用下迅速跌落，形成明显的隔离空间。在熔管的上端还有一个释放压力帽，放置有一点熔点熔片。当开断大电流时，上端帽的薄熔片融化形成双端排气；当开断小电流时，上端帽的薄熔片不动作，形成单端排气。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是避雷器？常见种类有哪些？", "options": [], "answer": "避雷器是连接在电力线路和大地之间，使雷云向大地放电，从而保护电气设备的器具。当雷电过电压或操作过电压来到时，使其急速向大地放电。当电压降到发电机、变压器\n或线路的正常电压时，则停止放电，以防正常电流向大地流通。\n常见避雷器主要有金属氧化物避雷器、阀型避雷器两种。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是杆塔？常见种类有哪些？", "options": [], "answer": "杆塔是支撑架空线路导线，并使导线与导线之间、导线与杆塔之间、以及导线对大地和交叉跨越物之间有足够的安全距离。线路杆塔的种类主要有钢筋混凝土杆、钢管杆、铁\n塔和木杆。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是杆塔的基础？有何作用？", "options": [], "answer": "将杆塔固定在地下部分的装置和杆塔自身埋入土壤中起固定作用部分的整体统称为杆塔的基础。杆塔的基础起着支撑塔杆全部荷载的作用，并保证杆塔在受外力作用时不发生\n倾倒或变形。杆塔基础包括电杆基础和铁塔基础。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "钢筋混凝土电杆基础常用的“三盘”指什么？有何作用？", "options": [], "answer": "钢筋混凝土电杆基础，根据土质的不同，可在杆坑加装底盘、卡盘和拉线盘，统称“三盘”。底盘的作用是承受混凝土电杆的垂直下压荷载以防止电杆下沉；卡盘是当电杆所需\n承担的倾覆力较大时，增加抵抗电杆倾倒的力量；拉线盘依靠自身重量和填土方的总合力来\n承受拉线的上拔力，以保持杆塔的平衡。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是横担？常见种类有哪些？", "options": [], "answer": "横担用于支持绝缘子、导线及柱上配电设备，保护导线间有足够的安全距离。因此，横担要有一定的强度和长度。横担按材质的不同可分为铁横担、木横担、陶瓷横担、绝缘横\n担四种。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是金具？常见种类有哪些？", "options": [], "answer": "在架空配电线路中，用于连接、紧固导线的金属器具，具备导电、承载、固\n定的金属构件，统称为金具。金具按其性能和用途可分为悬吊金具（悬垂线夹）、耐张\n金具（耐张线夹）、接触金具（设备线夹）、连接金具、接续金具、拉线金具和防护金\n具等。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "什么是绝缘子？按材质可分为哪几种？", "options": [], "answer": "架空电力线路的导线，是利用绝缘子和金具连接固定在杆塔上的。用于导线与杆塔绝缘的绝缘子，在运行中不但要承受工作电压的作用，还要受到过电压的作用，同时还要承\n受机械力的作用及气温变化和周围的环境的影响，所以绝缘子必须有良好的绝缘性能和一定\n的机械强度。\n绝缘子按材质分为瓷绝缘子、玻璃绝缘子和合成绝缘子三种。", "analysis": ""}, {"category": "配电网一次设备", "type": "简答题", "question": "拉线的作用是什么？", "options": [], "answer": "架空配电线路特别是农村低压配电线路为了平衡导线或风压对电杆的作用，通常采\n用拉线来加固电杆，拉线的设置是低压架空配电线路必不可少的一项安全措施。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "继电保护整定计算应以（  ）作为依据。", "options": [{"label": "A", "text": "常见的运行方式"}, {"label": "B", "text": "被保护设备相邻的一回线或一个元件的正常检修方式"}, {"label": "C", "text": "故障运行方式"}, {"label": "D", "text": "正常运行方式"}], "answer": "A", "analysis": "《3-110kV电网继电保护装置运行整定规程》：继电保护整定计算应以常见运行方式为依据。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "继电保护（  ）是指保护该动作时应动作，不该动作时不动作。", "options": [{"label": "A", "text": "可靠性"}, {"label": "B", "text": "选择性"}, {"label": "C", "text": "灵敏性"}, {"label": "D", "text": "速动性"}], "answer": "A", "analysis": "继电保护可靠性包括安全性和信赖性。安全性要求继电保护在不需要它动作时可靠不动作，即不发生误动。信赖性要求继电保护在规定的保护范围内发生了应该动作的故障时可靠动作，即不拒动。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "小电流接地系统单相接地故障时，故障线路的零序电流与非故障线路的零序电流相位相差是（　　）。", "options": [{"label": "A", "text": "180°"}, {"label": "B", "text": "90°"}, {"label": "C", "text": "270°"}, {"label": "D", "text": "120°"}], "answer": "A", "analysis": "《电力系统继电保护实用技术问答》第一章第15题。非故障线路的零序电流超前零序电压90°，故障线路零序电流之后零序电压90°，故故障线路和非故障线路的零序电流相位相差180°。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "小电流接地系统中，当发生A相金属性接地时，下列说法不正确的是（　　）。", "options": [{"label": "A", "text": "非故障相对地电压分别都升高到1.73倍"}, {"label": "B", "text": "A相对地电压为零"}, {"label": "C", "text": "相间电压保持不变"}, {"label": "D", "text": "BC相间电压保持不变，AC及AB相间电压则下降"}], "answer": "D", "analysis": "《电力系统继电保护实用技术问答》第一章第15题中性点电压上升为相电压，接地相电压为0，非接地相电压比正常相电压升高1.73倍。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "对变压器差动保护进行相量图分析时，应在变压器（　　）时进行。", "options": [{"label": "A", "text": "停电"}, {"label": "B", "text": "空载"}, {"label": "C", "text": "带有一定负荷"}, {"label": "D", "text": "过负荷"}], "answer": "C", "analysis": "《电力系统继电保护实用技术问答》第六章第23题，新安装的差动保护在投运前必须进行带负荷测相位和差电压，以检查电流回路接线的正确性。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "变压器的非电量保护，应该（　　）。", "options": [{"label": "A", "text": "设置独立的电源回路，出口回路可与电量保护合用"}, {"label": "B", "text": "设置独立的电源回路与出口回路，可与电量保护合用同一机箱"}, {"label": "C", "text": "设置独立的电源回路与出口回路，且在保护屏安装位置也应与电量保护相对独立"}, {"label": "D", "text": "不必设置独立的电源回路与出口回路，且可与电量保护合用同一机箱"}], "answer": "C", "analysis": "继电保护十八项反措15.2.7要求，变压器、电抗器非电量保护应同时作用于断路器的两个跳闸线圈。未采用就地跳闸方式的变压器非电量保护应设置独立的电源回路（包括直流空气小开关及其直流电源监视回路）和出口跳闸回路，且必须与电气量保护完全分开。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "运行中的变压器保护，当（　　）时，重瓦斯保护应由“跳闸”位置改为“信号”位置。", "options": [{"label": "A", "text": "变压器进行注油和滤油"}, {"label": "B", "text": "变压器中性点不接地运行"}, {"label": "C", "text": "变压器轻瓦斯保护动作"}, {"label": "D", "text": "变压器过负荷告警"}], "answer": "A", "analysis": "《电力系统继电保护实用技术问答》第六章第24题。运行中的变压器瓦斯保护，当现场进行注油和滤油时，重瓦斯保护应由“跳闸”位置改为“信号”位置。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "在电流互感器二次回路的接地线上（　　）安装有开断可能的设备。", "options": [{"label": "A", "text": "不应"}, {"label": "B", "text": "应"}, {"label": "C", "text": "尽量避免"}, {"label": "D", "text": "必要时可以"}], "answer": "A", "analysis": "《《国网公司继电保护培训教材》》第六章第五节，电流互感器二次回路总接地点一旦脱开，则每组的接地都没有，并且当其中一个回路停电需要做试验时可能影响其他运行中的回路。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "保护用电流互感器的电流误差，一般规定不应超过（　　）。", "options": [{"label": "A", "text": "0.05"}, {"label": "B", "text": "0.1"}, {"label": "C", "text": "0.15"}, {"label": "D", "text": "0.2"}], "answer": "B", "analysis": "电流互感器的电流误差，一般规定不应超过10%。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "小电流系统单相接地时，非故障相电压之间的夹角为（　　）。", "options": [{"label": "A", "text": "120°"}, {"label": "B", "text": "180°"}, {"label": "C", "text": "60°"}, {"label": "D", "text": "0°"}], "answer": "C", "analysis": "《电力系统继电保护实用技术问答》第一章第15题，非故障相电压分别超前和滞后相电压150°，故非故障相之间的夹角为60°。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "主变压器的复合电压闭锁过流保护失去电压互感器电压输入时（　　）。", "options": [{"label": "A", "text": "整套保护退出"}, {"label": "B", "text": "仅失去低压闭锁功能"}, {"label": "C", "text": "失去低压及负序电压闭锁功能"}, {"label": "D", "text": "保护不受任何影响"}], "answer": "C", "analysis": "《国网公司继电保护培训教材》》第四章第一节变压器保护，由于功率方向元件、复合电压元件都要用到电压量，所以TV断线对他们将产生影响。复合电压闭锁应采取如下一些措施：在判出低压侧TV断线时，在发TV断线告警信号同时将该侧复压元件退出，保护不经过复压元件闭锁。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "变压器的励磁涌流在（　　）时最大。", "options": [{"label": "A", "text": "外部故障"}, {"label": "B", "text": "内部故障"}, {"label": "C", "text": "空载投入"}, {"label": "D", "text": "负荷变化"}], "answer": "C", "analysis": "《《国网公司继电保护培训教材》》第四章第一节，在电源电压的瞬时值过零瞬间空投变压器时，励磁涌流最大。"}, {"category": "配电网继电保护及安自装置", "type": "单选题", "question": "电流互感器是（　　）。", "options": [{"label": "A", "text": "电
