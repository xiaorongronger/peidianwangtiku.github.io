", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "对于停电的一次设备,遥测验收由试验人员通过外加信号源的方式模拟产生电流、电压、温度等遥测信息。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "自动化系统设置原因,如系统越限延迟时间未设置,导致遥测值在限值附近时,越限信息频发。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "线路开关“间隔事故总”信号在开关偷跳时发出,在线路保护动作,开关跳闸时不会发。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "事件顺序记录SOE包括断路器跳合闸记录、保护顺序记录和遥测越限记录。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "配有弹簧操作机构的开关,当合闸弹簧未储能时,开关在分闸位置时会发出控制回路断线信号,而开关在合闸位置时则不会发控制回路断线信号。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "对于保护、测控合一的保护测控装置,可以用通信中断信号代替装置故障及直流电源消失信号。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "按照信息采集规范设计,当“保护TV失压”信号动作,一定会伴随“保护装置告警”动作。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "当保护装置通信中断,只会影响保护装置软报文信号的上传,不会影响保护装置硬接点信号的上传。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "变压器过负荷运行时不允许调节有载调压装置的分接开关。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "变电运维人员日常巡视检查和现场工作时,如发现受控站内断路器因故不能进行远方操作,应及时汇报值班监控(调控)员。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "监控职责临时移交时,监控员应以录音电话方式与运维单位明确移交范围、时间、移交前运行方式等内容,并做好相关记录。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "调控人员在工作站上可以看到电网运行的测量、状态信息,也能发出控制命令、查询历史数据、进行挂牌。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "监控常用的标示牌有检修牌、封锁牌、注释牌等。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "越限信息是指遥测量越过限值的告警信息。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "无功补偿装置宜采用自动控制方式。尽量采用AVC系统自动调节电网电压和无功。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "配网线路带电作业,根据带电作业负责人要求可不需要退重合闸的,当线路跳闸重合失败后,调控员可根据线路重要性直接遥控强送一次。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "配网调度网络发令与电话发令具有同等效力", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": ""}, {"category": "配电网调控运行管理", "type": "判断题", "question": "凡具备受令资格的调度联系对象的个人信息应全部录入网络发令模块，在首次登陆后无需修改个人密码并注意密码保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电网调度管辖范围应如何划分？", "options": [], "answer": "配电网调度管辖范围划分原则如下：\n（1）地调调度管辖范围为地域内110千伏发、输、变电设备和35千伏及以下认为应由地调直接调度的发、输、变电设备。\n（2）配调调度管辖范围为城区 10（6、20）千伏发、变、配电设备（含分支线许可）。\n（3）县调调度管辖范围为县域内35千伏、10（6、20）千伏发、输、变、配电设备。\n（4）调度管辖设备划分应遵循有利于配电网安全、优化调度的原则，并根据配电网发展情况适时调整。上级调控机构可以根据实际工作需要，将原调度管辖范围内的调度设备授权下级调控机构。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电网调控机构有哪些管理要求？", "options": [], "answer": "配电网电力调度遵循“统一调度、分级管理”的原则，并配备与调控运行、方式计划、继电保护、调度自动化等专业相适应的专职岗位及人员。配调（县调）与地调在调度业务工作中是上下级关系，下级调度必须服从上级调度的调度管理。上级调度对下级调度负有业务培训及指导责任，各电力生产运行单位必须服从与调度管辖相对应的调控机构的调度。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "调控机构值班场所有哪些电源要求？", "options": [], "answer": "各级电力调控机构的调控室和机房应由两个不同电源点供电，并配备不间断电源和事故照明。为在突发事件、自然灾害、战争时，保证提供不间断的电力调度指挥，有条件的应建立备用调控室。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电网调控运行主要有哪些工作职责？", "options": [], "answer": "电力系统调控管理必须依法对电网运行进行组织、指挥、指导和协调，领导（负责）电力系统运行、操作和事故处理。配电网调控必须做好下列工作：\n（1）负责对管辖电网范围内的设备进行运行、操作管理及配电线路运行监控。\n（2）负责指挥管辖电网的事故处理，并参加系统事故分析和参与制订提高系统安全运行的措施。\n（3）审核管辖电网范围内的设备检修计划，批准设备检修申请。\n（4）负责编制和执行管辖电网的各种运行方式。\n（5）负责收集、整理管辖电网的运行资料，提供分析报告。参与拟定迎峰度夏措施和电网改进方案。\n（6）参与拟定降损技术措施，提高管辖电网经济运行水平。\n（7）负责指挥管辖电网主变功率因数调整和电压调整。\n（8）参与编制低频、低压减载方案。参与编制系统事故限电序位表，参与制定超负荷限电序位表，经政府主管部门批准后执行。\n（9）负责与高压双电源客户签订有关双电源调度协议。\n（10）负责管辖电网范围内的新设备命名、编号；编制管辖电网范围内的新设备启动方案，参与新设备启动。\n（11）参与管辖电网的规划、工程可研及设计审查。\n（12）接受上级电力管理部门、调控机构授权或委托的与电力调控相关的工作。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "值班调控员应熟练掌握哪些内容？", "options": [], "answer": "值班调控员应熟练掌握以下内容：\n（1）电力安全工作规程、上级和本公司的调控规程以及其他有关规程、规定、制度、指示、通知等；\n（2）管辖电网的一次接线方式、主要设备的结构原理、运行特性和规范：\n（3）管辖电网的继电保护和安全自动装置的基本原理、配置及运行情况；\n（4）当年超负荷限电序位表和事故限电序位表；\n（5）调控通信、自动化及各种办公设备的使用方法；\n（6）调控术语及操作术语；\n（7）主要调控业务联系对象的姓名及联系方式。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电网调控员与配电运检人员日常联系主要分几类？", "options": [], "answer": "配电网调控员与配电运检人员日常联系主要分四类：\n（1）配电设备检修工作：配电运检人员执行完调度操作指令后，汇报值班调控员，由调控员许可开工。值班调控员接到工作竣工汇报后，进行相关复役操作。\n（2）配电设备抢修工作：值班调控员接到配电线路跳闸或缺陷等信息后，即刻通知相应配电运检人员进行巡线查找故障点。查找到故障点后，按相关流程进行故障隔离、负荷转移，许可故障处理。\n（3）方式调整：当外界干扰或负荷变化影响到配电网的供电能力及其可靠性时，配电运检人员根据值班调控员操作指令完成相应配合操作，改变配电网的运行方式，达到配电网运行的最优化。\n（4）带电作业：配电网带电作业工作负责人在带电作业工作开始前，应与值班调控员联系；工作结束后应及时向值班调控员汇报。需要停用重合闸的，应向值班调控员履行许可手续。带电作业过程中如设备突然停电，工作负责人应尽快与调控运行值班人员联系，调控运行值班人员未与工作负责人取得联系前不得强送电。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "当有关领导发布调控业务相关指示时，应注意有哪些具体要求？", "options": [], "answer": "各级调控机构的值班调控员在值班期间是电网运行、操作及事故处理的指挥人员，按照调度管辖范围行使调度权，对调度管辖范围内的运行值班人员发布调度指令，值班调控员在发令操作时，任何单位和个人不得非法干预。\n上级领导发布的一切有关调控业务的指示，应通过调控中心领导（或调控班长）转达给值班调控员。各发、供电单位领导人向其运行人员发布的指令或指示，如涉及到值班调控员的权限时，必须经值班调控员许可后才能执行，但在现场事故处理规程内已有规定者除外。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "并入电力系统的各类发电厂、变电站应遵循哪些调控管理要求？", "options": [], "answer": "并入电力系统的各类发电厂、变电站应遵循以下调控管理要求：\n（1）凡需并入电力系统的各类发电厂、变电站，不论其投资主体或产权归属，均应遵照《中华人民共和国电力法》、《电网调度管理条例》等法律、法规的规定，在并网前必须向电网企业提出并网申请，应依法签订并网调度协议、高压双电源调度协议，并严格履行并网相关调度协议。\n（2）凡已并入电网的各类发电厂、变电站的运行值班人员，必须服从电网统一管理和统一调度，严守调度纪律，服从调度指挥。\n（3）并入电网的各类发电厂、变电站的运行值班人员联系调度业务或接受调度指令时，必须报单位、姓名，并使用普通话和统一的术语，严格执行发令、复诵、监护、汇报、录音和记录等制度。\n（4）凡属调度管辖或许可的设备，未经值班调控员的指令或许可，各有关单位的运行、检修人员，均不得擅自进行操作或改变设备原有状态。但经判断对人身或设备安全确有严重威胁时，现场值班员可根据现场事故处理规程边处理、边汇报值班调控员。\n（5）值班调控员发布的调度操作指令，用户变（发电厂）、变电站值班人员必须立即执行。值班调控员应对其所发调度操作指令的正确性负责，各级调度联系对象应对汇报内容的正确性负责。一切调度指令，是以调度下达指令时开始至操作人员执行完毕并汇报值班调控员后，指令才算全部完成。调度管辖、调度许可的设备，严禁约时停送电。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "客户变电站内凡属调度管辖（许可）的设备检修有哪些要求？", "options": [], "answer": "客户变电站内凡属调度管辖（许可）的设备检修，一律要办理停电申请手续。尤其客户在进线电源设备上进行检修工作（包括配合电源线路停电的检修工作），除办理停电申请手续外，工作前还必须得到值班调控员工作许可，方可开始工作。客户工作完毕必须将自己所做的接地装置拆除，并及时向值班调控员汇报竣工，不得影响线路正常送电。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "发生故障后，发电厂或客户变电站值班人员应如何处置？", "options": [], "answer": "高压客户内部故障造成进线电源失电，值班员应迅速向值班调控员汇报，听候处理。客户内部故障修复送电应得到营销部门同意。各发电厂、客户变电站非调度管辖及许可设备发生事故时，由各站值班员自行处理，并及时汇报所管辖调控机构。\n如客户设备发生故障，引起线路跳闸（或单相接地），相关单位值班人员应及时主动向值班调控员如实报告，配合值班调控员尽快恢复线路送电。\n因客户值班人员误操作引起线路跳闸，值班人员必须立刻向值班调控员如实报告。值班调控员在无法确认该客户是否具备送电条件前，有权不对该客户恢复供电。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "设备缺陷的分类原则是什么，各类缺陷对缺陷消除有何规定？", "options": [], "answer": "设备缺陷分三类：\n一般缺陷：设备本身及周围环境出现不正常情况，一般不影响设备的安全运行的缺陷。\n严重缺陷：设备处于异常状态，可能发展为事故，但设备仍可在一定时间内继续运行，须加强监视的缺陷。\n危急缺陷：严重威胁设备的安全运行，如不及时处理，随时有可能导致事故的发生，必须尽快消除或采取必要的安全技术措施进行处理的缺陷。\n危急缺陷消除时间不得超过24小时，严重缺陷应在1个月内消除，一般缺陷可结合检修计划尽早消除，但应处于可控状态。设备带缺陷运行期间，运行单位应加强监视，必要时制定相应应急措施。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "电压调整的方式有几种？内容分别是什么？", "options": [], "answer": "电压调整方式一般分为逆调压方式、恒调压方式、顺调压方式。\n（1）逆调压是指在电压允许偏差范围内，供电电压的调整使电网高峰负荷时的电压值高于低谷负荷时的电压值，使用户的电压在电网负荷高峰、低谷相对稳定。\n（2）恒调压是指如负荷变动较小，线路上的电压损耗也较小，则只要把中枢点的电压保持在比线路额定电压高2%-5%的数值，即不必随负荷变化来调整中枢点电压即可保证负荷点的电压质量。\n（3）顺调压是指在电压允许偏差值范围内，通过对供电电压的调整，使电网高峰负荷时的电压值低于低谷负荷时的电压值的一种调压方式。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "为什么要核相？哪些情况下要核相？", "options": [], "answer": "若相位或相序不同的交流电源并列或合环，将会产生较大的环流，从而造成发电机或电气设备的损坏，因此需要核相。\n新设备或检修后相位可能变动的设备，投入运行时，应校验相序相同后才能同期并列，校核相位相同后，才能进行合环操作。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "变压器在哪些情况下应停止运行？", "options": [], "answer": "变压器发生下列情况之一者应停止运行： \n（1）变压器发生强烈不均匀噪声，内部有放电声或爆炸声。\n（2）变压器本体或附件开裂，大量漏油无法控制，油面迅速下降到最低控制线以下。\n（3）油面急剧上升，从油枕、防爆管呼吸器喷油、冒烟或喷火时。\n（4）在正常冷却条件下，变压器负荷不变而上层油温不断上升，或发现油温较平时同负荷、同温度、同冷却条件下高出10摄氏度以上（温度计本身显示正确）时。\n（5）变压器套管炸裂严重损坏、引线烧断。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "消弧线圈操作有哪些注意事项？", "options": [], "answer": "（1）消弧线圈装置运行中从一台变压器的中性点切换到另一台时，必须先将消弧线圈断开后再切换。不得将两台变压器的中性点同时接到一台消弧线圈上。\n（2）主变压器和消弧线圈装置一起停电时，应先拉开消弧线圈的隔离开关，再停主变，送电时相反。\n（3）系统中发生单相接地时，禁止操作或手动调节该段母线上的消弧线圈。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电网中变压器中性点装设消弧线圈的目的是什么？消弧线圈有哪几种补偿方式?", "options": [], "answer": "配电网在变压器中性点装设消弧线圈的目的是利用消弧线圈的感性电流补偿接地故障时的容性电流，使接地故障电流减少。通常这种补偿有三种不同的运行方式，即欠补偿、全补偿和过补偿。\n（1）欠补偿：补偿后电感电流小于电容电流，或者说补偿的感抗大于线路容抗，电网以欠补偿的方式运行。\n（2）全补偿：补偿后电感电流等于电容电流，或者说补偿的感抗等于线路容抗，电网以全补偿的方式运行（实际此方式电网处于谐振状态，不能正常运行）。\n（3）过补偿：补偿后电感电流大于电容电流，或者说补偿的感抗小于线路容抗，电网以过补偿的方式运行。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "架空绝缘导线作业的一般规定有哪些？", "options": [], "answer": "架空绝缘导线作业一般有以下规定：\n（1）架空绝缘导线不得视为绝缘设备，作业人员或非绝缘工器具、材料不得直接接触或接近。架空绝缘导线与裸导线线路的作业安全要求相同。\n（2）禁止作业人员穿越未停电接地或未采取隔离措施的绝缘导线进行工作。\n（3）在停电检修作业中，开断或接入绝缘导线前，应做好防感应电安全措施。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "电缆运行有何规定？", "options": [], "answer": "电缆线路原则上不允许过负荷，即使在事故处理中出现过负荷，调控员应尽快将电流恢复至允许值以下。当电缆过负荷时，如调控员已无法转移负荷，则应迅速通知营销部门控制负荷。电缆线路停用（或备用）超过一周，投运前应进行充电一次。超过一周不满一月时，投运前应测量绝缘电阻是否合格；超过一月时，须经试验合格方能投运。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电网中对电容器运行有哪些要求？", "options": [], "answer": "（1）电容器运行中电流不应长时间超过电容器额定电流的1.3倍；电压不应长时间超过电容器额定电压的1.1倍。\n（2）电容器开关的拉开和合上的间隔时间，至少5分钟。\n（3）电容器开关因保护动作（欠压保护除外）跳闸，或电容器本身熔丝熔断，应查明原因进行处理后方可送电。\n（4）当电容器的温度超过现场规定时，值班员应采取降温措施；如无效果，应将电容器停止运行。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "电容器在哪些情况下应停止运行？", "options": [], "answer": "电容器有下列情况之一者应立即停止运行：\n（1）外壳有明显鼓肚变形。\n（2）油浸式或密集型电容器，漏油严重或套管破裂、冒烟等。\n（3）支柱瓷瓶及其附件炸裂损坏等。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "电抗器在哪些情况下应停止运行？", "options": [], "answer": "电抗器有下列情况之一者应立即停止运行：\n（1）电抗器本身发生单相接地。\n（2）电抗器接头处发红或严重过热。\n（3）电抗器整体发生变形或倾斜。\n（4）电抗器支持瓷瓶及其附件炸裂损坏等。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "操作指令模式分哪几种，并分别简述其特点？", "options": [], "answer": "值班调控员发布操作指令的形式有综合操作指令、单项或逐项操作指令。\n（1）综合操作指令是指值班调控员仅对一个单位下达的而不需要其它单位协同进行的综合操作指令，具体操作项目、顺序由现场运维人员按现场运规典票拟写操作任务书。\n（2）单项操作指令是指值班调控员发布的仅对一个单位下达的单一操作指令。\n（3）逐项操作指令是指值班调控员按操作任务顺序逐项下达，受令单位按指令的顺序逐项执行的操作指令。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "合环和解环操作有何基本要求？", "options": [], "answer": "合环操作时，必须保证合环点两侧相位相同，操作前应考虑合环点两侧的相角差和电压差，无电压相角差，电压差一般允许在20%以内，确保合环后各环节潮流的变化不超过继电保护、电网稳定和设备容量等方面的限额。对于比较复杂环网的合环操作应事先进行计算或试验。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "断路器操作有哪些注意事项？", "options": [], "answer": "断路器操作有以下注意事项：\n（1）断路器合闸前应检查继电保护已按规定投入，断路器合闸后，应检查电流、有功、无功表计指示及指示灯是否正常。\n（2）当发现油断路器缺油，液压机构压力下降超过规定、空气开关的压缩空气压力不足以及SF6开关气体压力下降超过规定时，现场应将该开关改非自动，禁止用该开关切断负荷电流，并尽快处理。\n（3）断路器操作时，若远控失灵，应根据现场规定进行近控操作。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "隔离开关允许进行哪些操作？", "options": [], "answer": "（1）在电网无接地时拉、合电压互感器；\n（2）在无雷击时拉、合避雷器；\n（3）拉、合电容电流不超过5A的空载线路；\n（4）拉、合35千伏及以下母线的充电电流；\n（5）拉、合开关旁路刀闸的旁路电流（指与旁路开关并列运行，一般需将两开关同时改为运行非自动）；\n（6）在没有接地故障时，拉、合变压器中性点接地刀闸。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "母线充电有哪些注意事项？", "options": [], "answer": "母线充电操作应考虑以下几点：\n（1）母线检修结束复役时，尽量避免用闸刀向不带电母线充电。如必须用闸刀向不带电母线充电时，应检查母线绝缘必须良好。\n（2）防止出现铁磁谐振或因母线三相对地电容不平衡而产生的过电压。\n（3）用开关向不带电的母线充电时，充电开关必须投入快速保护。\n（4）旁路母线的充电操作，一般利用旁路开关进行充电，保护投入，重合闸停用。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "线路操作有哪些注意事项？", "options": [], "answer": "线路操作时有下列注意事项：\n（1）对于线路改检修的操作，值班调控员只有在各侧均改为冷备用后，才可将各侧改为线路检修。对于不能确定冷备用状态的10（20）千伏线路，应确认线路开关（刀闸）实际位置后再操作。\n（2）新建或改建线路第一次送电时，尽可能以额定电压对线路进行冲击合闸，并经核相正确后方可投入电网运行。\n（3）对于备用线路一般应保持在充电运行状态，即电源侧开关运行，负荷侧开关热备用（负荷侧无开关只有刀闸时，刀闸应拉开）对馈电线路停电操作时， \n（4）有消弧线圈运行的配电网，当进行线路停役或复役操作时，应同时考虑消弧线圈分接头的调整操作（消弧线圈置“自动”位置除外）。\n（5）线路送电时，应避免由发电厂侧先送电，充电断路器必须具备完整的继电保护（应有手动加速功能），并具有足够的灵敏度，同时必须考虑充电功率可能引起的电压波动或线路末端电压升高。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "线路停送电操作的顺序分别是什么？", "options": [], "answer": "线路停电时的操作顺序为：首先拉开断路器，然后断开线路侧隔离开关，再断开母线侧隔离开关；线路送电时的操作顺序为：首先合上母线侧隔离开关，然后合上线路侧隔离开关，最后合上断路器。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "根据设备的不同检修状态可以分为开关检修和线路检修，这两者如何定义？", "options": [], "answer": "（1）“线路检修”是指线路的开关、母线（包括旁路母线）及线路刀闸都在断开位置，如有线路压变者应将其刀闸拉开或取下高低压熔丝。线路接地刀闸在合上位置（或装设接地线），并取下该线路开关的母差保护和失灵保护压板。\n（2）“开关检修”是指开关及其两侧刀闸均拉开， 开关操作回路熔丝取下， 开关两侧或一侧合上接地刀闸（或装设接地线）。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "并列和解列操作有何基本要求？", "options": [], "answer": "两个电网进行同期并列时，应满足相序相同、频率相等、电压相等或偏差尽 量小的条件。若调整困难，特别是事故时为了加速并列，允许频率差不超过0.5 赫兹。\n电网解列时，应先将解列点有功功率调整至零，电流调至最小，使解列后的两个电网频率、电压均在允许的范围内。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "变压器并列运行的条件有哪些？", "options": [], "answer": "变压器并列运行时需满足连接组别相同、电压比相同、短路电压相等（指铭牌值）。对电压比和短路电压不同的变压器通过计算，任一台变压器都不会过负荷情况下，可以并列运行。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "什么是准同期并列？", "options": [], "answer": "准同期并列是将未投入系统的发电机加上励磁，并调节其电压和频率，在满足并列条件（即电压、频率、相位相同）时，将发电机投入系统。如果在理想情况下，使发电机的出口开关合闸，则在发电机定子回路中的环流将为零，这样不会产生电流和电磁力矩的冲击，这是准同期并列的最大优点。\n解环操作，应先检查解环点的有功、无功潮流，确保解环后电网各部分电压在规定的范围内，各环节的潮流变化不超过继电保护、电网稳定和设备容量等方面的限额。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电变压器停送电操作的原则是什么？", "options": [], "answer": "配电变压器停送电操作原则是：\n（1）凡属供电企业管辖的配电变压器（包括已运行和新建配电变压器）停送电操作应由设备运维人员按调度指令执行。\n（2）在故障处理时，设备运维人员可对变压器进行停电处理，应及时通知值班调控员，值班调控员应作好相关记录，但送电操作应由设备运维人员按调度指令执行。\n（3）变压器停电操作顺序为先停低压侧，后停高压侧，送电操作顺序为先送高压侧，后送低压侧。\n（4）变压器停送电操作应由两人进行，一人操作，一人监护。\n（5）操作时，必须使用绝缘手套以及合格的绝缘棒，操作人员应戴安全帽。雨天操作应穿绝缘靴并使用有防雨罩的绝缘棒。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "调度联系对象在网络化发令现场终端（厂站WEB终端或现场APP终端）上提前签收调度操作预发令，相关要求有哪些？", "options": [], "answer": "1. 原则上要求“谁签收，谁受令”。\n2. 对于计划类操作任务，调度联系对象原则上应至少提前8小时签收调度预发令。\n3. 操作预发令不具备操作效力，现场实际操作仍以当值值班调度员正式下达的操作指令为准。严禁用操作预令直接进行操作。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "简述配电网故障处置的原则。", "options": [], "answer": "（1）迅速限制故障的发展，消除故障根源，解除对人身和设备的威胁，防止稳定破\n坏、电网瓦解和大面积停电。\n（2）用一切可能的方法保持设备继续运行和不中断或少中断重要用户的正常供电，首先\n应保证发电厂厂用电及变电站所用电。\n（3）尽快对已停电的用户恢复供电，对重要用户应优先恢复供电。\n（4）及时调整电网运行方式，尽快使其恢复正常运行。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "为了防止故障扩大，可由现场运维人员自行处理后再向调控员汇报的操作有哪些？", "options": [], "answer": "（1）将直接对人员生命有威胁和可能造成重大设备损坏的设备停电。\n（2）确知无来电的可能性，将已损坏的设备隔离。\n（3）整个发电厂或部分机组因故与系统解列，在具备同期并列条件时恢复与系统同期并列。\n（4）发电厂厂用电部分或全部失去时恢复其厂用电源。\n（5）线路开关由于误碰跳闸，立即恢复供电或鉴定同期并列（或合环）。\n（6）装有备自投装置的变电站，当备自投装置拒动时，现场运维人员可以不经值班调控员同意，立即手动模拟备自投操作。（有备自投闭锁信号动作的除外）。\n（7）其它在本规程及现场规程中规定可以自行处理者。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "变电站母线运行电压越限应如", "options": [], "answer": "（1）投退并联电容器，无功不足或过剩时优先考虑。\n（2）调节主变压器有载分接头。\n（3）调整电网运行方式，如变压器并列、分列等。\n（4）转移重负荷线路。\n（5）母线有并网电厂时，调节电厂无功出力。\n（6）要求上级调度调节系统电压。\n（7）用户侧无功补偿装置调节。\n（8）必要时限负荷。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电网线路故障处置有哪些基本要求？", "options": [], "answer": "（1）装有重合闸并投入重合闸的终端线路，当断路器跳闸重合失灵（拒动、未重合）， \n值班调控员可不经设备检查立即强送一次。 \n（2）未装重合闸或重合闸停用的线路跳闸后，由值班调控员决定是否强送。 \n（3）装有重合闸的线路在重合不成功时，由值班调控员决定是否强送。一般情况下，可 \n经发电厂、变电站户外设备检查正常后，再试送一次。特殊情况，如雷击、明显近距离故障， \n对系统影响较大者或断路器有异常等，暂不试送。 \n（4）对于双回送电的线路，若其中一条线跳闸重合闸失败，另一条线路仍在保持供电， \n则跳闸线路暂不送电。值班调控员应立即通知运维单位组织巡线，发现故障点后，调整到所 \n需的检修方式。 \n（5）如跳闸属多级或越级跳闸者，视情况可分段对线路进行试送。 \n（6）与系统并列运行的发电厂出线跳闸时，确认电厂侧断路器已断开的情况下，方可进 \n行试送。 \n（7）线路作业完毕或拉电解除及备用线路恢复送电时跳闸，禁止强送。 \n（8）全电缆线路断路器跳闸及电容器、电抗器、站用变压器断路器跳闸，不得强送。 \n（9）强、试送电的断路器设备要完好，并尽可能具有全线快速动作的继电保护功能。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "有带电作业的线路故障时，对于强送有何规定？", "options": [], "answer": "（1）现场工作负责人未向调度提出过跳闸后不得强送者，按照正常线路故障强送规\n定执行。\n（2）带电作业要求停用线路重合闸或故障跳闸后不得强送者，应在得到值班调控员许可\n后，才能开始工作，带电作业结束后应向值班调控员汇报。\n（3）现场工作负责人向调度提出要求停用重合闸或线路跳闸后不经联系不得强送者，值\n班调控员只有在得到现场工作负责人同意后才能强送。现场工作负责人一旦发现线路无电\n时，不管何种原因，均应迅速与调度联系，说明是否强送电。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "简述全电缆线路事故处理的原则。", "options": [], "answer": "（1）不经巡视不允许对故障线路强送电。\n（2）经巡视，找到故障点的，在隔离故障点后，可对停电线路试送电。\n（3）经巡视，未找到故障点的，视情况可采用逐段试送的办法寻找故障。\n（4）特殊情况经领导批准后可试送一次。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "什么是母线失电，判断母线失电的依据有哪些？", "options": [], "answer": "母线失电是指母线本身无故障而失去电源，一般是由于电网故障、继电保护误动或 \n该母线上出线、变压器等运行设备故障，本身断路器拒跳，而使连接在该母线上的所有电源 \n越级跳闸所致，判别母线失电的依据是同时出现下列现象： \n（1）该母线的电压表指示消失； \n（2）该母线的各出线及变压器负荷消失（电流表等指示为零）； \n（3）该母线所供的所用（厂用）电失去。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "简述母线故障停电后的处理原则。", "options": [], "answer": "（1）不允许对故障母线不经检查即行强送电，以防事故扩大。\n（2）找到故障点并能迅速隔离的，在隔离故障点后应迅速对停电母线恢复送电，有条件时应考虑用外来电源对停电母线送电，联络线要防止非同期合闸。\n（3）找到故障点但不能迅速隔离的，若系双母线中的一组母线故障时，应迅速对故障母线上的各元件检查，确认无故障后，冷倒至运行母线并恢复送电。联络线要防止非同期合闸。\n（4）经过检查找不到故障点时，应用外来电源对故障母线进行试送电，禁止将故障母线的设备冷倒至运行母线恢复送电。发电厂母线故障如条件允许，可对母线进行零起升压，一般不允许发电厂用本厂电源对故障母线试送电。\n（5）当 GIS 设备发生故障时，必须查明故障原因，同时将故障点进行隔离或修复后对 GIS 设备恢复送电。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "变电站变压器跳闸应如何", "options": [], "answer": "（1）变压器故障跳闸时，运维人员应立即将继电保护及自动装置动作情况汇报值班\n调控员，有备用变压器或其他备用容量时应立即考虑改变供电方式，恢复对外供电。\n（2）变压器的主保护（如重瓦斯、差动）动作跳闸或压力释放保护动作，未查明原因和\n消除故障之前，不得强送。\n（3）变压器的后备保护（如过电流）动作跳闸，运维人员应检查主变压器及母线所有一\n次设备有无明显故障，检查所带母线的出线开关保护有无动作，如有动作但未跳闸时，先拉\n此开关后再试送变压器；如检查设备均无异常，继电保护也未动作，可试送变压器，但应按\n照先主变压器、后母线、再出线逐级送电的顺序进行。\n（4）两台并列运行的变压器，一台主变压器后备保护动作跳闸，全部负荷在另一台运行\n变压器限额内，先不试送，等查明原因，有关试验正确后再试送。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "运行中变压器发生什么情形时需立即安排停役。", "options": [], "answer": "（1）变压器内部音响大，有异常爆裂声。\n（2）在正常负荷和冷却条件下，变压器温度不正常并不断上升。\n（3）储油柜或压力释放阀动作喷油。\n（4）严重漏油使油面下降，低于油位计的指示限度。\n（5）油色变化过甚，油内出现碳质等。\n（6）套管有严重的破损和放电现象。\n（7）变压器起火或大量漏油。\n（8）其他严重情况。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "母线电压互感器运行异常随时可能发展成故障时应如何处理？", "options": [], "answer": "（1）电压互感器高压侧闸刀可以远控操作时，应用高压侧闸刀远控隔离。\n（2）无法采用高压侧闸刀远控隔离时，应用开关切断该电压互感器所在母线的电源，然后再隔离故障的电压互感器。\n（3）禁止用近控的方法操作该电压互感器高压侧闸刀。\n（4）禁止将该电压互感器的次级与正常运行的电压互感器次级进行并列。\n（5）禁止将该电压互感器所在母线保护停用或将母差保护改为非固定连结方式(或单母方式)。\n（6）在操作过程中发生电压互感器谐振时，应立即破坏谐振条件，并在现场规程中明确。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "线路开关正常运行发生闭锁分合闸的情况，应采取什么措施？", "options": [], "answer": "（1）有条件时将闭锁合闸的开关停用，否则将该开关的综合重合闸停用。\n（2）将闭锁分闸的开关改为非自动状态，但不得影响其失灵保护的启用。\n（3）采取旁路开关代供或母联开关串供等方式隔离，在旁路开关代供隔离时，环路中开关应改非自动状态。\n（4）特殊情况下，可采取该开关改为馈供受端开关的方式运行。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "简述闸刀异常运行的处理原则。", "options": [], "answer": "（1）运行中的闸刀如发生引线接头、触头发热严重等异常情况，应首先采取措施降低通过该闸刀的潮流（禁止采用合另一把母线闸刀的方式），必要时停用闸刀处理。如需操作该闸刀，必须经设备运检单位现场检查确认其安全性，否则不得进行操作。\n（2）运行中的闸刀如发生重大缺陷不能操作，并经设备运检单位确认需紧急停用时，应采用调度停电的方式隔离。\n（3）闸刀在操作过程中发生分合不到位的情况，现场运维人员应首先判断闸刀断口的安全距离。当闸刀断口安全距离不足或无法判断时，则应当在确保安全情况下对其隔离。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "小电流接地系统发生单相接地时应如何处理？", "options": [], "answer": "（1）当中性点不接地系统发生单相接地时，值班调控员应根据接地情况（接地母线、\n接地相、接地信号、电压水平等异常情况）及时处理。\n（2）应尽快找到故障点，并设法排除、隔离。\n（3）永久性单相接地允许继续运行，但一般不超过 2h。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "小电流接地系统发生单相接地时，寻找单相接地的顺序如何？", "options": [], "answer": "（1）对于配有完好接地选线装置的变电站，可根据其装置反映情况来确定接地点。\n（2）将电网分割为电气上互不相连的几部分。\n（3）停空载线路和电容器组。\n（4）试跳（或试拉）线路长、分支多、负荷轻、历史事故多且不重要的线路。\n（5）试跳（或试拉）分支少、负荷重的线路，最后停重要用户线路，但要首先通知该\n用户。在紧急情况下，重要用户来不及通知，可先试跳（或试拉）线路，事后通知客户服\n务中心。\n（6）对于双母线的变电站，重要用户的线路不能停电时，可采用倒母线的方法来寻找。\n（7）详细检查接地母线及有关设备。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "小电流接地系统在寻找单相接地故障时，有哪些注意事项？", "options": [], "answer": "（1）严禁在接地的电网中操作消弧线圈；\n（2）禁止用隔离开关断开接地故障；\n（3）保护方式或定值是否变更；\n（4）设备是否可能过负荷或因过负荷跳闸；\n（5）防止电压过低影响用户；\n（6）消弧线圈网络补偿度是否合适；\n（7）查出故障点，应迅速处理。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "配电网中性点不接地系统单相接地与电压互感器高、低压熔丝熔断有何区别？", "options": [], "answer": "配电网中性点不接地系统单相接地与电压互感器高、低压熔丝熔断依据现象有以下\n区别：\n（1）单相接地时，接地光字牌亮，消弧线圈装置动作并报警“接地”，选线装置动作则\n发出选线信号，接地相电压降低，其余两相电压升高；金属性接地时，接地相电压为零，其\n余两相为则为线电压，线电压不变。\n（2）母线电压互感器高压熔丝熔断时，一相、二相或全部三相电压降低或接近零，其余\n相电压基本正常，线电压也可能降低。\n（3）单相接地或母线电压互感器高压熔丝熔断时电压互感器二次开口绕组电压都增大，\n都可能发出接地信号，而电压互感器低压熔丝熔断则不会。\n（4）还可通过测量电压互感器二次侧桩头电压来判断高、低压熔丝熔断，电压正常则为\n低压熔丝熔断或二次回路故障。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "单相接地逐条试拉后，接地仍不消失的原因主要有哪些？", "options": [], "answer": "（1）多条线路同相接地。\n（2）母线设备接地。\n（3）主变压器低压侧设备接地。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "小电流接地系统发出“单相接地”信号的可能原因有哪些？", "options": [], "answer": "一般有以下三种：\n（1）发生单相接地。\n（2）电压互感器高压侧熔断器熔断。\n（3）铁磁谐振过电压。", "analysis": ""}, {"category": "配电网调控运行管理", "type": "简答题", "question": "变电站所用变压器（接地变压器）全停有何影响？应如何处理？", "options": [], "answer": "变电站所用电（指所用变压器或接地变压器）全停后，有以下一些影响：\n（1）照明等部分非重要交流用电将停电。\n（2）若蓄电池容量不足，有可能断开的断路器只够一次合闸，线路跳闸后可能无法重合。\n（3）影响变电站监控系统及远动通信装置运行，甚至可能造成全站通信中断。\n变电站失去所用电后，应尽快排除故障送出所用电，或经其他变电站联络线转供所用电，\n限制 UPS 及直流母线所带的部分非重要负荷，必要时可外接发电机供所用电。", "analysis": ""}];

let state = {
  filtered: [],
  page: 1,
  pageSize: 10,
  mode: 'exam',
  answers: {},
  results: {},
  stats: { correct: 0, wrong: 0, total: 0 },
  singleMode: { currentIndex: 0, answered: false },
  wrongBook: [],  // 错题本：存储题目在DATA中的索引
  currentView: 'exam'  // 'exam' 或 'wrongBook'
};

function init() {
  loadWrongBook();
  populateCategories();
  applyFilters();
  updateWrongBadge();
  document.getElementById('categoryFilter').addEventListener('change', () => { state.page = 1; applyFilters(); });
  document.getElementById('typeFilter').addEventListener('change', () => { state.page = 1; applyFilters(); });
  document.getElementById('pageSize').addEventListener('change', (e) => {
    state.pageSize = Math.max(1, Math.min(50, parseInt(e.target.value) || 10));
    state.page = 1;
    applyFilters();
  });
}

function populateCategories() {
  const cats = [...new Set(DATA.map(q => q.category))];
  const sel = document.getElementById('categoryFilter');
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
  document.getElementById('totalCount').textContent = DATA.length;
}

function applyFilters() {
  const cat = document.getElementById('categoryFilter').value;
  const type = document.getElementById('typeFilter').value;
  state.filtered = DATA.filter(q => (cat === 'all' || q.category === cat) && (type === 'all' || q.type === type));
  document.getElementById('statTotal').textContent = state.filtered.length;
  render();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (mode === 'browse') {
    state.results = {};
    state.stats = { correct: 0, wrong: 0, total: 0 };
    state.page = 1;
    updateStats();
  } else if (mode === 'single') {
    state.results = {};  // 清除之前的答题结果
    state.page = 1;
    state.pageSize = 1;
    state.singleMode.currentIndex = 0;
    state.singleMode.answered = false;
  } else {
    state.pageSize = parseInt(document.getElementById('pageSize').value) || 10;
  }
  render();
}

function render() {
  const list = document.getElementById('questionList');
  const start = (state.page - 1) * state.pageSize;
  const end = start + state.pageSize;
  const pageItems = state.filtered.slice(start, end);

  if (pageItems.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>没有符合条件的题目</p></div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  let html = '';
  pageItems.forEach((q, i) => {
    const idx = start + i;
    const globalIdx = DATA.indexOf(q);
    const qid = 'q_' + globalIdx;
    const result = state.results[qid];

    html += `<div class="question-card" id="card_${qid}">`;
    html += `<div class="q-header"><span class="q-number">第 ${idx + 1} 题 / 共 ${state.filtered.length} 题</span><div class="q-tags"><span class="tag tag-category">${q.category}</span><span class="tag tag-type ${q.type}">${q.type}</span></div></div>`;
    html += `<div class="q-text">${escapeHtml(q.question)}</div>`;

    if (q.type === '简答题') {
      html += renderShortAnswer(q, qid);
    } else {
      html += renderChoiceQuestion(q, qid, result);
    }

    html += `</div>`;
  });

  // 单题模式添加导航按钮
  if (state.mode === 'single') {
    html += renderSingleModeNav();
  }

  list.innerHTML = html;
  renderPagination();
}

function renderChoiceQuestion(q, qid, result) {
  let html = '<div class="options">';
  q.options.forEach(opt => {
    let cls = 'option-btn';
    if (result) cls += ' disabled';
    if (state.mode === 'browse') cls += ' disabled';
    if (state.answers[qid] && state.answers[qid].includes(opt.label)) cls += ' selected';
    if (result && result.isCorrect && result.correctAnswers.includes(opt.label)) cls += ' correct';
    if (result && !result.isCorrect && result.userAnswers.includes(opt.label) && !result.correctAnswers.includes(opt.label)) cls += ' wrong';
    if (result && !result.isCorrect && result.correctAnswers.includes(opt.label)) cls += ' correct';
    if (state.mode === 'browse') {
      if (isCorrectOption(q, opt.label)) cls = 'option-btn disabled correct';
    }

    const click = ((state.mode === 'exam' || state.mode === 'single') && !result) ? `onclick="selectOption('${qid}','${opt.label}','${q.type}')"` : '';
    html += `<button class="${cls}" ${click}><span class="opt-label">${opt.label}</span><span>${escapeHtml(opt.text)}</span></button>`;
  });
  html += '</div>';

  if (state.mode === 'exam' || state.mode === 'single') {
    const submitted = !!result;
    const disabled = submitted ? 'disabled' : '';
    const btnText = submitted ? '已提交' : '提交答案';
    html += `<button class="submit-btn" ${disabled} onclick="submitAnswer('${qid}')">${btnText}</button>`;
  }

  if (result) {
    html += renderResultFeedback(q, result);
  }

  if (state.mode === 'browse') {
    html += `<div class="answer-section show answer-info"><h4>正确答案：${q.answer}</h4>${q.analysis ? '<p>' + escapeHtml(q.analysis) + '</p>' : ''}</div>`;
  }

  return html;
}

// 判断选项是否为正确答案（支持判断题的"正确"/"错误"）
function isCorrectOption(q, optLabel) {
  if (q.type === '判断题') {
    return q.answer === optLabel;
  }
  return q.answer.includes(optLabel);
}

function renderShortAnswer(q, qid) {
  // 只有浏览模式下直接显示答案，单题模式和答题模式需要点击显示
  const showDirectly = state.mode === 'browse';
  const displayStyle = showDirectly ? 'block' : 'none';
  const btnText = showDirectly ? '隐藏答案' : '显示答案';
  
  let html = `<button class="show-answer-btn" onclick="toggleShortAnswer('${qid}')">${btnText}</button>`;
  html += `<div class="short-answer-section" id="sa_${qid}" style="display:${displayStyle}">`;
  html += `<div class="answer-label">参考答案：</div>`;
  html += `<div class="answer-text">${escapeHtml(q.answer)}</div>`;
  if (q.analysis) {
    html += `<div class="answer-label" style="margin-top:12px">解析：</div>`;
    html += `<div class="answer-text">${escapeHtml(q.analysis)}</div>`;
  }
  html += `</div>`;
  return html;
}

function renderResultFeedback(q, result) {
  if (result.isCorrect) {
    return `<div class="answer-section show answer-correct"><h4>✅ 回答正确！</h4><p>正确答案：${q.answer}</p>${q.analysis ? '<p>' + escapeHtml(q.analysis) + '</p>' : ''}</div>`;
  } else {
    return `<div class="answer-section show answer-wrong"><h4>❌ 回答错误</h4><p>你的答案：${result.userAnswers.join(', ')}　|　正确答案：${q.answer}</p>${q.analysis ? '<p>' + escapeHtml(q.analysis) + '</p>' : ''}</div>`;
  }
}

function selectOption(qid, label, type) {
  if (!state.answers[qid]) state.answers[qid] = [];
  const arr = state.answers[qid];
  if (type === '多选题') {
    const idx = arr.indexOf(label);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(label);
  } else {
    state.answers[qid] = [label];
  }
  render();
}

function submitAnswer(qid) {
  const userAnswers = state.answers[qid] || [];
  if (userAnswers.length === 0) return;

  const globalIdx = parseInt(qid.split('_')[1]);
  const q = DATA[globalIdx];
  let correctAnswers, isCorrect;

  if (q.type === '判断题') {
    // 判断题：答案直接是"正确"或"错误"
    correctAnswers = [q.answer];
    isCorrect = userAnswers[0] === q.answer;
  } else {
    // 单选题/多选题：答案包含 A-D 字母
    correctAnswers = q.answer.split('').filter(c => /[A-D]/.test(c));
    isCorrect = JSON.stringify([...userAnswers].sort()) === JSON.stringify([...correctAnswers].sort());
  }

  state.results[qid] = { userAnswers, correctAnswers, isCorrect };
  state.stats.total++;
  if (isCorrect) {
    state.stats.correct++;
    // 答对时从错题本移除
    const globalIdx = parseInt(qid.split('_')[1]);
    if (state.wrongBook.includes(globalIdx)) {
      state.wrongBook = state.wrongBook.filter(i => i !== globalIdx);
      saveWrongBook();
      updateWrongBadge();
    }
  } else {
    state.stats.wrong++;
    // 答错时自动收录到错题本
    const globalIdx = parseInt(qid.split('_')[1]);
    if (!state.wrongBook.includes(globalIdx)) {
      state.wrongBook.push(globalIdx);
      saveWrongBook();
      updateWrongBadge();
    }
  }
  updateStats();
  
  // 单题模式下标记为已答
  if (state.mode === 'single') {
    state.singleMode.answered = true;
  }
  
  render();
}

// 单题模式导航
function renderSingleModeNav() {
  const current = (state.page - 1) * state.pageSize + 1;
  const total = state.filtered.length;
  const hasAnswered = state.singleMode.answered;
  
  let html = '<div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px;">';
  html += `<button class="submit-btn" style="background:#666" ${state.page <= 1 ? 'disabled' : ''} onclick="singlePrev()">上一题</button>`;
  html += `<span style="font-size:14px;color:#666;">${current} / ${total}</span>`;
  html += `<button class="submit-btn" ${state.page >= total ? 'disabled' : ''} onclick="singleNext()">下一题</button>`;
  html += '</div>';
  return html;
}

function singlePrev() {
  if (state.page > 1) {
    state.page--;
    state.singleMode.answered = false;
    state.answers = {};  // 清除当前答案选择
    render();
  }
}

function singleNext() {
  const total = Math.ceil(state.filtered.length / state.pageSize);
  if (state.page < total) {
    state.page++;
    state.singleMode.answered = false;
    state.answers = {};  // 清除当前答案选择
    render();
  }
}

function toggleShortAnswer(qid) {
  const el = document.getElementById('sa_' + qid);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function updateStats() {
  document.getElementById('statCorrect').textContent = state.stats.correct;
  document.getElementById('statWrong').textContent = state.stats.wrong;
  document.getElementById('statRate').textContent = state.stats.total > 0 ? Math.round(state.stats.correct / state.stats.total * 100) + '%' : '-';
}

function renderPagination() {
  const total = Math.ceil(state.filtered.length / state.pageSize);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  let html = `<button ${state.page <= 1 ? 'disabled' : ''} onclick="goPage(${state.page - 1})">上一页</button>`;
  html += `<span class="page-info">${state.page} / ${total}</span>`;
  html += `<button ${state.page >= total ? 'disabled' : ''} onclick="goPage(${state.page + 1})">下一页</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) {
  const total = Math.ceil(state.filtered.length / state.pageSize);
  state.page = Math.max(1, Math.min(total, p));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== 错题本功能 ==========

function loadWrongBook() {
  try {
    const saved = localStorage.getItem('wrongBook');
    if (saved) state.wrongBook = JSON.parse(saved);
  } catch(e) {}
}

function saveWrongBook() {
  try {
    localStorage.setItem('wrongBook', JSON.stringify(state.wrongBook));
  } catch(e) {}
}

function updateWrongBadge() {
  const badge = document.getElementById('wrongBadge');
  if (state.wrongBook.length > 0) {
    badge.style.display = 'flex';
    badge.textContent = state.wrongBook.length;
  } else {
    badge.style.display = 'none';
  }
}

function openWrongBook() {
  state.currentView = 'wrongBook';
  state.page = 1;
  state.results = {};
  state.answers = {};
  state.stats = { correct: 0, wrong: 0, total: 0 };
  updateStats();
  renderWrongBook();
}

function closeWrongBook() {
  state.currentView = 'exam';
  state.page = 1;
  state.results = {};
  state.answers = {};
  state.stats = { correct: 0, wrong: 0, total: 0 };
  updateStats();
  applyFilters();
}

function renderWrongBook() {
  const list = document.getElementById('questionList');
  const wrongQuestions = state.wrongBook.map(idx => DATA[idx]).filter(Boolean);

  let html = '<div class="wrong-book-header">';
  html += '<h2>📝 错题本（共 ' + wrongQuestions.length + ' 题）</h2>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  html += '<button class="clear-btn" onclick="clearWrongBook()">' + (state._clearConfirming ? '⚠️ 再次点击确认清空' : '🗑️ 清空错题本') + '</button>';
  if (state._clearConfirming) {
    html += '<button class="back-btn" onclick="state._clearConfirming=false;renderWrongBook()">取消</button>';
  }
  html += '<button class="back-btn" onclick="closeWrongBook()">← 返回题库</button>';
  html += '</div></div>';

  if (wrongQuestions.length === 0) {
    html += '<div class="wrong-book-empty"><div class="icon">🎉</div><p>错题本是空的，继续保持！</p></div>';
    list.innerHTML = html;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  // 分页
  const start = (state.page - 1) * state.pageSize;
  const end = start + state.pageSize;
  const pageItems = wrongQuestions.slice(start, end);

  pageItems.forEach((q, i) => {
    const idx = start + i;
    const globalIdx = DATA.indexOf(q);
    const qid = 'q_' + globalIdx;
    const result = state.results[qid];

    html += `<div class="question-card" id="card_${qid}">`;
    html += `<div class="q-header"><span class="q-number">第 ${idx + 1} 题 / 共 ${wrongQuestions.length} 题</span><div class="q-tags"><span class="tag tag-category">${q.category}</span><span class="tag tag-type ${q.type}">${q.type}</span></div></div>`;
    html += `<div class="q-text">${escapeHtml(q.question)}</div>`;

    if (q.type === '简答题') {
      html += renderShortAnswer(q, qid);
    } else {
      html += renderChoiceQuestion(q, qid, result);
    }

    // 添加移除按钮
    html += `<button class="show-answer-btn" style="margin-top:12px;color:#c5221f" onclick="removeFromWrongBook(${globalIdx})">✕ 从错题本移除</button>`;
    html += `</div>`;
  });

  list.innerHTML = html;

  // 分页
  const total = Math.ceil(wrongQuestions.length / state.pageSize);
  if (total > 1) {
    let pgHtml = `<button ${state.page <= 1 ? 'disabled' : ''} onclick="wrongBookPage(${state.page - 1})">上一页</button>`;
    pgHtml += `<span class="page-info">${state.page} / ${total}</span>`;
    pgHtml += `<button ${state.page >= total ? 'disabled' : ''} onclick="wrongBookPage(${state.page + 1})">下一页</button>`;
    document.getElementById('pagination').innerHTML = pgHtml;
  } else {
    document.getElementById('pagination').innerHTML = '';
  }
}

function wrongBookPage(p) {
  const wrongQuestions = state.wrongBook.map(idx => DATA[idx]).filter(Boolean);
  const total = Math.ceil(wrongQuestions.length / state.pageSize);
  state.page = Math.max(1, Math.min(total, p));
  state.answers = {};
  state.results = {};
  renderWrongBook();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function removeFromWrongBook(globalIdx) {
  state.wrongBook = state.wrongBook.filter(i => i !== globalIdx);
  saveWrongBook();
  updateWrongBadge();
  state.results = {};
  state.answers = {};
  renderWrongBook();
}

function clearWrongBook() {
  if (state._clearConfirming) {
    state.wrongBook = [];
    saveWrongBook();
    updateWrongBadge();
    state._clearConfirming = false;
    renderWrongBook();
  } else {
    state._clearConfirming = true;
    renderWrongBook();
  }
}

// 重写 render 函数，根据 currentView 决定渲染内容
const _originalRender = render;
render = function() {
  if (state.currentView === 'wrongBook') {
    renderWrongBook();
  } else {
    _originalRender();
  }
};

init();
</script>
</body>
</html>
