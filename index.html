<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配电网调控人员考试题库</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }

.header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: #fff; padding: 20px 0; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 24px; font-weight: 600; letter-spacing: 2px; }
.header p { font-size: 14px; opacity: 0.85; margin-top: 4px; }

.container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

.controls { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.controls label { font-size: 14px; font-weight: 500; color: #555; }
.controls select, .controls input[type="number"] { padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
.controls select:focus, .controls input:focus { border-color: #1a73e8; }
.controls button { padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
.btn-primary { background: #1a73e8; color: #fff; }
.btn-primary:hover { background: #1557b0; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-success { background: #34a853; color: #fff; }
.btn-success:hover { background: #2d9249; }

.stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: 10px; padding: 14px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); flex: 1; min-width: 120px; text-align: center; }
.stat-card .num { font-size: 28px; font-weight: 700; }
.stat-card .label { font-size: 12px; color: #888; margin-top: 2px; }
.stat-card.correct .num { color: #34a853; }
.stat-card.wrong .num { color: #ea4335; }
.stat-card.total .num { color: #1a73e8; }
.stat-card.rate .num { color: #fbbc04; }

.question-card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: box-shadow 0.2s; }
.question-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.12); }

.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.q-number { font-size: 13px; color: #888; }
.q-tags { display: flex; gap: 6px; }
.tag { padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.tag-category { background: #e8f0fe; color: #1a73e8; }
.tag-type { background: #fce8e6; color: #c5221f; }
.tag-type.单选题 { background: #e8f0fe; color: #1a73e8; }
.tag-type.多选题 { background: #fef7e0; color: #b06000; }
.tag-type.判断题 { background: #e6f4ea; color: #137333; }
.tag-type.简答题 { background: #f3e8fd; color: #7627bb; }

.q-text { font-size: 16px; line-height: 1.7; margin-bottom: 16px; color: #1a1a1a; font-weight: 500; }

.options { display: flex; flex-direction: column; gap: 8px; }
.option-btn { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border: 2px solid #e8e8e8; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: #fafafa; text-align: left; font-size: 15px; line-height: 1.6; }
.option-btn:hover:not(.disabled) { border-color: #1a73e8; background: #f0f6ff; }
.option-btn.selected { border-color: #1a73e8; background: #e8f0fe; }
.option-btn.correct { border-color: #34a853; background: #e6f4ea; }
.option-btn.wrong { border-color: #ea4335; background: #fce8e6; }
.option-btn.disabled { cursor: default; opacity: 0.85; }
.option-btn .opt-label { min-width: 28px; height: 28px; border-radius: 50%; background: #e8e8e8; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
.option-btn.selected .opt-label { background: #1a73e8; color: #fff; }
.option-btn.correct .opt-label { background: #34a853; color: #fff; }
.option-btn.wrong .opt-label { background: #ea4335; color: #fff; }

.answer-section { margin-top: 16px; padding: 16px; border-radius: 8px; display: none; }
.answer-section.show { display: block; animation: fadeIn 0.3s ease; }
.answer-correct { background: #e6f4ea; border-left: 4px solid #34a853; }
.answer-wrong { background: #fce8e6; border-left: 4px solid #ea4335; }
.answer-info { background: #e8f0fe; border-left: 4px solid #1a73e8; }

.answer-section h4 { font-size: 14px; margin-bottom: 6px; }
.answer-section p { font-size: 14px; line-height: 1.6; color: #444; }

.short-answer-section { margin-top: 12px; padding: 16px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e8e8e8; }
.short-answer-section .answer-label { font-size: 13px; color: #888; margin-bottom: 8px; }
.short-answer-section .answer-text { font-size: 15px; line-height: 1.8; color: #1a1a1a; white-space: pre-wrap; }

.show-answer-btn { margin-top: 12px; padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: #555; transition: all 0.2s; }
.show-answer-btn:hover { background: #e0e0e0; }

.submit-btn { margin-top: 16px; padding: 10px 28px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500; transition: all 0.2s; }
.submit-btn:hover { background: #1557b0; }
.submit-btn:disabled { background: #ccc; cursor: not-allowed; }

.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; padding: 16px 0; }
.pagination button { padding: 8px 14px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; transition: all 0.2s; }
.pagination button:hover:not(:disabled) { border-color: #1a73e8; color: #1a73e8; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination .page-info { font-size: 14px; color: #666; padding: 0 12px; }

.mode-toggle { display: flex; gap: 8px; margin-left: auto; }
.mode-btn { padding: 6px 14px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.mode-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }

.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.4; }
.empty-state p { font-size: 16px; }

.wrong-book-btn { position: relative; }
.wrong-book-btn .badge { position: absolute; top: -6px; right: -6px; background: #ea4335; color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; font-weight: 600; }
.wrong-book-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.wrong-book-header h2 { font-size: 18px; color: #333; }
.wrong-book-header .back-btn { padding: 6px 16px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: #555; transition: all 0.2s; }
.wrong-book-header .back-btn:hover { background: #e0e0e0; }
.wrong-book-header .clear-btn { padding: 6px 16px; background: #fce8e6; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: #c5221f; transition: all 0.2s; }
.wrong-book-header .clear-btn:hover { background: #f5c6c2; }
.wrong-book-empty { text-align: center; padding: 80px 20px; color: #aaa; }
.wrong-book-empty .icon { font-size: 48px; margin-bottom: 12px; }
.wrong-book-empty p { font-size: 15px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 640px) {
  .header h1 { font-size: 18px; }
  .container { padding: 12px 8px; }
  .controls { flex-direction: column; align-items: stretch; }
  .stats-bar { gap: 8px; }
  .stat-card { padding: 10px 12px; min-width: 80px; }
  .stat-card .num { font-size: 22px; }
  .question-card { padding: 16px; }
  .q-text { font-size: 15px; }
  .option-btn { padding: 10px 12px; font-size: 14px; }
  .mode-toggle { margin-left: 0; }
}
</style>
</head>
<body>

<div class="header">
  <h1>配电网调控人员考试题库</h1>
  <p>共 <span id="totalCount">0</span> 道题 · 支持单选、多选、判断、简答</p>
  <button class="wrong-book-btn mode-btn" style="margin-top:10px;background:rgba(255,255,255,0.2);color:#fff;border-color:rgba(255,255,255,0.3)" onclick="openWrongBook()">📝 错题本 <span class="badge" id="wrongBadge" style="display:none">0</span></button>
</div>

<div class="container">
  <div class="controls">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;flex:1">
      <label>分类：</label>
      <select id="categoryFilter">
        <option value="all">全部分类</option>
      </select>
      <label>题型：</label>
      <select id="typeFilter">
        <option value="all">全部题型</option>
        <option value="单选题">单选题</option>
        <option value="多选题">多选题</option>
        <option value="判断题">判断题</option>
        <option value="简答题">简答题</option>
      </select>
      <label>每页：</label>
      <input type="number" id="pageSize" value="10" min="1" max="50" style="width:60px">
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="exam" onclick="setMode('exam')">答题模式</button>
      <button class="mode-btn" data-mode="single" onclick="setMode('single')">单题模式</button>
      <button class="mode-btn" data-mode="browse" onclick="setMode('browse')">浏览模式</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card total"><div class="num" id="statTotal">0</div><div class="label">当前题目数</div></div>
    <div class="stat-card correct"><div class="num" id="statCorrect">0</div><div class="label">答对</div></div>
    <div class="stat-card wrong"><div class="num" id="statWrong">0</div><div class="label">答错</div></div>
    <div class="stat-card rate"><div class="num" id="statRate">-</div><div class="label">正确率</div></div>
  </div>

  <div id="questionList"></div>

  <div class="pagination" id="pagination"></div>
</div>

力系统运行实用技术问答(第二版)》第二章：振荡时系统各点电压和电流值均作往复性摆动。"}, {"category": "配电网概述", "type": "单选题", "question": "电力系统受到大扰动后,各同步电机保持同步运行并过渡到新的或恢复到原来稳态运行方式的能力称为(  )。", "options": [{"label": "A", "text": "静态稳定"}, {"label": "B", "text": "暂态稳定"}, {"label": "C", "text": "动态稳定"}, {"label": "D", "text": "功角稳定"}], "answer": "B", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：电力系统受到大扰动后,各同步电机保持同步运行并过渡到新的或恢复到原来稳态运行方式的能力称为暂态稳定。"}, {"category": "配电网概述", "type": "单选题", "question": "电力系统在很小的干扰下,能独立地恢复到它初始运行状况的能力,称为(  )。", "options": [{"label": "A", "text": "暂态稳定"}, {"label": "B", "text": "静态稳定"}, {"label": "C", "text": "系统的抗干扰能力"}, {"label": "D", "text": "动态稳定"}], "answer": "B", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：电力系统在很小的干扰下,能独立地恢复到它初始运行状况的能力,称为静态稳定。"}, {"category": "配电网概述", "type": "单选题", "question": "对称分量法适用于(  )电路。", "options": [{"label": "A", "text": "线性"}, {"label": "B", "text": "非线性"}, {"label": "C", "text": "线性和非线性"}, {"label": "D", "text": "单相"}], "answer": "A", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：由线性数学计算可知：三个不对称的相量,可以唯一分解为三组对称的相量(分量)。因此,在线性电路中,系统发生不对称短路时,将网络中出现的三相不对称的电压和电流,分解为正、负、零序三组对称分量,分别按对称三相电路去解,然后将其结果叠加起来。这种分析不对称三相电路的方法叫对称分量法。"}, {"category": "配电网概述", "type": "单选题", "question": "有名值与标么值之间的关系(  )。", "options": [{"label": "A", "text": "有名值＝标么值/基准值(与有名值同单位)"}, {"label": "B", "text": "标么值＝有名值/基准值(与有名值同单位)"}, {"label": "C", "text": "标么值＝基准值(与有名值同单位)/有名值"}, {"label": "D", "text": "基准值＝标么值/有名值"}], "answer": "B", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：有名值是电力系统各物理量及参数的带量纲的数值。标幺值是各物理量及参数的相对值,是不带量纲的数值。标幺值是相对某一基值而言的,同一有名值,当 基值选取不一样时,其标幺值也不一样,它们的关系如下:标么值＝有名值/基准值。"}, {"category": "配电网概述", "type": "单选题", "question": "在线性电路中,系统发生不对称短路时,将网络中出现的三相不对称的电压和电流,分解为(  )三组对称分量。", "options": [{"label": "A", "text": "正、负、零序"}, {"label": "B", "text": "幅值、频率、初相"}, {"label": "C", "text": "相序、频率、幅值"}, {"label": "D", "text": "电压、电流、功率"}], "answer": "A", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：在线性电路中,系统发生不对称短路时,将网络中出现的三相不对称的电压和电流,分解为正、负、零序三组对称分量,分别按对称三相电路去解,然后将其结果叠加起来,这种方法即为对称分量法。"}, {"category": "配电网概述", "type": "单选题", "question": "潮汐发电按能量形式分为两种：一种是利用潮汐的动能发电；另一种是利用潮汐的(  )发电。", "options": [{"label": "A", "text": "电磁能"}, {"label": "B", "text": "化学能"}, {"label": "C", "text": "势能"}, {"label": "D", "text": "热能"}], "answer": "C", "analysis": "出自《配网调控监控人员培训手册》第五章：潮汐发电就是在海湾或有潮汐的河口建筑一座拦水堤坝,形成水库,并在坝中或坝旁放置水轮发电机组,利用潮汐涨落时海水水位的升降,使海水通过水轮机时推动水轮发电机组发电。从能量的角度说,就是利用海水的势能和动能,通过水轮发电机转化为电能。"}, {"category": "配电网概述", "type": "单选题", "question": "电力系统中性点非直接接地系统发生单相接地故障时,接地点将通过接地线路对应电压等级电网的全部对地(  )电流。", "options": [{"label": "A", "text": "负序"}, {"label": "B", "text": "非线性"}, {"label": "C", "text": "电感"}, {"label": "D", "text": "电容"}], "answer": "D", "analysis": "小电流接地系统发生单相接地故障时,接地点将通过接地线路对应电压等级电网的全部对地电容电流。如果此电容电流相当大,就会在接地点产生间歇性电弧,引起过电压,从而使非故障相对地电压极大增加。在电弧接地过电压的作 用下,可能导致绝缘损坏,造成两点或多点的接地短路,使事故扩大。"}, {"category": "配电网概述", "type": "单选题", "question": "对于局部电网无功功率过剩,电压偏高,应避免采取以下哪些措施(  )。", "options": [{"label": "A", "text": "发电机低功率因数运行,尽量多发无功"}, {"label": "B", "text": "部分发电机进相运行,吸收系统无功"}, {"label": "C", "text": "投入并联电抗器"}, {"label": "D", "text": "控制低压电网无功电源上网"}], "answer": "A", "analysis": "对于局部电网无功功率过剩、电压偏高,应采取以下基本措施：1、发电机高功率因数运行,尽量少发无功；2、部分发电机进相运行,吸收系统无功；3、切除并联电容器；4、投入并联电抗器； \n5、控制低压电网无功电源上网；6、必要且条件允许时改变运行方式。7、停用部分调相机组或将部分可以进相运行的调相机改进相运行。"}, {"category": "配电网概述", "type": "单选题", "question": "风能就是空气流动所产生的(  )。", "options": [{"label": "A", "text": "动能和势能"}, {"label": "B", "text": "动能"}, {"label": "C", "text": "势能"}, {"label": "D", "text": "动能和热能"}], "answer": "B", "analysis": "由于地面各处受太阳辐照后气温变化不同和空气中水蒸气的含量不同,因而引起各地气压的差异,在水平方向高压空气向低压地区流动,即形成风。风能就是地球表面大量空气流动所产生的动能。"}, {"category": "配电网概述", "type": "单选题", "question": "负荷功率因数低造成的影响是(  )。", "options": [{"label": "A", "text": "线路电压损失增大,有功损耗增大,发电设备仍能充分发挥作用"}, {"label": "B", "text": "线路电压损失增大,有功损耗减少,发电设备未能充分发挥作用"}, {"label": "C", "text": "线路电压损失增大,有功损耗增大,发电设备未能充分发挥作用"}, {"label": "D", "text": "线路电压损失减少,有功损耗减少,发电设备充分发挥作用"}], "answer": "C", "analysis": "在一定的电压下向负载输送一定的有功功率时,负载的功率因数越低,通过输电线的电流越大,引起末端电压损失增大,因无功电流引起的无功损耗增大,发电机有功出力下降未能充分发挥有功出力。"}, {"category": "配电网概述", "type": "单选题", "question": "关于不对称运行给系统带来的影响最正确的是(  )。", "options": [{"label": "A", "text": "谐波、负序、零序"}, {"label": "B", "text": "负序、零序"}, {"label": "C", "text": "谐波、负序"}, {"label": "D", "text": "谐波、零序"}], "answer": "B", "analysis": "电力系统三相阻抗对称性的破坏,将导致电流和电压对称性的破坏,因而会出现负序电流,当变压器的中性点接地时,还会出现零序电流。"}, {"category": "配电网概述", "type": "单选题", "question": "变压器差动保护范围是(  )。", "options": [{"label": "A", "text": "变压器中压侧到高压侧"}, {"label": "B", "text": "变压器低压侧到中压侧"}, {"label": "C", "text": "变压器低压侧到高压侧"}, {"label": "D", "text": "变压器各侧电流互感器之间的设备"}], "answer": "D", "analysis": "变压器差动保护的范围是构成变压器差动保护的电流互感器之间的电气设备、以及连接这些设备的导线。"}, {"category": "配电网概述", "type": "单选题", "question": "水电站主要利用水的(  )。", "options": [{"label": "A", "text": "分子能"}, {"label": "B", "text": "势能"}, {"label": "C", "text": "热能"}, {"label": "D", "text": "化学能"}], "answer": "B", "analysis": "水电站的工作原理:利用高处的水落下时把重力势能转化为动能。水的一部分动能转移到水轮机,利用水轮机带动发电机把机械能转化为电能。"}, {"category": "配电网概述", "type": "单选题", "question": "产生电压崩溃的原因为(  )。", "options": [{"label": "A", "text": "有功功率严重不足"}, {"label": "B", "text": "无功功率严重不足"}, {"label": "C", "text": "系统受到小的干扰"}, {"label": "D", "text": "系统发生短路"}], "answer": "B", "analysis": "电力系统或电力系统内某一局部,由于无功电源不足,运行电压过低,当达到极限值(保持电压稳定的最低电压值)以下时,产生了无功功率的缺额增大和电网电压进一步下降的恶性循环,以致输电线路过负荷跳闸,发电机失去同步而解列。"}, {"category": "配电网概述", "type": "单选题", "question": "产生频率崩溃的原因为(  )。", "options": [{"label": "A", "text": "有功功率严重不足"}, {"label": "B", "text": "无功功率严重不足"}, {"label": "C", "text": "系统受到小的干扰"}, {"label": "D", "text": "系统发生短路"}], "answer": "A", "analysis": "电力系统频率崩溃是指电力系统或被解列后的局部系统出现较大有功功率缺额时,频率大幅度下降.影响汽轮发电机组出力降低或跳闸,造成频率进一步下降。"}, {"category": "配电网概述", "type": "单选题", "question": "潮流计算是根据给定的电网结构、参数和发电机、负荷等元件的运行条件，确定电力系统各部分(  )运行参数的计算。", "options": [{"label": "A", "text": "暂态"}, {"label": "B", "text": "动态"}, {"label": "C", "text": "稳态"}, {"label": "D", "text": "准稳态"}], "answer": "C", "analysis": "潮流计算是根据给定的电网结构、参数和发电机、负荷等元件的运行条件,确定电力系统各部分稳态运行状态参数的计算。"}, {"category": "配电网概述", "type": "单选题", "question": "当电力系统的发供平衡被破坏时电网频率将产生波动；当电力系统发生有功功率缺额时,系统频率将(  )。", "options": [{"label": "A", "text": "低于额定频率"}, {"label": "B", "text": "高于额定频率"}, {"label": "C", "text": "没有变化"}, {"label": "D", "text": "忽高忽低地波动"}], "answer": "A", "analysis": "当系统有功功率增大到原动机功率无法再增大时,就产生了所谓“有功缺额”的问题,这时作用在发电机转子上的负载阻力矩大于转动力矩,发电机转子就会减速(频率降低)。"}, {"category": "配电网概述", "type": "单选题", "question": "当电力系统受到较大干扰而发生非同步振荡时,为防止整个系统的稳定被破坏,经过一段时间或超过规定的振荡周期数后,在预定地点将系统进行解列,该执行装置称为(  )。", "options": [{"label": "A", "text": "低频、或低压解列装置"}, {"label": "B", "text": "联切负荷装置"}, {"label": "C", "text": "稳定切机装置"}, {"label": "D", "text": "振荡解列装置"}], "answer": "D", "analysis": "当电力系统受到较大干扰而发生非同步振荡时,为防止整个系统的稳定被破坏,经过一段时间或超过规定的振荡周期数后,在预定地点将系统进行解列,执行振荡解列的自动装置称为振荡解列装置。"}, {"category": "配电网概述", "type": "单选题", "question": "以下母线接线方式中，运行可靠性、灵活性最差的是(  )。", "options": [{"label": "A", "text": "3/2接线"}, {"label": "B", "text": "双母线"}, {"label": "C", "text": "内桥接线"}, {"label": "D", "text": "单母线"}], "answer": "D", "analysis": "母线接线方式中运行可靠性、灵活性最差的是单母线。"}, {"category": "配电网概述", "type": "单选题", "question": "地热发电首先是把地下热能转换成为(  )。", "options": [{"label": "A", "text": "机械能"}, {"label": "B", "text": "势能"}, {"label": "C", "text": "动能"}, {"label": "D", "text": "化学能"}], "answer": "A", "analysis": "地热发电是利用地下热水和蒸汽为动力源的一种新型发电技术。其基本原理与火力发电类似,也是根据能量转换原理,首先把地热能转换为机械能,再把机械能转换为电能。"}, {"category": "配电网概述", "type": "单选题", "question": "电力系统各节点电压主要取决于(  )。", "options": [{"label": "A", "text": "有功负荷的供需平衡"}, {"label": "B", "text": "无功负荷的供需平衡"}, {"label": "C", "text": "有功和无功负荷的供需平衡"}, {"label": "D", "text": "网络结构"}], "answer": "C", "analysis": "系统电压主要取决于各区的有功和无功负荷供需平衡情况,影响系统电压的主要因素是：负荷变化、无功补偿容量的变化、系统运行方式的改变引起的功率分布变化和网络阻抗变化。"}, {"category": "配电网概述", "type": "单选题", "question": "一空载运行电缆线路,首端电压和末端电压分别为U1和U2,下面正确的是(  )。", "options": [{"label": "A", "text": "U1<U2"}, {"label": "B", "text": "U1=U2"}, {"label": "C", "text": "U1>U2"}, {"label": "D", "text": "不确定"}], "answer": "A", "analysis": "空载运行电缆线路相相当于一个电容器,末端电压相当于经电容器补偿后电压高于首端电压"}, {"category": "配电网概述", "type": "单选题", "question": "变电站的直流系统直流绝缘监视装置监测的是(  )。", "options": [{"label": "A", "text": "监测变电站的直流系统正负极间绝缘"}, {"label": "B", "text": "监测变电站的直流系统正极对地间绝缘"}, {"label": "C", "text": "监测变电站的直流系统负极对地间绝缘"}, {"label": "D", "text": "监测变电站的直流系统正、负极对地绝缘"}], "answer": "D", "analysis": "变电站的直流系统直流绝缘监视装置利用电桥平衡的原理监测变电站的直流系统正、负极对地绝缘。"}, {"category": "配电网概述", "type": "单选题", "question": "下面不是发电机失磁的现象项为(  )。", "options": [{"label": "A", "text": "转子电流表指示为零或接近于零"}, {"label": "B", "text": "定子电流表指示升高并摆动,有功功率表指示降低"}, {"label": "C", "text": "无功功率表指示为负值,发电机调相运行"}, {"label": "D", "text": "发电机母线电压指示降低并摆动"}], "answer": "C", "analysis": "发电机失磁时无功功率表指示为负值,发电机进相运行。"}, {"category": "配电网概述", "type": "单选题", "question": "在火力发电厂中使高温高压蒸汽膨胀做功,将携带的热能转变为机械能的关键设备是(  )。", "options": [{"label": "A", "text": "锅炉"}, {"label": "B", "text": "汽轮机"}, {"label": "C", "text": "发电机"}, {"label": "D", "text": "电动机"}], "answer": "B", "analysis": "在火力发电厂中使高温高压蒸汽膨胀作功,将携带的热能转变为机械能的关键设备是汽轮机。"}, {"category": "配电网概述", "type": "单选题", "question": "变压器过负荷时,为消除过负荷,不能采取的措施为(  )", "options": [{"label": "A", "text": "投入备用变压器"}, {"label": "B", "text": "将变压器二次侧并列运行,使得两台变压器负荷均衡,但接近满载"}, {"label": "C", "text": "限制负荷"}, {"label": "D", "text": "转移负荷"}], "answer": "B", "analysis": "由于两台变压器的短路电压不同,所以负载电流相对值不相等,变压器并列时不能同时达到满载。"}, {"category": "配电网概述", "type": "单选题", "question": "消弧线圈补偿度ρ＜0,对应于(  )时的情况。", "options": [{"label": "A", "text": "全补偿"}, {"label": "B", "text": "过补偿"}, {"label": "C", "text": "恒补偿"}, {"label": "D", "text": "欠补偿"}], "answer": "D", "analysis": "在小电流接地系统中消弧线圈补偿度ρ＜0为欠补偿反之过补偿,ρ=0时为全补偿,不允许消弧线圈全补偿运行。"}, {"category": "配电网概述", "type": "单选题", "question": "电网低频率运行时,发电厂给水泵和循环水泵的转速将(  )。", "options": [{"label": "A", "text": "不变"}, {"label": "B", "text": "减慢"}, {"label": "C", "text": "加快"}, {"label": "D", "text": "不一定"}], "answer": "B", "analysis": "电网低频率运行时,发电厂给水泵和循环水泵偏离额定工况点导致转速将减慢,效率会低下来,在其性能曲线上可以显示出来。"}, {"category": "配电网概述", "type": "单选题", "question": "变电站母线上装设避雷器是为了(  )。", "options": [{"label": "A", "text": "防止直击雷"}, {"label": "B", "text": "防止反击过电压"}, {"label": "C", "text": "防止雷电行波"}, {"label": "D", "text": "防止雷电流"}], "answer": "C", "analysis": "变电站母线上装设避雷器是为了防止雷电行波"}, {"category": "配电网概述", "type": "单选题", "question": "在以下设备中.对于(  ),其负序电抗和正序电抗是不同的。", "options": [{"label": "A", "text": "变压器"}, {"label": "B", "text": "电容器"}, {"label": "C", "text": "发电机"}, {"label": "D", "text": "电抗器"}], "answer": "C", "analysis": "只有发电负序电抗和正序电抗是不同的。"}, {"category": "配电网概述", "type": "多选题", "question": "电力网是指电力系统中（）电能的部分，包括升、降压变压器和各种 电压等级的输电线路，是电力系统的一部分。", "options": [{"label": "A", "text": "输送"}, {"label": "B", "text": "变换"}, {"label": "C", "text": "分配"}, {"label": "D", "text": "使用"}], "answer": "ABC", "analysis": "出自《配电网调控人员培训手册》第一章第一节:电力系统中输送、变换和分配电能的部分，它包括升、降压变压器和各种电压等级的输电线路，它是电力系统的一部分。"}, {"category": "配电网概述", "type": "多选题", "question": "输电网是以（）输电线路将发电厂、变电站连接起来的输电网络，是电力网中的主干网络。", "options": [{"label": "A", "text": "中压"}, {"label": "B", "text": "高压"}, {"label": "C", "text": "超高电压"}, {"label": "D", "text": "特高压"}], "answer": "BCD", "analysis": "出自《配电网调控人员培训手册》第一章第一节:输电网。以高压（220kV）、超高电压（330kV、500kV、750kV）、特高压（交流1000kV、直流±800kV）输电线路将发电厂、变电站连接起来的输电网络，是电力网中的主干网络。"}, {"category": "配电网概述", "type": "多选题", "question": "电能是一种应用广泛的能源，其（）的各个环节有机地构成一个系统。", "options": [{"label": "A", "text": "生产（发电厂）"}, {"label": "B", "text": "输送（输配电线路）"}, {"label": "C", "text": "分配（变电站）"}, {"label": "D", "text": "消费（电力客户）"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第一节:电能是一种应用广泛的能源，其生产（发电厂）、输送（输配电线路）、分配（变电站）和消费（电力客户）的各个环节有机地构成一个系统。"}, {"category": "配电网概述", "type": "多选题", "question": "动力系统是由发电厂的动力部分以及（）、用电组成的整体。", "options": [{"label": "A", "text": "发电"}, {"label": "B", "text": "输电"}, {"label": "C", "text": "变电"}, {"label": "D", "text": "配电"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第一节：动力系统是由发电厂的动力部分（如火力发电的锅炉、汽轮机，水力发电的水轮机和水库，核力发电的核反应堆和汽轮机等）以及发电、输电、变电、配电、用电组成的整体。"}, {"category": "配电网概述", "type": "多选题", "question": "电力系统是由（）和用电组成的整体，它是动力系统的一部分。", "options": [{"label": "A", "text": "发电"}, {"label": "B", "text": "输电"}, {"label": "C", "text": "变电"}, {"label": "D", "text": "配电"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第一节：电力系统是由发电、输电、变电、配电和用电组成的整体，它是动力系统的一部分。"}, {"category": "配电网概述", "type": "多选题", "question": "电力网是电力系统中（）电能的部分。", "options": [{"label": "A", "text": "生产"}, {"label": "B", "text": "输送"}, {"label": "C", "text": "变换"}, {"label": "D", "text": "分配"}], "answer": "BCD", "analysis": "出自《配电网调控人员培训手册》第一章第一节：电力网是电力系统中输送、变换和分配电能的部分，它包括升、降压变压器和各种电压等级的输电线路，它是电力系统的一部分。"}, {"category": "配电网概述", "type": "多选题", "question": "下列关于配电网特点描述，正确的有（）。", "options": [{"label": "A", "text": "供电线路长，分布面积广"}, {"label": "B", "text": "发展速度快，用户对供电质量要求高"}, {"label": "C", "text": "负荷随季节变化不大"}, {"label": "D", "text": "接线较复杂，必须保证调度灵活性、运行供电连续性和经济性"}], "answer": "ABD", "analysis": "出自《配电网调控人员培训手册》第一章第二节:配电网的特点\n1.供电线路长，分布面积广。\n2.发展速度快，用户对供电质量要求高。\n3.对经济发展较好地区配电网设计标准要求高，供电的可靠性要求较高。\n4.农网负荷季节性强。\n5.配电网接线较复杂，必须保证调度上的灵活性、运行上的供电连续性和经济性。\n6.随着配电网自动化水平的提高，对供电管理水平的要求越来越高。\n7.随着分布式电源、储能、增量配网及微电网的接入，配电网由传统的无源网向有源网转变，配电网物理形态及运行特性发生重大变化。"}, {"category": "配电网概述", "type": "多选题", "question": "低压配电网是主要采用（）组成的混合系统。", "options": [{"label": "A", "text": "三相四线制"}, {"label": "B", "text": "单相"}, {"label": "C", "text": "三相三线制"}, {"label": "D", "text": "单相单线制"}], "answer": "ABC", "analysis": "出自《配电网调控人员培训手册》第一章第二节:低压配电网是主要采的三相四线制、单相和三相三线制组成的混合系统。"}, {"category": "配电网概述", "type": "多选题", "question": "按照电压等级分类，下列属于中压配电网的是（）。", "options": [{"label": "A", "text": "35kV"}, {"label": "B", "text": "20kV"}, {"label": "C", "text": "10kV"}, {"label": "D", "text": "6kV"}], "answer": "BCD", "analysis": "出自《配电网调控人员培训手册》第一章第二节:配电网按电压等级的不同，可又分为高压配电网（110kV、66kV、35kV）、中压配电网（20kV、10kV、6kV、3kV）和低压配电网（220V/380V）。"}, {"category": "配电网概述", "type": "多选题", "question": "按照电压等级分类，下列属于高压配电网的是（）。", "options": [{"label": "A", "text": "110kV"}, {"label": "B", "text": "66kV"}, {"label": "C", "text": "35kV"}, {"label": "D", "text": "6kV"}], "answer": "ABC", "analysis": "出自《配电网调控人员培训手册》第一章第二节:配电网按电压等级的不同，可又分为高压配电网（110kV、66kV、35kV）、中压配电网（20kV、10kV、6kV、3kV）和低压配电网（220V/380V）。"}, {"category": "配电网概述", "type": "多选题", "question": "下列关于低压配电网特点描述正确的是（）。", "options": [{"label": "A", "text": "供电距离较近"}, {"label": "B", "text": "电源点较多"}, {"label": "C", "text": "供电容量不大"}, {"label": "D", "text": "分布面广"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第二节:低压配电网的供电距离较近，低压电源点较多，一台配电变压器就可作为一个低压配电网的电源，两个电源点之间的距离通常不超过几百米。低压配电线路供电容量不大，但分布面广，除一些集中用电的用户外，大量是供给城乡居民生活用电及分散的街道照明用电等。低压配电网主要采用的三相四线制、单相和三相三线制组成的混合系统。我国规定采用单相220V、三相380V的低压额定电压。"}, {"category": "配电网概述", "type": "多选题", "question": "下列哪些是配电网的特点（）。", "options": [{"label": "A", "text": "供电线路长，分布面积广"}, {"label": "B", "text": "发展速度快，用户对供电质量要求高"}, {"label": "C", "text": "对经济发展较好地区配电网设计标准要求高，供电的可靠性要求较高"}, {"label": "D", "text": "农网负荷季节性强"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第二节：配电网的特点\n1.供电线路长，分布面积广。\n2.发展速度快，用户对供电质量要求高。\n3.对经济发展较好地区配电网设计标准要求高，供电的可靠性要求较高。\n4.农网负荷季节性强。\n5.配电网接线较复杂，必须保证调度上的灵活性、运行上的供电连续性和经济性。\n6.随着配电网自动化水平的提高，对供电管理水平的要求越来越高。\n7.随着分布式电源、储能、增量配网及微电网的接入，配电网由传统的无源网向有源网转变，配电网物理形态及运行特性发生重大变化。"}, {"category": "配电网概述", "type": "多选题", "question": "关于一级负荷的供电要求，下列正确的是（）。", "options": [{"label": "A", "text": "两路电源不应该是单杆双回路架设"}, {"label": "B", "text": "两路电源不能出自电源的同一条母线"}, {"label": "C", "text": "特别重要负荷必须增设自备应急电源"}, {"label": "D", "text": "可以由第三路电源供电作为备用电源"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第三节:一级负荷应由两路电源供电。供同一用户的两路电源不应该是单杆双回路架设，也不能出自电源的同一条母线。一级负荷中的特别重要负荷必须增设自备应急电源，也可以由第三路电源供电作为备用电源。"}, {"category": "配电网概述", "type": "多选题", "question": "关于二级负荷的供电要求，下列正确的是（）。", "options": [{"label": "A", "text": "当其中一路电源中断供电时，另一路电源应该能满足全部或部分负荷的供电需要。"}, {"label": "B", "text": "用户也可以增设自备应急电源或其他应急措施。"}, {"label": "C", "text": "必须增设自备应急电源"}, {"label": "D", "text": "宜由两路电源供电"}], "answer": "ABD", "analysis": "出自《配电网调控人员培训手册》第一章第三节:二级负荷宜由两路电源供电，当其中一路电源中断供电时，另一路电源应该能满足全部或部分负荷的供电需要。用户也可以增设自备应急电源或其他应急措施。"}, {"category": "配电网概述", "type": "多选题", "question": "下列负荷是属于二级负荷的是（）。", "options": [{"label": "A", "text": "大量人员集中的公共场所"}, {"label": "B", "text": "政治和外事活动中心"}, {"label": "C", "text": "交通和通信枢纽用电负荷"}, {"label": "D", "text": "重要的教育机构"}], "answer": "AC", "analysis": "出自《配电网调控人员培训手册》第一章第三节:二级负荷是指突然停电将在经济上造成较大损失，或在政治上造成不良影响、公共秩序混乱的这类负荷。如突然停电将造成主要设备损坏、大量产品报废、造成环境污染、大量减产的工厂用电负荷，交通和通信枢纽用电负荷，大量人员集中的公共场所等。"}, {"category": "配电网概述", "type": "多选题", "question": "一级负荷是指（）的这类负荷。", "options": [{"label": "A", "text": "突然停电将会造成人身伤亡"}, {"label": "B", "text": "在经济上造成重大损失,在政治上造成重大不良影响"}, {"label": "C", "text": "造成公共秩序严重混乱"}, {"label": "D", "text": "造成环境严重污染"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第三节:一级负荷是指突然停电将会造成人身伤亡，或在经济上造成重大损失，或在政治上造成重大不良影响、公共秩序严重混乱、造成环境严重污染的这类负荷。如重要交通和通信枢纽用电负荷、重点企业中的重大设备和连续生产线、政治和外事活动中心等。"}, {"category": "配电网概述", "type": "多选题", "question": "二级负荷是指（）的这类负荷。", "options": [{"label": "A", "text": "突然停电将会造成人身伤亡"}, {"label": "B", "text": "在经济上造成较大损失"}, {"label": "C", "text": "在政治上造成不良影响"}, {"label": "D", "text": "公共秩序混乱的这类负荷"}], "answer": "BCD", "analysis": "出自《配电网调控人员培训手册》第一章第三节:二级负荷是指突然停电将在经济上造成较大损失，或在政治上造成不良影响、公共秩序混乱的这类负荷。如突然停电将造成主要设备损坏、大量产品报废、造成环境污染、大量减产的工厂用电负荷，交通和通信枢纽用电负荷，大量人员集中的公共场所等。"}, {"category": "配电网概述", "type": "多选题", "question": "配电网安全技术要求（）。", "options": [{"label": "A", "text": "保证持续供电"}, {"label": "B", "text": "及时发现配电网的非正常运行情况"}, {"label": "C", "text": "及时发现配电网的设备存在的缺陷情况"}, {"label": "D", "text": "迅速隔离故障、大限度地缩小停电范围，满足灵活供电需要"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第四节：配电网安全技术要求（1） 保证持续供电是对配电网的第一要求。因为电能的生产、供应和用电几乎是瞬间同时完成的，电能的中断或减少直接影响国民经济生产各部门及人们的生活需要。因此，必须对配电设备和用户实施不间断供电。\n（2） 及时发现网络的非正常运行情况和设备存在的缺陷情况是对配电网的第二要求。因为网络处于异常运行情况或设备存在某些缺陷时，配电网还是可以继续运行一段时间，但是不及时发现这些问题就会使运行环境恶化，导致发生电力事故。\n（3） 迅速隔离故障、最大限度地缩小停电范围，满足灵活供电需要是对配电网的第三要求。因为一旦发生故障（如短路），断路器就会跳闸，如果重合不成功就会造成较大面积的停电，此时需要迅速发现并隔离故障，缩小停电范围，保证其他用户可以继续安全、可靠地用电。"}, {"category": "配电网概述", "type": "多选题", "question": "衡量电能质量的指标通常是（）。", "options": [{"label": "A", "text": "电压"}, {"label": "B", "text": "电流"}, {"label": "C", "text": "频率"}, {"label": "D", "text": "波形"}], "answer": "ACD", "analysis": "出自《配电网调控人员培训手册》第一章第四节：衡量电能质量的指标通常是电压、频率和波形，在配电网中电压和波形显得尤为重要。"}, {"category": "配电网概述", "type": "多选题", "question": "为保证配电网经济运行，可以从下列（）方面加以考虑。", "options": [{"label": "A", "text": "根据负荷变化情况改变配电网络的供电方式"}, {"label": "B", "text": "根据负荷变化情况改变变压器的运行方式，使之处于经济运行状态"}, {"label": "C", "text": "降低变压器的铁芯损耗，使用节能型的变压器"}, {"label": "D", "text": "结合工程改变供电路径，使用节能设备、器材，避免迂回供电"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第四节：在保证持续供电、用户接受合格电能的同时，要求配电网在最经济的状态下运行，这样可以使得配电网的网损最小，不仅可以降低运行成本，还可以提高一小部分供电能力。故可以从下列几个方面加以考虑：\n（1） 根据负荷变化情况改变配电网络的供电方式。\n（2） 根据负荷变化情况改变变压器的运行方式，使之处于经济运行状态。\n（3） 降低变压器的铁芯损耗，使用节能型的变压器。\n（4） 结合工程改变供电路径，使用节能设备、器材，避免迂回供电。"}, {"category": "配电网概述", "type": "多选题", "question": "配电网应具有（）。", "options": [{"label": "A", "text": "必备的容量裕度"}, {"label": "B", "text": "适当的负荷转移能力"}, {"label": "C", "text": "一定的自愈能力和应急处理能力"}, {"label": "D", "text": "合理的分布式电源接纳能力"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第四节：配电网应安全、可靠、经济地向用户供电，具有必备的容量裕度、适当的负荷转移能力、一定的自愈能力和应急处理能力、合理的分布式电源接纳能力。"}, {"category": "配电网概述", "type": "多选题", "question": "关于电压质量要求说法正确的是（）。", "options": [{"label": "A", "text": "35～110kV供电电压正负偏差的绝对值之和不超过标称电压的7%。"}, {"label": "B", "text": "35～110kV供电电压正负偏差的绝对值之和不超过标称电压的10%。"}, {"label": "C", "text": "10kV及以下三相供电电压允许偏差为标称电压的±7%。"}, {"label": "D", "text": "10kV及以下三相供电电压允许偏差为标称电压的±10%。"}], "answer": "BC", "analysis": "出自《配电网调控人员培训手册》第一章第四节：配电网规划要保证网络中各节点满足电压损失及其分配要求，各类用户受电电压质量执行 GB/T 12325的规定。\n1）110～35kV供电电压正负偏差的绝对值之和不超过标称电压的10%。\n2）10kV及以下三相供电电压允许偏差为标称电压的±7%。\n3）220V单相供电电压允许偏差为标称电压的+7％与-10%。\n4）对供电点短路容量较小、供电距离较长以及对供电电压偏差有特殊要求的用户，由供、用电双方协议确定。"}, {"category": "配电网概述", "type": "多选题", "question": "下列属于配电网频率偏差过大危害的有（）。", "options": [{"label": "A", "text": "影响用户的产品产量和质量"}, {"label": "B", "text": "影响电子设备工作的准确性"}, {"label": "C", "text": "增大变压器和异步电机励磁无功损耗"}, {"label": "D", "text": "将影响发电厂的出力和电网稳定"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第四节：频率偏差大，将影响用户的产品产量和质量，影响电子设备工作的准确性，增大变压器和异步电机励磁无功损耗，将影响发电厂的出力和电网稳定，甚至造成汽轮机叶片损伤或断落事故。"}, {"category": "配电网概述", "type": "多选题", "question": "单电源供电形式特点是（）。", "options": [{"label": "A", "text": "维护方便"}, {"label": "B", "text": "保护简单"}, {"label": "C", "text": "便于发展"}, {"label": "D", "text": "可靠性较差"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第五节：单电源供电形式特点是维护方便、保护简单、便于发展、但可靠性较差。"}, {"category": "配电网概述", "type": "多选题", "question": "中压配电网结构主要有（）。", "options": [{"label": "A", "text": "双环式"}, {"label": "B", "text": "单环式"}, {"label": "C", "text": "多分段适度联络"}, {"label": "D", "text": "多分段单联络和多分段单辐射"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第五节：中压配电网结构主要有：双环式、单环式、多分段适度联络、多分段单联络和多分段单辐射。"}, {"category": "配电网概述", "type": "多选题", "question": "放射式低压网络适用于以下场合（）。", "options": [{"label": "A", "text": "单台设备容量较大，负荷集中或重要的用电设备"}, {"label": "B", "text": "设备容量不大，并且位于配电变压器不同方向"}, {"label": "C", "text": "负荷配置较稳定"}, {"label": "D", "text": "负荷排列不整齐"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第五节：放射式低压网络具有配电线故障互不影响，供电可靠性较高，配电设备集中，检修比较方便的优点，但系统灵活性较差，导线金属耗材较多，这种接线方式适用于以下场合：\n1）单台设备容量较大，负荷集中或重要的用电设备；\n2）设备容量不大，并且位于配电变压器不同方向；\n3）负荷配置较稳定；\n4）负荷排列不整齐。"}, {"category": "配电网概述", "type": "多选题", "question": "放射式低压网络具有（）等优点。", "options": [{"label": "A", "text": "配电线故障互不影响"}, {"label": "B", "text": "供电可靠性较高"}, {"label": "C", "text": "配电设备集中"}, {"label": "D", "text": "检修比较方便"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第五节：放射式低压网络具有配电线故障互不影响，供电可靠性较高，配电设备集中，检修比较方便的优点。"}, {"category": "配电网概述", "type": "多选题", "question": "低压配电网采用简单闭式接线方式,必须具备以下条件（）。", "options": [{"label": "A", "text": "各对应边的阻抗应尽可能相等,以保证熔断器能选择性地断开"}, {"label": "B", "text": "连在一起的变压器容量比,不宜大于1:2"}, {"label": "C", "text": "短路电压比，不宜大于10%"}, {"label": "D", "text": "如从不同的电源引出,还应注意相位和相序关系"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第五节：采用简单闭式接线方式,必须具备以下条件：\n（1）各对应边的阻抗应尽可能相等，以保证熔断器能选择性地断开；\n（2）连在一起的变压器容量比，不宜大于1：2；\n（3）短路电压比，不宜大于10%；\n（4）如从不同的电源引出，还应注意相位和相序关系。"}, {"category": "配电网概述", "type": "多选题", "question": "简单闭式接线的主要特点如下（）。", "options": [{"label": "A", "text": "高压侧由单回路供电,电源可靠性较差"}, {"label": "B", "text": "高压侧由多回路供电,电源可靠性较高"}, {"label": "C", "text": "充分利用线路和变压器的容量,不必留出很大备用容量"}, {"label": "D", "text": "在联络干线端和干线中部都装有熔断器"}], "answer": "BCD", "analysis": "出自《配电网调控人员培训手册》第一章第五节：简单闭式接线的主要特点如下:\na．高压侧由多回路供电,电源可靠性较高\nb．充分利用线路和变压器的容量,不必留出很大备用容量\nc．在联络干线端和干线中部都装有熔断器。"}, {"category": "配电网概述", "type": "多选题", "question": "低压配电网网络结构主要有（）。", "options": [{"label": "A", "text": "开式低压网络"}, {"label": "B", "text": "闭式低压网络"}, {"label": "C", "text": "辐射式低压网络"}, {"label": "D", "text": "链式低压网络"}], "answer": "AB", "analysis": "出自《配电网调控人员培训手册》第一章第五节：低压配电网网络结构主要有开式低压网络和闭式低压网络。"}, {"category": "配电网概述", "type": "多选题", "question": "干线式低压配电网接线适用于以下场合（）。", "options": [{"label": "A", "text": "数量较多，而且排列不整齐的用电设备"}, {"label": "B", "text": "数量较多，而且排列整齐的用电设备"}, {"label": "C", "text": "对供电可靠性要求不高的用电设备"}, {"label": "D", "text": "对供电可靠性要求较高的用电设备"}], "answer": "BC", "analysis": "出自《配电网调控人员培训手册》第一章第五节：干线式低压配电网：该这种接线适用于以下场合：\na. 数量较多，而且排列整齐的用电设备；\nb. 对供电可靠性要求不高的用电设备，如机械加工、铆焊、铸工和热处理等。"}, {"category": "配电网概述", "type": "多选题", "question": "配电网的中性点运行方式是一个综合性问题，它与电压等级、单相接地电流、过电压水平、保护配置等有关，直接影响（）。", "options": [{"label": "A", "text": "电网的绝缘水平"}, {"label": "B", "text": "系统供电的可靠性"}, {"label": "C", "text": "主变压器和发电机的运行安全"}, {"label": "D", "text": "对通信线路的干扰"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第六节：配电网的中性点运行方式是一个综合性问题，它与电压等级、单相接地电流、过电压水平、保护配置等有关，直接影响电网的绝缘水平、系统供电的可靠性、主变压器和发电机的运行安全以及对通信线路的干扰等。"}, {"category": "配电网概述", "type": "多选题", "question": "中性点直接接地方式的优点包括（）。", "options": [{"label": "A", "text": "短路电流小"}, {"label": "B", "text": "过电压较低"}, {"label": "C", "text": "减少设备绝缘投资"}, {"label": "D", "text": "降低设备造价"}], "answer": "BCD", "analysis": "出自《配电网调控人员培训手册》第一章第六节：中性点直接接地方式供电可靠性低，因为系统发生单相接地时会构成短路，此时短路电流很大，为防止损坏设备，必须迅速切除接地相甚至三相；同时，巨大的接地短路电流产生较强的单相磁场干扰邻近通信线路。但这种系统的过电压较低，减少设备绝缘投资，降低设备造价，特别适用于高压和超高压电网。"}, {"category": "配电网概述", "type": "多选题", "question": "消弧线圈的补偿方式分为（）。", "options": [{"label": "A", "text": "过补偿"}, {"label": "B", "text": "欠补偿"}, {"label": "C", "text": "全补偿"}, {"label": "D", "text": "半补偿"}], "answer": "ABC", "analysis": "出自《配电网调控人员培训手册》第一章第六节：消弧线圈的补偿方式分为过补偿、欠补偿和全补偿，一般采用过补偿的方式。过补偿是指感性电流大于容性电流时的补偿方式；欠补偿是指感性电流小于容性电流的补偿方式；全补偿是指感性电流等于容性电流的补偿方式。"}, {"category": "配电网概述", "type": "多选题", "question": "中性点经小电阻系统优点包括（）。", "options": [{"label": "A", "text": "单相接地故障电流大，可快速切除故障线路"}, {"label": "B", "text": "过电压水平低，可采用绝缘水平较低的电缆和设备"}, {"label": "C", "text": "地电位升高比中性点不接地、消弧线圈接地、大电阻接地系统要低"}, {"label": "D", "text": "供电可靠性高"}], "answer": "AB", "analysis": "出自《配电网调控人员培训手册》第一章第六节：中性点经小电阻系统优点是单相接地故障电流大，可快速切除故障线路；过电压水平低，可采用绝缘水平较低的电缆和设备。缺点是单相接地故障电流有100～1000A，地电位升高比中性点不接地、消弧线圈接地、大电阻接地系统等更高；单相接地故障电流较大，必须立即切断故障线路，会造成供电中断，供电可靠性降低。"}, {"category": "配电网概述", "type": "多选题", "question": "配电网的中性点运行方式是一个综合性问题，它（）有关。", "options": [{"label": "A", "text": "电压等级"}, {"label": "B", "text": "单相接地电流"}, {"label": "C", "text": "过电压水平"}, {"label": "D", "text": "保护配置"}], "answer": "ABCD", "analysis": "出自《配电网调控人员培训手册》第一章第六节：配电网的中性点运行方式是一个综合性问题，它与电压等级、单相接地电流、过电压水平、保护配置等有关。"}, {"category": "配电网概述", "type": "多选题", "question": "低压配电网主要采用（）接地方式。", "options": [{"label": "A", "text": "TN接地方式"}, {"label": "B", "text": "TT接地方式"}, {"label": "C", "text": "IT接地方式"}, {"label": "D", "text": "IN接地方式"}], "answer": "ABC", "analysis": "出自《配电网调控人员培训手册》第一章第六节：低压配电网主要采用TN、TT和IT接地方式。"}, {"category": "配电网概述", "type": "多选题", "question": "关于系统振荡和短路,下列说法正确的是(  )。", "options": [{"label": "A", "text": "振荡时电流和电压的变化速度较慢"}, {"label": "B", "text": "振荡时电流和电压的变化速度较快"}, {"label": "C", "text": "短路时电流和电压的变化速度较慢"}, {"label": "D", "text": "短路时电流和电压的变化速度较快"}], "answer": "AD", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：电力系统振荡和短路的主要区别是:1、振荡时系统各点电压和电流值均作往复性摆动,而短路时电流、电压值是突变的。此外,振荡时电流、电压值的变化速度较慢,而短路时电流、电压值突然变化量很大。2、振荡时系统任何一点电流与电压之间的相位角都随功角的变化而改变；而短路时,电流与电压之间的角度是基本不变的。3、振荡时系统三相是对称的；而短路时系统可能出现三相不对称。"}, {"category": "配电网概述", "type": "多选题", "question": "电磁环网对电网运行有何弊端有(  )。", "options": [{"label": "A", "text": "易造成热稳定破坏"}, {"label": "B", "text": "易造成动稳定破坏"}, {"label": "C", "text": "不利于经济运行"}, {"label": "D", "text": "需要装设安自装置"}], "answer": "ABCD", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：电磁环网对电网运行主要有以下弊端：(1)易造成热稳定破坏；(2)易造成动稳定破坏；(3)不利于经济运行；(4)需要装设高压线路应故障停运后联锁切机、切负荷等安全自动装置。"}, {"category": "配电网概述", "type": "多选题", "question": "电力系统的暂态过程包含(  )过程。", "options": [{"label": "A", "text": "波过程"}, {"label": "B", "text": "电磁暂态过程"}, {"label": "C", "text": "机电暂态过程"}, {"label": "D", "text": "热稳定过程"}], "answer": "ABC", "analysis": "电力系统的运行状态分为稳态运行和暂态过程两种,其中暂态过程又分为波过程、电磁暂态过程和机电暂态过程。波过程主要研究与大气过电压和操作过电压有关的电压波和电流波的传递过程；电磁暂态过程主要研究与各种短路故障和断线故障有关的电压、电流的变化,有时也涉及功率的变化；机电暂态过程主要研究电力系统受到干扰时,发电机转速、功角、功率的变化。"}, {"category": "配电网概述", "type": "多选题", "question": "电力系统工频过电压的原因主要为(  )。", "options": [{"label": "A", "text": "空载长线路的电容效应"}, {"label": "B", "text": "系统中各元件参数选择不当引起的谐振效应"}, {"label": "C", "text": "甩负荷引起的工频电压升高"}, {"label": "D", "text": "不对称短路引起的非故障相电压升高"}], "answer": "ACD", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：电力系统工频过电压的原因主要有以下几点：(1)空载长线路的电容效应；(2)不对称短路引起的非故障相电压升高；(3)甩负荷引起的工频电压升高。"}, {"category": "配电网概述", "type": "多选题", "question": "电力系统序参数包括(  )。", "options": [{"label": "A", "text": "正序"}, {"label": "B", "text": "负序"}, {"label": "C", "text": "中序"}, {"label": "D", "text": "零序"}], "answer": "ABD", "analysis": "出自《电力系统运行实用技术问答(第二版)》第二章：在线性电路中,系统发生不对称短路时,将网络中出现的三相不对称的电压和电流,分解为正、负、零序三组对称分量,分别按对称三相电路去解,然后将其结果叠加起来,这种方法即为对称分量法。"}, {"category": "配电网概述", "type": "多选题", "question": "谐波对电网的影响有(  )。", "options": [{"label": "A", "text": "对旋转设备和变压器引起附加损耗以及发热增加"}, {"label": "B", "text": "对线路引起附加损耗"}, {"label": "C", "text": "引起系统的电感、电容发生谐振,使谐波放大"}, {"label": "D", "text": "干扰通信设备"}], "answer": "ABCD", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：除了选项列出的影响外,谐波还会引起旋转设备和变压器振动并发出噪声,容易造成金属疲劳和机械损坏；增加电力系统的功率损耗；使无功补偿设备不能正常运行等。"}, {"category": "配电网概述", "type": "多选题", "question": "限制电网谐波的主要措施有(  )。", "options": [{"label": "A", "text": "增加换流装置的脉动数"}, {"label": "B", "text": "加装交流滤波器"}, {"label": "C", "text": "加装有源滤波器"}, {"label": "D", "text": "加强谐波管理"}], "answer": "ABCD", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：限制电网谐波的主要措施有：增加换流装置的脉动数,加装交流滤波器、有源滤波器,加强谐波管理。"}, {"category": "配电网概述", "type": "多选题", "question": "交流电路中,功率因数等于(  )。", "options": [{"label": "A", "text": "电压与电流的相位角差的正弦"}, {"label": "B", "text": "电压与电流的相位角差的余弦"}, {"label": "C", "text": "有功功率与视在功率的比值"}, {"label": "D", "text": "无功功率与视在功率的比值"}], "answer": "BC", "analysis": "在交流电路中,电压与电流之间的相位差(Φ)的余弦叫做功率因数,用符号cosΦ表示,在数值上,功率因数是有功功率和视在功率的比值,即cosΦ=P/S"}, {"category": "配电网概述", "type": "多选题", "question": "系统内电压大幅度下降的原因有(  )。", "options": [{"label": "A", "text": "负荷急剧增加"}, {"label": "B", "text": "负荷急剧减少"}, {"label": "C", "text": "无功电源的突然切除"}, {"label": "D", "text": "无功电源的突然投入"}], "answer": "AC", "analysis": "系统内电压取决于有功无功的平衡,负荷的急剧增加、无功功率的急剧减少都会引起电压大幅下降"}, {"category": "配电网概述", "type": "多选题", "question": "电力系统主要有(  )三大谐波源。", "options": [{"label": "A", "text": "铁磁饱和性"}, {"label": "B", "text": "电子开关型"}, {"label": "C", "text": "电弧型"}, {"label": "D", "text": "电阻型"}], "answer": "ABC", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：当前,电力系统的谐波源主要有三大类：铁磁饱和性；电子开关型；电弧型。"}, {"category": "配电网概述", "type": "多选题", "question": "影响系统电压的因素有(  )。", "options": [{"label": "A", "text": "由于生产、生活、气象等因素引起的负荷变化"}, {"label": "B", "text": "无功补偿容量的变化"}, {"label": "C", "text": "系统运行方式的改变引起的功率分布和网络阻抗变化"}, {"label": "D", "text": "电压互感器变化"}], "answer": "ABC", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：系统电压是由系统的潮流分布决定的,影响系统电压的主要因素有：由于生产、生活、气象等因素引起的负荷变化；无功补偿容量的变化；系统运行方式的改变引起的功率分布和网络阻抗变化。"}, {"category": "配电网概述", "type": "多选题", "question": "常用的潮流计算方法有(  )。", "options": [{"label": "A", "text": "牛顿－拉夫逊法"}, {"label": "B", "text": "快速分解法"}, {"label": "C", "text": "最优因子法"}, {"label": "D", "text": "隐式积分法"}], "answer": "AB", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：第69题“常用的潮流计算方法有：牛顿－拉夫逊法及快速分解法”"}, {"category": "配电网概述", "type": "多选题", "question": "电力系统安全稳定计算分析的目的有(　)。", "options": [{"label": "A", "text": "对电力系统进行详细的仿真计算和分析研究"}, {"label": "B", "text": "确定系统稳定问题的主要特征和稳定水平"}, {"label": "C", "text": "提出提高系统稳定水平的措施和保证系统安全稳定运行的控制策略"}, {"label": "D", "text": "指导电网规划、设计、建设、生产运行以及科研、试验中的相关工作"}], "answer": "ABCD", "analysis": "出自《电力系统安全稳定计算技术规范》：电力系统安全稳定计算的目的是通过对电力系统进行详细的仿真计算和分析研究,确定系统稳定问题的主要特征和稳定水平,提出提高系统稳定水平的措施和保证系统安全稳定运行的控制策略,用以指导电网规划、设计、建设、生产运行以及科研、试验中的相关工作。"}, {"category": "配电网概述", "type": "多选题", "question": "根据电网结构和故障性质不同,电力系统发生大扰动时的安全稳定标准分为(  )。", "options": [{"label": "A", "text": "保持稳定运行和电网的正常供电"}, {"label": "B", "text": "保持稳定运行,但允许损失部分负荷"}, {"label": "C", "text": "当系统不能保持稳定运行时,必须防止系统崩溃,并尽量减少负荷损失"}, {"label": "D", "text": "不允许损失负荷"}], "answer": "ABC", "analysis": "出自《DL755-2001电力系统安全稳定导则》：电力系统承受大扰动能力的安全稳定标准分为三级。第一级标准：保持稳定运行和电网的正常供电；第二级标准：保持稳定运行,但允许损失部分负荷；第三级标准：当系统不能保持稳定运行时,必须防止系统崩溃并尽量减少负荷损失。"}, {"category": "配电网概述", "type": "多选题", "question": "电力系统发生短路时,下列哪些量是突变的？(  )", "options": [{"label": "A", "text": "电流值"}, {"label": "B", "text": "电压值"}, {"label": "C", "text": "相位角"}, {"label": "D", "text": "频率"}], "answer": "AB", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：短路时电流、电压值是突变的。"}, {"category": "配电网概述", "type": "判断题", "question": "电力系统是由发电厂的动力部分以及发电、输电、变电、配电、用电组成的整体。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第一节：动力系统是由发电厂的动力部分（如火力发电的锅炉、汽轮机，水力发电的水轮机和水库，核力发电的核反应堆和汽轮机等）以及发电、输电、变电、配电、用电组成的整体。"}, {"category": "配电网概述", "type": "判断题", "question": "配电网是从电源侧（输电网、发电设施、分布式电源等）接受电能，并通过配电设施就地或逐级分配给各类用户的电力网络，对应电压等级一般为35kV及以下。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第一节：配电网是从电源侧（输电网、发电设施、分布式电源等）接受电能，并通过配电设施就地或逐级分配给各类用户的电力网络，对应电压等级一般为110kV及以下。"}, {"category": "配电网概述", "type": "判断题", "question": "配电网涉及高压配电线路和变电站、中压配电线路和配电变压器、低压配电线路、用户和分布式电源等四个紧密关联的层次。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第一节：配电网涉及高压配电线路和变电站、中压配电线路和配电变压器、低压配电线路、用户和分布式电源等四个紧密关联的层次。"}, {"category": "配电网概述", "type": "判断题", "question": "对配电网的基本要求主要是供电的连续性、可靠性、合格的电能质量和运行的经济性等。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第一节：对配电网的基本要求主要是供电的连续性、可靠性、合格的电能质量和运行的经济性等。"}, {"category": "配电网概述", "type": "判断题", "question": "配电网涉及高压配电线路和变电站、中压配电线路和配电变压器、低压配电线路等三个紧密关联的层次。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误 answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第三节：和外事活动中心属于一级负荷。"}, {"category": "配电网概述", "type": "判断题", "question": "35千伏及以上供电电压正、负偏差的绝对值之和不超过标称电压的7%。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配网调控监控人员培训手册》第一章第四节： 35千伏及以上供电电压正、负偏差的绝对值之和不超过标称电压的10%。"}, {"category": "配电网概述", "type": "判断题", "question": "10千伏及以下三相供电电压允许偏差为标称电压的±7%。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配网调控监控人员培训手册》第一章第四节：10千伏及以下三相供电电压允许偏差为标称电压的±7%。"}, {"category": "配电网概述", "type": "判断题", "question": "衡量电能质量的指标通常是电压、电流和频率。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第四节：衡量电能质量的指标通常是电压、频率和波形，在配电网中电压和波形显得尤为重要。"}, {"category": "配电网概述", "type": "判断题", "question": "220伏单相供电电压允许偏差为标称电压的+7%～-7%。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第四节：220伏单相供电电压允许偏差为标称电压的+7%～-10%。"}, {"category": "配电网概述", "type": "判断题", "question": "三相电压和三相电流的波形应该是对称的正弦波形。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第四节：三相电压和三相电流的波形应该是对称的正弦波形。"}, {"category": "配电网概述", "type": "判断题", "question": "我国频率的额定值是50Hz，频率的偏差一般允许值为±0.1Hz。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第四节：我国频率的额定值是50Hz，频率的偏差一般允许值为±0.2Hz。"}, {"category": "配电网概述", "type": "判断题", "question": "配电网应具有必备的容量裕度、适当的负荷转移能力、一定的自愈能力和应急处理能力、合理的分布式电源接纳能力。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第四节：配电网应安全、可靠、经济地向用户供电，具有必备的容量裕度、适当的负荷转移能力、一定的自愈能力和应急处理能力、合理的分布式电源接纳能力。"}, {"category": "配电网概述", "type": "判断题", "question": "配电网规划要保证网络中主要节点满足电压损失及其分配要求。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第四节：配电网规划要保证网络中各节点满足电压损失及其分配要求。"}, {"category": "配电网概述", "type": "判断题", "question": "对供电点短路容量较大、供电距离较长以及对供电电压偏差有特殊要求的用户，由供、用电双方协议确定。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第四节：对供电点短路容量较小、供电距离较长以及对供电电压偏差有特殊要求的用户，由供、用电双方协议确定。"}, {"category": "配电网概述", "type": "判断题", "question": "合理的电网结构是满足电网安全可靠、提高运行灵活性、降低网络损耗的基础。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第五节：合理的电网结构是满足电网安全可靠、提高运行灵活性、降低网络损耗的基础。"}, {"category": "配电网概述", "type": "判断题", "question": "配电网环网结构是指电源点（变电所）引出的馈线连接成环形，每个用电点自环上不同部位接出。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第五节：配电网环网结构是指电源点（变电所）引出的馈线连接成环形，每个用电点自环上不同部位接出。"}, {"category": "配电网概述", "type": "判断题", "question": "链式结构由两个电源（变电所）的馈线供电，中间T接和Π接链式接线。运行灵活性、可靠性好，适用于负荷密度较大的地区。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第五节：链式结构由两个电源（变电所）的馈线供电，中间T接和Π接链式接线。运行灵活性、可靠性好，适用于负荷密度较大的地区。"}, {"category": "配电网概述", "type": "判断题", "question": "放射式低压网络具有配电线故障互不影响，供电可靠性较高，配电设备集中，检修比较方便，系统灵活性较好等优点。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第五节：放射式低压网络由配电变压器低压侧引出多条独立线路供给各个独立的用电设备或集中负荷群的接线方式，称为放射式接线，该接线方式具有配电线故障互不影响，供电可靠性较高，配电设备集中，检修比较方便的优点，但系统灵活性较差，导线金属耗材较多。"}, {"category": "配电网概述", "type": "判断题", "question": "低压配电网网络结构主要有开式低压网络和闭式低压网络。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第五节：低压配电网网络结构主要有开式低压网络和闭式低压网络。"}, {"category": "配电网概述", "type": "判断题", "question": "采用多分段单联络接线模式，中压架空配电网正常运行时线路开环运行，每条线路最大负荷只能达到线路最大载流量的67%。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第五节：多分段单联络接线模式。这种接线方式是架空环网最基本的接线模式，如图1.20所示单条线路合理分段，相邻线路“手拉手”，结构简单清晰，运行较为灵活，可靠性较高，在每段主干线通常可分为2～3段，线路故障或电源故障时，在线路负荷允许的情况下，通过倒闸操作可使非故障段恢复供电。正常运行时线路开环运行，每条线路最大负荷只能达到线路最大载流量的50%，线路投资较辐射状结构有所增加。"}, {"category": "配电网概述", "type": "判断题", "question": "高压配电网结构主要有链式、环网和辐射状结构。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第五节：高压配电网结构主要有：链式、环网和辐射状结构。"}, {"category": "配电网概述", "type": "判断题", "question": "消弧线圈的补偿方式分为过补偿、欠补偿和全补偿，一般采用过补偿的方式。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第六节：消弧线圈的补偿方式分为过补偿、欠补偿和全补偿，一般采用过补偿的方式。过补偿是指感性电流大于容性电流时的补偿方式；欠补偿是指感性电流小于容性电流的补偿方式；全补偿是指感性电流等于容性电流的补偿方式。"}, {"category": "配电网概述", "type": "判断题", "question": "中性点经小电阻系统过电压水平低，可采用绝缘水平较低的电缆和设备。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第六节：中性点经小电阻系统过电压水平低，可采用绝缘水平较低的电缆和设备。"}, {"category": "配电网概述", "type": "判断题", "question": "过补偿是指感性电流小于容性电流时的补偿方式。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第六节：过补偿是指感性电流大于容性电流时的补偿方式。"}, {"category": "配电网概述", "type": "判断题", "question": "中性点直接接地方式供电可靠性低，因为系统发生单相接地时会构成短路，此时短路电流很大，为防止损坏设备，必须迅速切除接地相甚至三相。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第六节：中性点直接接地方式供电可靠性低，因为系统发生单相接地时会构成短路，此时短路电流很大，为防止损坏设备，必须迅速切除接地相甚至三相。"}, {"category": "配电网概述", "type": "判断题", "question": "中性点不接地系统供电可靠性高，对绝缘水平的要求相对较高。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第六节：中性点不接地系统供电可靠性高，但对绝缘水平的要求也高。"}, {"category": "配电网概述", "type": "判断题", "question": "在6～35kV电压等级主要由电缆线路构成的配电系统，单相接地故障电容电流较大时，可采用低电阻接地方式，电阻阻值一般在10～50Ω。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《配电网调控人员培训手册》第一章第六节：在6～35kV电压等级主要由电缆线路构成的配电系统，单相接地故障电容电流较大时，可采用低电阻接地方式，电阻阻值一般在10～20Ω。"}, {"category": "配电网概述", "type": "判断题", "question": "低压配电网主要采用TN、TT和IT接地方式。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第六节：低压配电网主要采用TN、TT和IT接地方式。"}, {"category": "配电网概述", "type": "判断题", "question": "中性点不接地系统对设备绝缘水平要求高。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《配电网调控人员培训手册》第一章第六节：中性点不接地系统对设备绝缘水平要求高，不宜用于110kV及以上电网。"}, {"category": "配电网概述", "type": "判断题", "question": "只有发生接地故障或非全相运行时,零序电流才会出现。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：不对称运行,可能会出现零序电流,非全相运行是不对称运行的特殊情况。"}, {"category": "配电网概述", "type": "判断题", "question": "N-1原则是指正常运行方式下的电力系统中任一元件(如线路、发电机、变压器等)无故障或因故障断开,电力系统应能保持稳定运行和正常供电,其他元件不过负荷,电压和频率均在允许范围内。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《电力系统安全稳定计算技术规范》3.8“正常运行方式下的电力系统中任一元件(如线路、发电机、变压器等)无故障或因故障断开,电力系统应能保持稳定运行和正常供电,其他元件不过负荷,电压和频率均在允许范围内。这通常称为N-1原则”。"}, {"category": "配电网概述", "type": "判断题", "question": "电力系统的电压特性与电力系统的频率特性都与网络结构(网络阻抗)关系不大。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：电力系统各节点的电压通常情况下是不完全相同的,主要取决于各区的有功和无功供需平衡情况,且与网络结构(网络阻抗)有较大关系。"}, {"category": "配电网概述", "type": "判断题", "question": "系统振荡时,随着离振荡中心距离的增加,电压波动逐渐减少。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：电压振荡最激烈的地方是系统振荡中心,每一周期约降低至零值一次。随着振荡中心距离的增加,电压波动逐渐减少"}, {"category": "配电网概述", "type": "判断题", "question": "X0/X1≤4～5的系统属于小电流接地系统(X0为系统零序电抗 ,X1为系统正序电抗)。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：划分标准在我国为：X0/X1X0/X1≤4～5的系统属于大电流接地系统"}, {"category": "配电网概述", "type": "判断题", "question": "电力系统的不对称运行是指三相非全相运行。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：任何原因引起的电力系统三相对称(正常运行状况)性的破坏均称为不对称运行"}, {"category": "配电网概述", "type": "判断题", "question": "对称的三相电路中,流过不同相序的电流时,所遇到的阻抗是相同的。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "出自《电网调度运行实用技术问答（第二版）》第二章：对称的三相电路中,流过不同相序的电流时,所遇到的阻抗是不同的,然而同一相序的电压和电流间,仍符合欧姆定律"}, {"category": "配电网概述", "type": "简答题", "question": "动力系统和电力系统如何定义？", "options": [], "answer": "动力系统是指由发电厂的动力部分（如火力发电的锅炉、汽轮机，水力发电的水轮机和水库，核力发电的核反应堆和汽轮机等）以及发电、输电、变电、配电、用电组成的整体。\n电力系统是指由发电、输电、变电、配电和用电等环节组成的整体，它是动力系统的一部分。", "analysis": "出自《配网调控监控人员培训手册》第一章：动力系统是指由发电厂的动力部分（如火力发电的锅炉、汽轮机，水力发电的水轮机和水库，核力发电的核反应堆和汽轮机等）以及发电、输电、变电、配电、用电组成的整体。\n电力系统是指由发电、输电、变电、配电和用电等环节组成的整体，它是动力系统的一部分。"}, {"category": "配电网概述", "type": "简答题", "question": "什么是电力网？输电网和配电网如何划分？", "options": [], "answer": "电力网是指电力系统中输送、变换和分配电能的部分，它包括升、降压变压器和各种电压等级的输电线路，它是电力系统的一部分。电力网按其在电力系统的作用不同分为输电网和配电网。输电网是指以输电线路将发电厂、变电站连接起来的输电网络，是电力网中的主干网络。配电网是指从电源侧（输电网、发电设施、分布式电源等）接受电能，并通过配电设施就地或逐级分配给各类用户的电力网络。", "analysis": "出自《配网调控监控人员培训手册》第一章:电力网是指电力系统中输送、变换和分配电能的部分，它包括升、降压变压器和各种电压等级的输电线路，它是电力系统的一部分。电力网按其在电力系统的作用不同分为输电网和配电网。输电网是指以输电线路将发电厂、变电站连接起来的输电网络，是电力网中的主干网络。配电网是指从电源侧（输电网、发电设施、分布式电源等）接受电能，并通过配电设施就地或逐级分配给各类用户的电力网络。"}, {"category": "配电网概述", "type": "简答题", "question": "配电网如何分类？", "options": [], "answer": "配电网按电压等级的不同，可分为高压配电网（110千伏、66千伏、35千伏）、中压配电网（20千伏、10千伏、6千伏）和低压配电网（380/220伏）；按供电地域特点不同或服务对象不同，可分为城市配电网和农村配电网；按配电线路的不同，可分为架空配电网、电缆配电网以及架空电缆混合配电网。", "analysis": "出自《配网调控监控人员培训手册》第一章:配电网按电压等级的不同，可分为高压配电网（110千伏、66千伏、35千伏）、中压配电网（20千伏、10千伏、6千伏）和低压配电网（380/220伏）；按供电地域特点不同或服务对象不同，可分为城市配电网和农村配电网；按配电线路的不同，可分为架空配电网、电缆配电网以及架空电缆混合配电网。"}, {"category": "配电网概述", "type": "简答题", "question": "什么是高压配电网？有何功能特点？", "options": [], "answer": "高压配电网是指由高压配电线路和相应等级的配电变电站组成的向用户提供电能的配电网。其功能是从上一级电源接受电能后，直接向高压用户供电，或通过变压器为下一级中压配电网提供电源。高压配电网具有容量大、负荷重、负荷节点少、供电可靠性要求高等特点。", "analysis": "出自《配网调控监控人员培训手册》第一章:高压配电网是指由高压配电线路和相应等级的配电变电站组成的向用户提供电能的配电网。其功能是从上一级电源接受电能后，直接向高压用户供电，或通过变压器为下一级中压配电网提供电源。高压配电网具有容量大、负荷重、负荷节点少、供电可靠性要求高等特点。"}, {"category": "配电网概述", "type": "简答题", "question": "什么是中压配电网？有何功能特点？", "options": [], "answer": "中压配电网是指由中压配电线路和配电变电站组成的向用户提供电能的配电网。其功能是从电源侧（输电网、高压配电网或分布式电源）接受电能，向中压用户供电，或通过配电变压器为下一级低压配电网提供电源。中压配电网具有供电面广、容量大、配电点多等特点。", "analysis": "出自《配网调控监控人员培训手册》第一章:中压配电网是指由中压配电线路和配电变电站组成的向用户提供电能的配电网。其功能是从电源侧（输电网、高压配电网或分布式电源）接受电能，向中压用户供电，或通过配电变压器为下一级低压配电网提供电源。中压配电网具有供电面广、容量大、配电点多等特点。"}, {"category": "配电网概述", "type": "简答题", "question": "什么是低压配电网？有何功能特点？", "options": [], "answer": "低压配电网是指由低压配电线路及其附属电气设备组成的向用户提供电能的配电网。其功能主要是以中压配电网的配电变压器为电源，将电能通过低压配电线路直接送给用户。低压配电网具有供电距离较近，电源点较多，供电容量不大，但分布面广等特点。", "analysis": "出自《配网调控监控人员培训手册》第一章:低压配电网是指由低压配电线路及其附属电气设备组成的向用户提供电能的配电网。其功能主要是以中压配电网的配电变压器为电源，将电能通过低压配电线路直接送给用户。低压配电网具有供电距离较近，电源点较多，供电容量不大，但分布面广等特点。"}, {"category": "配电网概述", "type": "简答题", "question": "配电网有哪些特点？", "options": [], "answer": "（1）供电线路长，分布面积广。\n（2）发展速度快，用户对供电质量要求高。\n（3）对经济发展较好地区配电网设计标准要求高，供电可靠性要求较高。\n（4）农网负荷季节性强。\n（5）接线较复杂，必须保证调度灵活性、运行供电连续性和经济性。\n（6）随着配电网自动化水平的提高，对供电管理水平的要求越来越高。\n（7）随着分布式电源、储能、增量配网及微电网的接入，配电网由传统的无源网向有源网转变，配电网物理形态及运行特性发生重大变化。", "analysis": "出自《配网调控监控人员培训手册》第一章:\n1.供电线路长，分布面积广。\n2.发展速度快，用户对供电质量要求高。\n3.对经济发展较好地区配电网设计标准要求高，供电的可靠性要求较高。\n4.农网负荷季节性强。\n5.配电网接线较复杂，必须保证调度上的灵活性、运行上的供电连续性和经济性。\n6.随着配电网自动化水平的提高，对供电管理水平的要求越来越高。\n7.随着分布式电源、储能、增量配网及微电网的接入，配电网由传统的无源网向有源网转变，配电网物理形态及运行特性发生重大变化。"}, {"category": "配电网概述", "type": "简答题", "question": "电力负荷一般根据什么条件分类？可分为几级？", "options": [], "answer": "把电力负荷与供电可靠性的要求相结合，以及中断供电后将会对政治、经济及社会生活所造成损失或影响的程度进行区分，分为一级负荷、二级负荷、三级负荷等三类。", "analysis": "出自《配网调控监控人员培训手册》第一章:把电力负荷与供电可靠性的要求相结合，以及中断供电后将会对政治、经济及社会生活所造成损失或影响的程度进行区分，分为一级负荷、二级负荷、三级负荷等三类。"}, {"category": "配电网概述", "type": "简答题", "question": "什么是配电网一级、二级、三级负荷？", "options": [], "answer": "一级负荷是指突然停电将会造成人身伤亡，在经济上造成重大损失，在政治上造成重大不良影响、公共秩序严重混乱，或环境严重污染的这类负荷。如重要交通和通信枢纽用电负荷、重点企业中的重大设备和连续生产线、政治和外事活动中心等。\n二级负荷是指突然停电将在经济上造成较大损失、在政治上造成不良影响，或公共秩序混乱的这类负荷。如突然停电将造成主要设备损坏、大量产品报废、造成环境污染、大量减产的工厂用电负荷，交通和通信枢纽用电负荷，大量人员集中的公共场所等。\n三级负荷是指不属于一级和二级的其他用电负荷。如附属企业、附属车间和某些非生产性场所中不重要的用电负荷等。", "analysis": "出自《配网调控监控人员培训手册》第一章:一级负荷是指突然停电将会造成人身伤亡，在经济上造成重大损失，在政治上造成重大不良影响、公共秩序严重混乱，或环境严重污染的这类负荷。如重要交通和通信枢纽用电负荷、重点企业中的重大设备和连续生产线、政治和外事活动中心等。\n二级负荷是指突然停电将在经济上造成较大损失、在政治上造成不良影响，或公共秩序混乱的这类负荷。如突然停电将造成主要设备损坏、大量产品报废、造成环境污染、大量减产的工厂用电负荷，交通和通信枢纽用电负荷，大量人员集中的公共场所等。\n三级负荷是指不属于一级和二级的其他用电负荷。如附属企业、附属车间和某些非生产性场所中不重要的用电负荷等。"}, {"category": "配电网概述", "type": "简答题", "question": "配电网一级、二级、三级负荷的一般供电要求有哪些？", "options": [], "answer": "一级负荷应由两路电源供电。供同一用户的两路电源不应该是同杆双回路架设，也不能出自同一电源的同一条母线，当其中一路电源中断供电时，另一路电源应该能满足全部负荷的供电需要。一级负荷中的特别重要负荷必须增设自备应急电源，也可以由第三路电源供电作为备用电源。所有装设自备应急电源的用户，供电部门都应该有详细的记录。\n二级负荷宜由两路电源供电，当其中一路电源中断供电时，另一路电源应该能满足全部或部分负荷的供电需要。用户也可以增设自备应急电源或其他应急措施。所有装设自备应急电源的用户，供电部门都应该有详细的记录。\n三级负荷一般只有一路电源供电，视需要可以自备应急电源。所有装设自备应急电源的用户，供电部门都应该有详细的记录。", "analysis": "出自《配网调控监控人员培训手册》第一章:一级负荷应由两路电源供电。供同一用户的两路电源不应该是同杆双回路架设，也不能出自同一电源的同一条母线，当其中一路电源中断供电时，另一路电源应该能满足全部负荷的供电需要。一级负荷中的特别重要负荷必须增设自备应急电源，也可以由第三路电源供电作为备用电源。所有装设自备应急电源的用户，供电部门都应该有详细的记录。\n二级负荷宜由两路电源供电，当其中一路电源中断供电时，另一路电源应该能满足全部或部分负荷的供电需要。用户也可以增设自备应急电源或其他应急措施。所有装设自备应急电源的用户，供电部门都应该有详细的记录。\n三级负荷一般只有一路电源供电，视需要可以自备应急电源。所有装设自备应急电源的用户，供电部门都应该有详细的记录。"}, {"category": "配电网概述", "type": "简答题", "question": "配电网的基本要求有哪些？", "options": [], "answer": "配电网的基本要求主要是供电的连续性、可靠性、合格的电能质量和运行的经济性等。配电网应具有必备的容量裕度、适当的负荷转移能力、一定的自愈能力和应急处理能力以及合理的分布式电源接纳能力。", "analysis": "出自《配网调控监控人员培训手册》第一章: 配电网的基本要求主要是供电的连续性、可靠性、合格的电能质量和运行的经济性等。配电网应具有必备的容量裕度、适当的负荷转移能力、一定的自愈能力和应急处理能力以及合理的分布式电源接纳能力。"}, {"category": "配电网概述", "type": "简答题", "question": "配电网的安全技术要求有哪些？", "options": [], "answer": "（1）保证持续供电。\n（2）及时发现配电网的非正常运行情况和设备存在的缺陷情况。\n（3）迅速隔离故障、最大限度地缩小停电范围，满足灵活供电需要。", "analysis": "出自《配网调控监控人员培训手册》第一章:（1）保证持续供电。\n（2）及时发现配电网的非正常运行情况和设备存在的缺陷情况。\n（3）迅速隔离故障、最大限度地缩小停电范围，满足灵活供电需要。"}, {"category": "配电网概述", "type": "简答题", "question": "衡量电能质量的标准主要有哪些？", "options": [], "answer": "衡量电能质量的指标通常是电压、频率和波形，在配电网中电压和波形显得尤为重要。", "analysis": "出自《配网调控监控人员培训手册》第一章:衡量电能质量的指标通常是电压、频率和波形，在配电网中电压和波形显得尤为重要。"}, {"category": "配电网概述", "type": "简答题", "question": "110千伏、35千伏、10千伏、220伏电压等级的供电电压允许偏差值分别是多少？", "options": [], "answer": "（1）35～110kV供电电压正负偏差的绝对值之和不超过标称电压的10%。\n（2）10kV及以下三相供电电压允许偏差为标称电压的±7%。\n（3）220V单相供电电压允许偏差为标称电压的+7％与-10%。\n（4）对供电点短路容量较小、供电距离较长以及对供电电压偏差有特殊要求的用户，由供、用电双方协议确定。", "analysis": "出自《配网调控监控人员培训手册》第一章: （1）110～35kV供电电压正负偏差的绝对值之和不超过标称电压的10%。\n（2）10kV及以下三相供电电压允许偏差为标称电压的±7%。\n（3）220V单相供电电压允许偏差为标称电压的+7％与-10%。\n（4）对供电点短路容量较小、供电距离较长以及对供电电压偏差有特殊要求的用户，由供、用电双方协议确定。"}, {"category": "配电网概述", "type": "简答题", "question": "配电网经济运行要求有哪些？", "options": [], "answer": "（1）根据负荷变化情况改变配电网络的供电方式。\n（2）根据负荷变化情况改变变压器的运行方式，使之处于经济运行状态。\n（3）降低变压器的铁芯损耗，使用节能型的变压器。\n（4）结合工程改变供电路径，使用节能设备、器材，避免迂回供电。", "analysis": "出自《配网调控监控人员培训手册》第一章:（1）根据负荷变化情况改变配电网络的供电方式。\n（2）根据负荷变化情况改变变压器的运行方式，使之处于经济运行状态。\n（3）降低变压器的铁芯损耗，使用节能型的变压器。\n（4）结合工程改变供电路径，使用节能设备、器材，避免迂回供电。"}, {"category": "配电网概述", "type": "简答题", "question": "中性点直接接地方式优缺点有哪些？", "options": [], "answer": "缺点：中性点直接接地系统供电可靠性低，因为系统发生单相接地时，构成短路回路，短路电流很大，为防止损坏设备，必须迅速切除故障；同时，巨大的接地短路电流产生较强的单相磁场干扰邻近通信线路。优点：系统过电压较低，减少设备绝缘投资，降低设备造价。", "analysis": "出自《配网调控监控人员培训手册》第一章:缺点：中性点直接接地系统供电可靠性低，因为系统发生单相接地时，构成短路回路，短路电流很大，为防止损坏设备，必须迅速切除故障；同时，巨大的接地短路电流产生较强的单相磁场干扰邻近通信线路。优点：系统过电压较低，减少设备绝缘投资，降低设备造价。"}, {"category": "配电网概述", "type": "简答题", "question": "消弧线圈接地系统补偿方式有哪些？一般采用什么补偿方式？", "options": [], "answer": "消弧线圈的补偿方式分为过补偿、欠补偿和全补偿，一般采用过补偿的方式。", "analysis": "出自《配网调控监控人员培训手册》第一章:消弧线圈的补偿方式分为过补偿、欠补偿和全补偿，一般采用过补偿的方式。"}, {"category": "配电网概述", "type": "简答题", "question": "低压配电网接地方式有哪些？各种接地方式如何定义？", "options": [], "answer": "低压配电网主要采用TN、TT和IT接地方式，其中TN接地方式可以分为TN-C-S、TN-C、TN-S。（1）TN系统指电源端有一点直接接地(通常是中性点），电气装置的外露可导电部分通过保护中性导体或保护导体连接到此接地点。\n根据中性导体（N）和保护导体（PE）的组合情况，TN系统的有三种型式：\na．TN-S系统：整个系统的N线和PE线是分开的。\nb．TN-C系统：整个系统的N线和PE线是合一的（PEN线）。\nc．TN-C-S系统：系统中一部分线路的N线和PE线是合一的。\n（2）TT系统指电源端有一点直接接地，电气装置的外露可导电部分直接接地，此接地点在电气上独立于电源端的接地点。\n（3）IT系统指电源端的带电部分不接地或有一点通过阻抗接地，电气装置的外露可导电部分直接接地。", "analysis": "出自《配网调控监控人员培训手册》第一章:低压配电网主要采用TN、TT和IT接地方式，其中TN接地方式可以分为TN-C-S、TN-C、TN-S。（1）TN系统指电源端有一点直接接地(通常是中性点），电气装置的外露可导电部分通过保护中性导体或保护导体连接到此接地点。\n根据中性导体（N）和保护导体（PE）的组合情况，TN系统的有三种型式：\na．TN-S系统：整个系统的N线和PE线是分开的。\nb．TN-C系统：整个系统的N线和PE线是合一的（PEN线）。\nc．TN-C-S系统：系统中一部分线路的N线和PE线是合一的。\n（2）TT系统指电源端有一点直接接地，电气装置的外露可导电部分直接接地，此接地点在电气上独立于电源端的接地点。\n（3）IT系统指电源端的带电部分不接地或有一点通过阻抗接地，电气装置的外露可导电部分直接接地。"}, {"category": "配电网概述", "type": "简答题", "question": "什么是配电网电力用户的双电源？", "options": [], "answer": "配电网电力用户的双电源是指分别来自两个不同的上级变电站，或来自不同电源进线的同一上级变电站内两段母线，为同一电力用户供电的两路供电电源。", "analysis": "出自《配网调控监控人员培训手册》第一章:配电网电力用户的双电源是指分别来自两个不同的上级变电站，或来自不同电源进线的同一上级变电站内两段母线，为同一电力用户供电的两路供电电源。"}, {"category": "配电网概述", "type": "简答题", "question": "高压配电网结构主要有哪些？", "options": [], "answer": "高压配电网结构主要有：链式、环网和辐射状结构。", "analysis": "出自《配网调控监控人员培训手册》第一章:高压配电网结构主要有：链式、环网和辐射状结构。"}, {"category": "配电网概述", "type": "简答题", "question": "中压配电网架空线路接线形式主要有哪些？中压配电网电缆线路接线形式主要有哪些？", "options": [], "answer": "中压配电网架空线路接线形式主要有多分段适度联络、多分段单联络和多分段单辐射。中压配电网电缆线路接线形式主要有双环式和单环式。", "analysis": "出自《配网调控监控人员培训手册》第一章:中压配电网架空线路接线形式主要有多分段适度联络、多分段单联络和多分段单辐射。中压配电网电缆线路接线形式主要有双环式和单环式。"}, {"category": "配电网概述", "type": "简答题", "question": "中压配电网多分段单辐射接线特点有哪些？有何优缺点？", "options": [], "answer": "多分段单辐射接线是指一路配电线路自配电变电站引出，按照负荷的分布情况，呈辐射延伸出去，线路没有其他可连接的电源，所有用电点的电能只能通过单一的路径供给。辐射状配电网的优点是设施简单，运行维护方便，设备费用低，适用于低负荷密度地区和一般的照明、动力负荷供电。缺点是供电可靠性低。", "analysis": "出自《配网调控监控人员培训手册》第一章:多分段单辐射接线是指一路配电线路自配电变电站引出，按照负荷的分布情况，呈辐射延伸出去，线路没有其他可连接的电源，所有用电点的电能只能通过单一的路径供给。辐射状配电网的优点是设施简单，运行维护方便，设备费用低，适用于低负荷密度地区和一般的照明、动力负荷供电。缺点是供电可靠性低。"}, {"category": "配电网概述", "type": "简答题", "question": "开式低压配电网典型接线方式有哪些？有何优缺点？", "options": [], "answer": "开式低压网络由单侧电源采用放射式、干线式或链式供电，它的优点是投资小，接线简单，安装维护方便，但缺点是电能损耗大、电压低、供电可靠性差以及适应负荷发展较困难。", "analysis": "出自《配网调控监控人员培训手册》第一章: 开式低压网络由单侧电源采用放射式、干线式或链式供电，它的优点是投资小，接线简单，安装维护方便，但缺点是电能损耗大、电压低、供电可靠性差以及适应负荷发展较困难。"}, {"category": "配电网概述", "type": "简答题", "question": "放射式低压网络有哪些适用场合？", "options": [], "answer": "（1）单台设备容量较大，负荷集中或重要的用电设备；\n（2）设备容量不大，并且位于配电变压器不同方向；\n（3）负荷配置较稳定；\n（4）负荷排列不整齐。", "analysis": "出自《配网调控监控人员培训手册》第一章:（1）单台设备容量较大，负荷集中或重要的用电设备；\n（2）设备容量不大，并且位于配电变压器不同方向；\n（3）负荷配置较稳定；\n（4）负荷排列不整齐。"}, {"category": "配电网概述", "type": "简答题", "question": "干线式低压网络接线方式有哪些？分别有何特点？", "options": [], "answer": "干线式低压网络接线方式有干线式低压配电网、变压器—干线配电网、备用柴油发电机组三种。\n（1）干线式低压配电网：该接线方式不必在变电站低压侧设置低压配电盘，而是直接从低压引出线经低压断路器和负荷开关引接，减少了电气设备的数量。配电设备及导线金属耗材消耗较少，系统灵活性好，但干线故障时影响范围大。\n（2）变压器—干线配电网：主干线由配电变压器引出，沿线敷设，再由主干线引出干线对用电设备供电。这种网络比一般于线式配电网所需配电设备更少，从而使变电站结构大为简化，投资大为降低。\n（3）备用柴油发电机组：该接线方式以10kV专用架空线路为主电源，快速自启动型柴油发电机组做备用电源。", "analysis": "出自《配网调控监控人员培训手册》第一章: 干线式低压网络接线方式有干线式低压配电网、变压器—干线配电网、备用柴油发电机组三种。\n（1）干线式低压配电网：该接线方式不必在变电站低压侧设置低压配电盘，而是直接从低压引出线经低压断路器和负荷开关引接，减少了电气设备的数量。配电设备及导线金属耗材消耗较少，系统灵活性好，但干线故障时影响范围大。\n（2）变压器—干线配电网：主干线由配电变压器引出，沿线敷设，再由主干线引出干线对用电设备供电。这种网络比一般于线式配电网所需配电设备更少，从而使变电站结构大为简化，投资大为降低。\n（3）备用柴油发电机组：该接线方式以10kV专用架空线路为主电源，快速自启动型柴油发电机组做备用电源。"}, {"category": "配电网概述", "type": "简答题", "question": "闭式低压网络接线方式有哪些？", "options": [], "answer": "闭式低压网络接线方式包括三角形、星形、多边形及其他混合形等。", "analysis": "出自《配网调控监控人员培训手册》第一章: 闭式低压网络接线方式包括三角形、星形、多边形及其他混合形等。"}, {"category": "配电网概述", "type": "简答题", "question": "简单闭式低压网络接线有何特点？", "options": [], "answer": "简单闭式接线的主要特点如下:\n（1）高压侧由多回路供电，电源可靠性较高\n（2）充分利用线路和变压器的容量，不必留出很大备用容量\n（3）在联络干线端和干线中部都装有熔断器。", "analysis": "出自《配网调控监控人员培训手册》第一章:简单闭式接线的主要特点如下:\n（1）高压侧由多回路供电，电源可靠性较高\n（2）充分利用线路和变压器的容量，不必留出很大备用容量\n（3）在联络干线端和干线中部都装有熔断器。\n采用简单闭式接线方式，必须具备以下条件：\n（1）各对应边的阻抗应尽可能相等，以保证熔断器能选择性地断开；\n（2）连在一起的变压器容量比，不宜大于1：2；\n（3）短路电压比，不宜大于10%；\n（4）如从不同的电源引出，还应注意相位和相序关系。"}, {"category": "配电网概述", "type": "简答题", "question": "采用简单闭式低压网络接线方式必须具备的条件有哪些", "options": [], "answer": "（1）各对应边的阻抗应尽可能相等，以保证熔断器能选择性地断开。（2）连在一起的变压器容量比，不宜大于1:2.（3）短路电压比，不宜大于10%。（4）如从不同的电源引出，还应注意相位和相序关系。", "analysis": "出自《配网调控监控人员培训手册》第一章:简单闭式接线的主要特点如下:\n（1）高压侧由多回路供电，电源可靠性较高\n（2）充分利用线路和变压器的容量，不必留出很大备用容量\n（3）在联络干线端和干线中部都装有熔断器。\n采用简单闭式接线方式，必须具备以下条件：\n（1）各对应边的阻抗应尽可能相等，以保证熔断器能选择性地断开；\n（2）连在一起的变压器容量比，不宜大于1：2；\n（3）短路电压比，不宜大于10%；\n（4）如从不同的电源引出，还应注意相位和相序关系。"}, {"category": "配电网规划", "type": "单选题", "question": "《配电网规划设计技术导则》中配电网是指(     )。", "options": [{"label": "A", "text": "从输电网接受电能，并通过配电设施就地或逐级分配给各类用户的电力网络"}, {"label": "B", "text": "从输电网或地区发电厂接受电能，并通过配电设施就地或逐级分配给各类用户的电力网络"}, {"label": "C", "text": "从电源侧（输电网、发电设施、分布式电源等） 技术导则》（Q/GDW 10738-2020）第9章：9.3.2"}, {"category": "配电网规划", "type": "单选题", "question": "A+、A、B类供电区域35kV 架空线路截面不宜小（）mm2。", "options": [{"label": "A", "text": "240"}, {"label": "B", "text": "150"}, {"label": "C", "text": "120"}, {"label": "D", "text": "110"}], "answer": "B", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.3.2"}, {"category": "配电网规划", "type": "单选题", "question": "C、D、E 类供电区域 110kV 架空线路截面不宜小于 （）mm2。", "options": [{"label": "A", "text": "240"}, {"label": "B", "text": "150"}, {"label": "C", "text": "120"}, {"label": "D", "text": "110"}], "answer": "B", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.3.2"}, {"category": "配电网规划", "type": "单选题", "question": "C、D、E 类供电区域66kV、35kV 架空线路截面不宜小于（）mm2。", "options": [{"label": "A", "text": "240"}, {"label": "B", "text": "150"}, {"label": "C", "text": "120"}, {"label": "D", "text": "110"}], "answer": "C", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.3.2"}, {"category": "配电网规划", "type": "单选题", "question": "35～110kV 架空线路导线宜采用（）及新型节能导线，沿海及有腐蚀性地区可选用防腐型导线。", "options": [{"label": "A", "text": "铝包钢绞线"}, {"label": "B", "text": "硬铝线"}, {"label": "C", "text": "铝绞线"}, {"label": "D", "text": "钢芯铝绞线"}], "answer": "D", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.3.4 110～35kV 架空线路导线宜采用钢芯铝绞线及新型节能导线，沿海及有腐蚀性地区可选用防腐型导线。"}, {"category": "配电网规划", "type": "单选题", "question": "以下不属于35～110kV 线路导线截面的选取要求的是：", "options": [{"label": "A", "text": "线路导线截面宜综合饱和负荷状况、线路全寿命周期选定"}, {"label": "B", "text": "线路导线截面应与电网结构、变压器容量和台数相匹配"}, {"label": "C", "text": "线路导线截面应按照允许最大电流选取，并以经济载荷范围校核"}, {"label": "D", "text": "线路导线截面应按照安全电流裕度选取，并以经济载荷范围校核"}], "answer": "C", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.3"}, {"category": "配电网规划", "type": "单选题", "question": "10kV中压架空线路通常为（），沿海高盐雾地区可采用（）。", "options": [{"label": "A", "text": "铝芯、铜绞线"}, {"label": "B", "text": "铜绞线、铝芯"}, {"label": "C", "text": "铜芯、铝绞线"}, {"label": "D", "text": "铝绞线、铜芯"}], "answer": "A", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第9章：9.4"}, {"category": "配电网规划 , "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.1.3 应严格控制专线数量，以节约廊道和间隔资源，提高电网利用效率"}, {"category": "配电网规划", "type": "单选题", "question": "100kVA 及以上的用户，在高峰负荷时的功率因数不宜低于（）。", "options": [{"label": "A", "text": "0.95"}, {"label": "B", "text": "0.9"}, {"label": "C", "text": "0.85"}, {"label": "D", "text": "0.98"}], "answer": "A", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.1.4 受电变压器总容量 100kVA 及以上的用户，在高峰负荷时的功率因数不宜低于 0.95；其他用户和大、中型电力排灌站，功率因数不宜低于 0.90；农业用电功率因数不宜低于 0.85。"}, {"category": "配电网规划", "type": "单选题", "question": "农业用电功率因数不宜低于（）。", "options": [{"label": "A", "text": "0.95"}, {"label": "B", "text": "0.9"}, {"label": "C", "text": "0.85"}, {"label": "D", "text": "0.98"}], "answer": "C", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.1.4 受电变压器总容量 100kVA 及以上的用户，在高峰负荷时的功率因数不宜低于 0.95；其他用户和大、中型电力排灌站，功率因数不宜低于 0.90；农业用电功率因数不宜低于 0.85。"}, {"category": "配电网规划", "type": "单选题", "question": "下列选项不符合用户接入要求的是（）。", "options": [{"label": "A", "text": "重要电力用户供电电源应采用多电源、双电源或双回路供电。"}, {"label": "B", "text": "一级重要电力用户宜采用双电源供电"}, {"label": "C", "text": "二级重要电力用户宜采用双电源供电。"}, {"label": "D", "text": "重要电力用户应自备应急电源"}], "answer": "C", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.1.5 重要电力用户供电电源配置应符合 GB/T 29328 的规定。重要电力用户供电电源应采用多电源、双电源或双回路供电，当任何一路或一路以上电源发生故障时，至少仍有一路电源应能满足保安负荷供电要求。特级重要电力用户应采用多电源供电；一级重要电力用户至少应采用双电源供电；二级重要电力用户至少应采用双回路供电。"}, {"category": "配电网规划", "type": "单选题", "question": "以下说法错误的是（）。", "options": [{"label": "A", "text": "潮流计算分析应根据给定的运行条件和拓扑结构确定网络的运行状态。"}, {"label": "B", "text": "应通过潮流计算分析确定电网短路电流水平，为设备选型等提供支撑。"}, {"label": "C", "text": "110～10kV 电网短路电流计算，应综合考虑上级电源和本地电源接入情况，以及中性点接地方式，计算至变电站 10kV 母线、电源接入点、中性点以及 10kV 线路上的任意节点。"}, {"label": "D", "text": "应通过供电安全水平分析校核电网是否满足供电安全准则。"}], "answer": "B", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第12章：12.2"}, {"category": "配电网规划", "type": "单选题", "question": "供电安全水平分析的目的是（）。", "options": [{"label": "A", "text": "根据给定的运行条件和拓扑结构确定网络的运行状态，是供电能力校核、线损分析、短路电流计算、供电安全水平分析、可靠性计算和无功规划计算的基础"}, {"label": "B", "text": "确定短路电流水平，选择电气设备参数，提出限制短路电流的措施等。"}, {"label": "C", "text": "校核电网是否满足供电安全标准，即模拟低压线路故障、配电变压器故障、中压线路（线段）故障、110～35kV 变压器或线路故障对电网的影响，校验负荷损失程度，检查负荷转移后相关元件是否过负荷，电网电压是否越限。"}, {"label": "D", "text": "确定现状和规划期内配电网的可靠性指标，分析影响供电可靠性的薄弱环节，提出改善供电可靠性指标的规划方案。"}], "answer": "C", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第12章：12.4.2 供电安全水平计算分析的目的是校核电网是否满足供电安全标准，即模拟低压线路故障、配电变压器故障、中压线路（线段）故障、110～35kV 变压器或线路故障对电网的影响，校验负荷损失程度， 检查负荷转移后相关元件是否过负荷，电网电压是否越限。"}, {"category": "配电网规划", "type": "单选题", "question": "在配电网规划设计中，（）应对各备选方案进行技术比较、经济分析和效果评价，评估规划项目在技术、经济上的可行性及合理性，为投资决策提供依据。", "options": [{"label": "A", "text": "技术经济分析"}, {"label": "B", "text": "可靠性计算分析"}, {"label": "C", "text": "无功规划计算分析"}, {"label": "D", "text": "供电安全水平分析"}], "answer": "A", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第13章：13.1 技术经济分析应对各备选方案进行技术比较、经济分析和效果评价，评估规划项目在技术、经济   上的可行性及合理性，为投资决策提供依据。"}, {"category": "配电网规划", "type": "单选题", "question": "电源总容量范围和并网电压等级不相符的是（）。", "options": [{"label": "A", "text": "8kW 及以下，220V"}, {"label": "B", "text": "8kW～400kW，380V"}, {"label": "C", "text": "400kW～6MW，10kV、35KV"}, {"label": "D", "text": "6MW～50MW，35kV、66kV、110kV"}], "answer": "C", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.2"}, {"category": "配电网规划", "type": "单选题", "question": "在满足供电安全及系统调峰的条件下，接入单条线路的电源总容量不应超过线路的（）。", "options": [{"label": "A", "text": "最大容量"}, {"label": "B", "text": "额定容量"}, {"label": "C", "text": "允许容量"}, {"label": "D", "text": "平均容量"}], "answer": "C", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.2.5 在满足供电安全及系统调峰的条件下，接入单条线路的电源总容量不应超过线路的允许容量；   接入本级配电网的电源总容量不应超过上一级变压器的额定容量以及上一级线路的允许容量。"}, {"category": "配电网规划", "type": "单选题", "question": "接入 （）Kv 电网的电动汽车充换电设施，容量小于 4000kVA 宜接入公用电网 10kV 线路或接入环网柜、电缆分支箱、开关站等，容量大于 4000kVA 宜专线接入", "options": [{"label": "A", "text": "10"}, {"label": "B", "text": "35"}, {"label": "C", "text": "110"}, {"label": "D", "text": "66"}], "answer": "A", "analysis": "出自《配电网规划设计技术导则》（Q/GDW 10738-2020）第11章：11.3.5 接入 10kV 电网的电动汽车充换电设施，容量小于 4000kVA 宜接入公用电网 10kV 线路或接入环网柜、电缆分支箱、
