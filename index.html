"配电网继电保护及安自装置", "type": "多选题", "question": "按频率自动减负荷装置，在供电电源中断时，防止由于用户电动机反馈电压而引起的误动作的方法有（   ）。", "options": [{"label": "A", "text": "采用加延时的办法"}, {"label": "B", "text": "采用电流闭锁的方法"}, {"label": "C", "text": "采用电压闭锁的方法"}, {"label": "D", "text": "采用无功闭锁的方法"}], "answer": "ABC", "analysis": "出自《国家电网公司继电保护培训教材》第五章第二节，按频率自动减负荷装置，在供电电源中断时，防止由于用户电动机反馈电压而引起的误动作的方法有采用加延时的办法、采用电流闭锁的方法、采用电压闭锁的方法、滑差闭锁。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "中性点不接地系统中，若电压互感器一次侧保险断一相，有（   ）现象发生。", "options": [{"label": "A", "text": "预告信号铃响"}, {"label": "B", "text": "发出“××母线接地”信号"}, {"label": "C", "text": "绝缘监视表一相电压降低，其他两相电压相等"}, {"label": "D", "text": "与该母线有关的电压、有功、无功功率表读数下降"}], "answer": "ABCD", "analysis": "中性点不接地系统中，若电压互感器一次侧保险断一相，现象如下：预告信号铃响 ，发出“××母线接地”信号，绝缘监视表一相电压降低，其他两相电压相等，与该母线有关的电压、有功、无功功率表读数下降。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "变压器瓦斯保护动作的原因有（   ）。", "options": [{"label": "A", "text": "变压器内部严重故障"}, {"label": "B", "text": "二次回路问题误动作"}, {"label": "C", "text": "某些情况下由于油枕内的胶囊安装不良造成呼吸器堵塞油温发生变化后，呼吸器突然冲开，引起瓦斯保护动作"}, {"label": "D", "text": "变压器附近有较强的震动"}], "answer": "ABCD", "analysis": "变压器瓦斯保护动作的原因有：变压器内部严重故障，二次回路问题误动作，某些情况下由于油枕内的胶囊安装不良造成呼吸器堵塞油温发生变化后，呼吸器突然冲开，引起瓦斯保护动作，变压器附近有较强的震动。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "电压互感器有（   ）种接线方式。", "options": [{"label": "A", "text": "Y，y,d接线"}, {"label": "B", "text": "Y，y接线"}, {"label": "C", "text": "V，v接线"}, {"label": "D", "text": "D，y接线"}], "answer": "ABC", "analysis": "出自Q/GDW424-2010《电子式电流互感器技术规范》4技术参数和性能要求.电压互感器有Y，y,d接线、Y，y接线、V，v接线方式。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "继电保护快速切除故障对电力系统有（    ）好处。", "options": [{"label": "A", "text": "提高电力系统的稳定性"}, {"label": "B", "text": "电压恢复快，电动机容易自启动并迅速恢复正常，从而减少对用户的影响"}, {"label": "C", "text": "减轻电气设备的损坏程度，防止故障进一步扩大"}, {"label": "D", "text": "短路点易于去游离，提高重合闸的成功率"}], "answer": "ABCD", "analysis": "出自《继电保护原理》第二版  中国电力出版社 第一章第一节。继电保护快速切除故障对电力系统有以下好处：提高电力系统的稳定性、电压恢复快，电动机容易自启动并迅速恢复正常，从而减少对用户的影响、减轻电气设备的损坏程度，防止故障进一步扩大、短路点易于去游离，提高重合闸的成功率。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "定时限过电流保护的特点是（   ）。", "options": [{"label": "A", "text": "为了实现过电流保护的动作选择性，各保护的动作时间一般按阶梯原则进行整定；"}, {"label": "B", "text": "相邻保护的动作时间，自负荷向电源方向逐级增大；"}, {"label": "C", "text": "每套保护的动作时间是恒定不变的，与短路电流的大小无关；"}, {"label": "D", "text": "保护范围受系统运行方式变化而变化"}], "answer": "ABCD", "analysis": "出自《继电保护原理》第二版  中国电力出版社 第三章第四节。定时限过电流保护的特点是为了实现过电流保护的动作选择性，各保护的动作时间一般按阶梯原则进行整定；相邻保护的动作时间，自负荷向电源方向逐级增大；每套保护的动作时间是恒定不变的，与短路电流的大小无关；保护范围受系统运行方式变化而变化。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "保护装置应具有在线自动检测功能，包括（    ）的自动检测。", "options": [{"label": "A", "text": "保护硬件损坏"}, {"label": "B", "text": "功能失效"}, {"label": "C", "text": "二次回路异常运行状态"}, {"label": "D", "text": "通信中断"}], "answer": "ABCD", "analysis": "出自《继电保护原理》第二版  中国电力出版社 第一章第二节。保护装置应具有在线自动检测功能，包括保护硬件损坏、功能失效、二次回路异常运行状态。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "电流速断保护的特点是（   ）。", "options": [{"label": "A", "text": "接线简单，动作可靠"}, {"label": "B", "text": "切除故障快，但不能保护线路全长"}, {"label": "C", "text": "保护范围受系统运行方式变化的影响较大"}, {"label": "D", "text": "保护范围受系统中变压器中性点接地数目变化影响较大"}], "answer": "ABC", "analysis": "出自《继电保护原理》第二版  中国电力出版社 第三章第二节。电流速断保护的特点是接线简单，动作可靠；切除故障快，但不能保护线路全长；保护范围受系统运行方式变化的影响较大。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "新安装或二次回路经变动后的变压器差动保护须做（   ）工作后方可正式投运。", "options": [{"label": "A", "text": "应在变压器充电时将差动保护投入运行"}, {"label": "B", "text": "带负荷前将差动保护停用"}, {"label": "C", "text": "带负荷后测量负荷电流相量，正确无误后"}, {"label": "D", "text": "带负荷后测量继电器的差电流，或差电压正确无误后"}], "answer": "ABCD", "analysis": "出自GB/T1094.4-2005《电力变压器（第4部分）：电力变压器和电抗器的雷电冲击和操作冲击试验导则》9.2操作冲击。新安装或二次回路经变动后的变压器差动保护正式投运前应在变压器充电时将差动保护投入运行；带负荷前将差动保护停用；带负荷后测量负荷电流相量，正确无误后；带负荷后测量继电器的差电流，或差电压正确无误后。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "变压器励磁涌流具有（   ）特点。", "options": [{"label": "A", "text": "涌流在初始阶段数值很大，以后逐渐衰减"}, {"label": "B", "text": "包含有大量的高次谐波，并以二次谐波成分最大"}, {"label": "C", "text": "涌流波形之间出现间断"}, {"label": "D", "text": "涌流幅值最大可达6-8倍的额定电流"}], "answer": "ABCD", "analysis": "出自GB/T1094.4-2005《电力变压器（第4部分）：电力变压器和电抗器的雷电冲击和操作冲击试验导则》9.2操作冲击。变压器励磁涌流具有以下特点。涌流在初始阶段数值很大，以后逐渐衰减；包含有大量的高次谐波，并以二次谐波成分最大；涌流波形之间出现间断；涌流幅值最大可达6-8倍的额定电流。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "继电保护装置必须满足的基本要求是（  ）。", "options": [{"label": "A", "text": "选择性"}, {"label": "B", "text": "速动性"}, {"label": "C", "text": "灵敏性"}, {"label": "D", "text": "可靠性"}], "answer": "ABCD", "analysis": "出自GB/T14285-2006《继电保护和安全自动装置技术规程》3.2。继电保护装置必须满足的基本要求是选择性、速动性、灵敏性、可靠性。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "变压器的瓦斯保护，在运行中应注意的问题是（   ）。", "options": [{"label": "A", "text": "气体继电器接线端子处不应渗油"}, {"label": "B", "text": "端子盒应能防止雨、雪和灰尘的侵入"}, {"label": "C", "text": "电源及其二次回路要有防水、防油和防冻的措施"}, {"label": "D", "text": "要在春秋二季进行防水、防油和防冻检查"}], "answer": "ABCD", "analysis": "出自《110千伏及以下变电站运行标准化工作手册》西安电子科技大学出版社  第5章。变压器的瓦斯保护，在运行中应注意的问题是瓦斯继电器接线端子处不应渗油；端子盒应能防止雨、雪和灰尘的侵入的措施；电源及其二次回路要有防水、防油和防冻的措施；要在春秋二季进行防水、防油和防冻检查。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "电气设备的二次回路包括（    ）。", "options": [{"label": "A", "text": "测量、监察回路"}, {"label": "B", "text": "控制、信号回路"}, {"label": "C", "text": "继电保护和自动装置回路"}, {"label": "D", "text": "操作电流回路"}], "answer": "ABCD", "analysis": "出自《电气二次回路应用入门》中国电力出版社 第一章。电气设备的二次回路包括测量、监察回路，控制、信号回路，继电保护和自动装置回路，操作电流回路。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "带时限速断保护的保护范围是（   ）。", "options": [{"label": "A", "text": "本线全长"}, {"label": "B", "text": "下线始端一部分"}, {"label": "C", "text": "下线全长"}, {"label": "D", "text": "本线及下线全长"}], "answer": "AB", "analysis": "出自DL/T584-2007《3kV~110kV电网继电保护装置运行整定规程》6.2.6.3。带时限速断保护的保护范围是本线全长，下线始端一部分。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "对线路单相接地，可利用下列（）电流，构成有选择性的电流保护或功率方向保护。", "options": [{"label": "A", "text": "网络的自然电容电流"}, {"label": "B", "text": "消弧线圈补偿后的残余电流，例如残余电流的有功分量或高次谐波分量"}, {"label": "C", "text": "人工接地电流，但此电流应尽可能小些，不宜大于10～20安"}, {"label": "D", "text": "单相接地故障的暂态电流"}], "answer": "ABCD", "analysis": "出自GB/T14285-2006《继电保护及安全自动装置技术规程》4.4.4。对线路单相接地，可利用网络的自然电容电流，消弧线圈补偿后的残余电流，例如残余电流的有功分量或高次谐波分量，人工接地电流，但此电流应尽可能小些，不宜大于10～20安，单相接地故障的暂态电流，构成有选择性的电流保护或功率方向保护。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "电流互感器应满足（   ）要求。", "options": [{"label": "A", "text": "应满足一次回路的额定电压、最大负荷电流的要求"}, {"label": "B", "text": "应满足短路时的动、热稳定电流的要求"}, {"label": "C", "text": "应满足二次回路测量仪表、自动装置的准确度等级的要求"}, {"label": "D", "text": "应满足继电保护装置10%误差特性曲线的要求"}], "answer": "ABCD", "analysis": "出自Q/GDW424-2010《电子式电流互感器技术规范》4技术参数和性能要求。 电流互感器应满足下列要求。应满足一次回路的额定电压、最大负荷电流的要求；应满足短路时的动、热稳定电流的要求；应满足二次回路测量仪表、自动装置的准确度等级的要求；应满足继电保护装置10%误差特性曲线的要求。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "中小型变压器通常装设（   ）保护装置。", "options": [{"label": "A", "text": "瓦斯保护纵差保护"}, {"label": "B", "text": "电流速断保护和零序电流保护"}, {"label": "C", "text": "(复合电压起动的）过流保护"}, {"label": "D", "text": "过负荷保护"}], "answer": "ABCD", "analysis": "出自GB/T14285-2006《继电保护和安全自动装置技术规程》4.3电力变压器保护。中小型变压器通常装设瓦斯保护纵差保护、电流速断保护和零序电流保护、(复合电压起动的）过流保护、过负荷保护。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "对重合闸装置的要求有（   ）。", "options": [{"label": "A", "text": "手动或遥控跳闸时，不应重合"}, {"label": "B", "text": "手动投入断路器于故障线路，由保护将其跳开后，不应重合"}, {"label": "C", "text": "重合闸起动采用控制开关与断路器位置不对应原理及保护起动，而且保证仅重合一次"}, {"label": "D", "text": "一般自动复归。有值班人员的10千伏以下线路也可手动复归"}], "answer": "ABCD", "analysis": "出自GB/T14285-2006《继电保护及安全自动装置技术规程》5.2条。对重合闸装置的要求有手动或遥控跳闸时，不应重合；手动投入断路器于故障线路，由保护将其跳开后，不应重合；重合闸起动采用控制开关与断路器位置不对应原理及保护起动，而且保证仅重合一次；一般自动复归，有值班人员的10千伏以下线路也可手动复归。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "瓦斯保护的保护范围是（   ）。", "options": [{"label": "A", "text": "变压器内部的多相短路"}, {"label": "B", "text": "匝间短路，绕组与铁芯或与外壳间的短路"}, {"label": "C", "text": "油面下降或漏油"}, {"label": "D", "text": "分接开关接触不良或导线焊接不良"}], "answer": "ABCD", "analysis": "出自GB/T14285-2006《继电保护和安全自动装置技术规程》4.3电力变压器保护。瓦斯保护的保护范围是：变压器内部的多相短路；匝间短路，绕组与铁芯或与外壳间的短路；油面下降或漏油；分接开关接触不良或导线焊接不良。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "指示断路器位置的红、绿灯不亮，对运行有（    ）影响。", "options": [{"label": "A", "text": "不能正确反映断路器的跳、合闸位置或跳合闸回路完整性，故障时造成误判断"}, {"label": "B", "text": "如果是跳闸回路故障，当发生事故时，断路器不能及时跳闸，造成事故扩大"}, {"label": "C", "text": "如果是合闸回路故障，会使断路器事故跳闸后自投失效或不能自动重合"}, {"label": "D", "text": "跳、合闸回路故障均影响正常操作"}], "answer": "ABCD", "analysis": "出自《110千伏及以下变电站运行标准化工作手册》西安电子科技大学出版社  第4章。指示断路器位置的红、绿灯不亮，对运行有下列影响。不能正确反映断路器的跳、合闸位置或跳合闸回路完整性，故障时造成误判断；如果是跳闸回路故障，当发生事故时，断路器不能及时跳闸，造成事故扩大；如果是合闸回路故障，会使断路器事故跳闸后自投失效或不能自动重合；跳、合闸回路故障均影响正常操作。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "35千伏中性点不接地电网中，线路相间短路保护配置的原则是（   ）。", "options": [{"label": "A", "text": "当采用两相式电流保护时，电流互感器应装在各出线同名相上(例如A、C相"}, {"label": "B", "text": "保护装置采用远后备方式"}, {"label": "C", "text": "如线路短路会使发电厂厂用电母线、主要电源的联络点母线或重要用户母线的电压低于额定电压的50%～60%时，应快速切除故障"}, {"label": "D", "text": "线路相间短路保护必须按三段式配置"}], "answer": "ABC", "analysis": "出自GB/T14285-2006《继电保护和安全自动装置技术规程》4.4条。 35千伏中性点不接地电网中，线路相间短路保护配置的原则是当采用两相式电流保护时，电流互感器应装在各出线同名相上(例如A、C相；保护装置采用远后备方式；如线路短路会使发电厂厂用电母线、主要电源的联络点母线或重要用户母线的电压低于额定电压的50%～60%时，应快速切除故障。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "新安装及大修后的电力变压器，正式投入运行前要做冲击合闸试验的目的是（   ）。", "options": [{"label": "A", "text": "检查变压器的绝缘强度"}, {"label": "B", "text": "检查变压器的机械强度"}, {"label": "C", "text": "检验差动保护躲过励磁涌流的性能"}, {"label": "D", "text": "检验变压器的接线组别"}], "answer": "ABC", "analysis": "《电网调度运行实用技术问答》71条新安装及大修后的电力变压器，正式投入运行前要做冲击合闸试验的目的是检查变压器的绝缘强度；检查变压器的机械强度；检验差动保护躲过励磁涌流的性能。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "负载与电源连接的原则：一是保证负载得到额定电压；二是尽量使三相负载对称分布。无论是三相交流电源还是三相负载都有星形(Y)和三角形(△)两种连接方式。因此，三相电路可能实现的连接方式有（    ）。", "options": [{"label": "A", "text": "Y-Y"}, {"label": "B", "text": "Y-△"}, {"label": "C", "text": "△-Y"}, {"label": "D", "text": "△-△"}], "answer": "ABCD", "analysis": "出自《电工原理第4版》电子工业出版社 第六章三相交流电路。三相电路可能实现的连接方式共有Y-Y 、Y-△ 、△-Y 、△-△种连接。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "在电阻、电感、电容的串联电路中，出现电路端电压和总电流同相位的现象，叫串联谐振。串联谐振的特点有（  ）。", "options": [{"label": "A", "text": "电路呈纯电阻性，端电压和总电流同相位"}, {"label": "B", "text": "电抗X等于零，阻抗Z等于电阻R"}, {"label": "C", "text": "电路的阻抗最小、电流最大"}, {"label": "D", "text": "在电感和电容上可能产生比电源电压大很多倍的高电压，因此串联谐振也称电压谐振"}], "answer": "ABCD", "analysis": "出自《电路原理第3版》机械工业出版社 第四章第一节电路的谐振现象分析。串联谐振的特点有电路呈纯电阻性，端电压和总电流同相位；电抗X等于零，阻抗Z等于电阻R ；电路的阻抗最小、电流最大；在电感和电容上可能产生比电源电压大很多倍的高电压，因此串联谐振也称电压谐振。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "在电阻、电感、电容的并联电路中，出现电路端电压和总电流同相位的现象，叫并联谐振。它的特点是（   ）。", "options": [{"label": "A", "text": "并联谐振是一种完全的补偿，电源无需提供无功功率，只提供电阻所需的有功功率"}, {"label": "B", "text": "电路的总电流最小，而支路的电流往往大于电路的总电流，因此，并联谐振也称电流谐振"}, {"label": "C", "text": "发生并联谐振时，在电感和电容元件中会流过很大的电流，因此会造成电路的熔丝熔断或烧毁电气设备等事故"}, {"label": "D", "text": "在电感和电容上可能产生比电源电压大很多倍的高电压，因此并联谐振也称电压谐振"}], "answer": "BC", "analysis": "出自《电路原理第3版》机械工业出版社 第四章第一节电路的谐振现象分析。并联谐振的特点是电路的总电流最小，而支路的电流往往大于电路的总电流，因此，并联谐振也称电流谐振；发生并联谐振时，在电感和电容元件中会流过很大的电流，因此会造成电路的熔丝熔断或烧毁电气设备等事故。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "电流互感器的几种基本接线方式是（   ）。", "options": [{"label": "A", "text": "完全星形接线、三角形接线；"}, {"label": "B", "text": "两相两继电器不完全星形接线；"}, {"label": "C", "text": "两相一继电器电流差接线；"}, {"label": "D", "text": "三相并接以获得零序电流"}], "answer": "ABCD", "analysis": "出自Q/GDW424-2010《电子式电流互感器技术规范》4技术参数和性能要求。电流互感器的几种基本接线方式是完全星形接线、三角形接线；两相两继电器不完全星形接线；两相一继电器电流差接线；三相并接以获得零序电流。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "重合闸时间为从故障切除后到断路器主断口重新合上的时间，主要包括（　　）。", "options": [{"label": "A", "text": "断路器动作时间"}, {"label": "B", "text": "重合闸整定时间"}, {"label": "C", "text": "断路器固有合闸时间"}, {"label": "D", "text": "灭弧时间"}], "answer": "BC", "analysis": "重合闸时间为从故障切除后到断路器主断口重新合上的时间，主要包括重合闸整定时间和断路器固有合闸时间。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "全电缆线路之所以不使用重合闸，主要是因为（）。", "options": [{"label": "A", "text": "电缆线路不会发生故障"}, {"label": "B", "text": "电缆线路发生的故障大多为永久性故障，重合闸成功率极低"}, {"label": "C", "text": "电缆线路造价昂贵，万一重合于永久性故障，将损失惨重"}, {"label": "D", "text": "运行习惯"}], "answer": "BC", "analysis": "《国网公司继电保护培训教材》第三章第四节：全电缆线路之所以不使用重合闸，主要是因为电缆线路发生的故障大多为永久性故障，重合闸成功率极低；电缆线路造价昂贵，万一重合于永久性故障，将损失惨重。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "35千伏馈供线路时，一般应装设的保护是（）。", "options": [{"label": "A", "text": "电流速断保护"}, {"label": "B", "text": "光纤差动保护"}, {"label": "C", "text": "带时限速断保护"}, {"label": "D", "text": "过流保护"}], "answer": "ACD", "analysis": "电力系统继电保护技术问答第四章：35千伏馈供线路时，一般应装设的保护是电流速断保护、带时限速断保护、过流保护。"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "配电网采用低电阻接地方式时，配电线路的保护配置需具备（   ）", "options": [{"label": "A", "text": "过流保护"}, {"label": "B", "text": "速断保护"}, {"label": "C", "text": "光纤纵联差动保护"}, {"label": "D", "text": "零序电流保护"}], "answer": "ABD", "analysis": "国网规范《配电网规划设计导则》Q/GDW 1738-2012  第7.8.3条：中性点低电阻接地方式增设零序电流保护"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "分布式电源采用35kV、10kV专线接入电网时，保护配置（     ）", "options": [{"label": "A", "text": "过流保护"}, {"label": "B", "text": "距离保护"}, {"label": "C", "text": "光纤纵联差动保护"}, {"label": "D", "text": "零序电流保护"}], "answer": "ABC", "analysis": "国网规范《分布式电源接入配电网设计规范》Q/GDW 11147-2013  第6.1.2.2条：35/10V电压等级接入"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "分布式电源以380/220V电压等级接入公共电网时,并网点和公共连接点的断路器应具备（    ）", "options": [{"label": "A", "text": "短路速断"}, {"label": "B", "text": "延时保护功能和分励脱扣"}, {"label": "C", "text": "失压跳闸及低压闭锁合闸"}, {"label": "D", "text": "剩余电流保护"}], "answer": "ABCD", "analysis": "国网规范《分布式电源接入配电网设计规范》Q/GDW 11147-2013  第6.1.2.1条：380/220V电压等级接入"}, {"category": "配电网继电保护及安自装置", "type": "多选题", "question": "110kV 及以下电网均采用三相重合闸，自动重合闸方式的选定，应根据（   ）等因素合理地考虑。", "options": [{"label": "A", "text": "电网结构"}, {"label": "B", "text": "系统稳定要求"}, {"label": "C", "text": "发输电设备的承受能力"}, {"label": "D", "text": "保护类型"}], "answer": "ABC", "analysis": "《3-110kV电网继电保护装置运行整定规程》"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "近后备是当主保护或断路器拒动时，由相邻电力设备或线路的保护实现后备。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第一节继电保护概述:远后备是当主保护或断路器拒动时，由相邻电力设备或线路的保护实现后备。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "远后备是当主保护拒动时，由该电力设备或线路的另一套保护实现后备的保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第一节继电保护概述:近后备是当主保护拒动时，由该电力设备或线路的另一套保护实现后备的保护。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "主保护是满足系统稳定和设备安全要求，能以最快速度有选择地切除被保护设备和线路故障的保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第一节继电保护概述"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "后备保护是主保护或断路器拒动时，用以切除故障的保护。后备保护可分为远后备和近后备两种方式。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第一节继电保护概述"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器的纵差动保护用来反应变压器绕组、引出线及套管上的各种短路故障，是变压器的后备保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第二节变电站主要保护:变压器的纵差动保护用来反应变压器绕组、引出线及套管上的各种短路故障，是变压器的主保护。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "电流速断保护具有接线简单、动作迅速等优点，但它不能保护变压器的全部，因此不能单独作为变压器的主保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第二节变电站主要保护"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "瓦斯保护是变压器油箱内绕组短路故障及异常的主保护，瓦斯保护分为轻瓦斯保护及重瓦斯保护两种。轻瓦斯保护作用于信号，重瓦斯保护作用于切除变压器。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第二节变电站主要保护"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "在运行人员人工操作或遥控操作断路器跳闸时，或手动合闸于故障线路而跳闸时，重合闸装置可以重合。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第二节变电站主要保护:在运行人员人工操作或遥控操作断路器跳闸时，或手动合闸于故障线路而跳闸时，重合闸装置均不应进行重合闸。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "自动重合闸对瞬时性的故障可迅速恢复正常运行，提高了供电可靠性，减少了停电损失。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《配网调控监控人员培训手册》第三章配电网继电保护第二节变电站主要保护"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "当系统发生严重功率缺额时，自动低频减载装置的任务是迅速断开相应数量的用户负荷，使系统频率在不低于某一允许值的情况下，达到有功功率的平衡，防止事故的扩大。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第二十二章：当系统出现有功功率缺额引起频率下降时，根据频率下降的程度，自动断开一部分不重要的用户，阻止频率下降，以便使频率迅速恢复到正常值，这种装置叫按频率自动减负荷装置。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "中性点经消弧线圈接地后，若单相接地故障的电流呈感性，此时的补偿方式为欠补偿。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电力系统运行实用技术问答》第六章：消弧线圈分为三种补偿方式，若电感电流大于接地电容电流，电网以过补偿方式运行。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "主保护或断路器拒动时，用来切除故障的保护是辅助保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电网设备监控实用技术》第四章：后备保护是主保护或断路器拒动时，用以切除故障的保护。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "电力系统发生振荡时，各点电压和电流均作往复性摆动。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统继电保护原理与实用技术》第五章第四节：电力系统振荡时，振荡电流幅值以振荡周期摆动；各点电压以振荡周期摆动。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "系统短路时电流、电压是突变的，而系统振荡时电流、电压的变化是缓慢的且与振荡周期有关。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统继电保护原理与实用技术》第五章第四节：电力振荡时电气量变化速度相对比较缓慢，而在短路故障时电气量是突变的。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "后备保护的逐级配合是指时间配合。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电力系统继电保护与安全自动装置整定计算》第3-8节：过电流保护是阶段式保护的后备段，除对本线故障有足够灵敏度外，对相邻线也应有一定远后备灵敏度，保护动作电流应大于本线路最大负荷电流，并在电流定值及动作时间上与相邻线后备段相配合。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "采用中性点不接地方式或经消弧线圈接地方式的系统被称为小电流接地系统。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统运行实用技术问答》第十章：中性点不接地系统（包括中性点经消弧线圈接地系统），发生单相接地故障时，由于不构成短路回路，接地故障电流往往比负荷电流小得多，故称其为小电流接地系统"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "电力系统对继电保护最基本的要求是它的可靠性、选择性、速动性和灵敏性。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电网设备监控实用技术》第四章：继电保护和安全自动装置应符合可靠性、选择性、灵敏性和速动性的要求。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "在小电流接地系统中发生单相接地故障时，其相间电压基本不变。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第一章：在中性点不直接接地电力系统中，单相接地不会造成跳闸，线电压仍保持不变，可允许运行一段时间。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "无时限电流速断保护是一种全线速动的保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "无时限电流速断保护应按躲过本线路末端最大三相短路电流整定，不能保护线路全长。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "空载长线充电时，末端电压会升高。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统运行实用技术问答》10-61：空载长线充电时，线路为电容性负载（对地电容及相间电容），此电容电流在导线电感和区域电网电源等值电感上的压降，使线路电压高于电源电压，而愈接近线路终端，电压升高愈严重上。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "自动重合闸启动方式只有保护启动方式。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电网设备监控实用技术》第四章第五节：重合闸由两种启动方式：断路器控制开关位置与断路器位置不对应启动和保护启动方式。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "空载变压器突然合闸时，可能产生的最大励磁涌流的值与短路电流相比，前者远小于后者。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电力系统继电保护与安全自动装置整定计算》第十五章变压器保护整定计算：在空载投入时，变压器的励磁涌流可达变压器额定电流的6-8倍，有时励磁涌流会接近甚至大于变压器外部短路时的短路电流。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "母线充电保护是利用母联或分段断路器给另一母线充电的保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第十七章：为了更可靠地切除被充电母线上的故障，在母联断路器或母线分段断路器上设置相电流或零序电流保护，作为母线充电保护。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器的纵联差动保护不能反应变压器的轻微匝间故障。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第十八章：变压器差动保护的缺点：对变压器内部较轻微的匝间短路反应不够灵敏。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器励磁涌流含有大量的高次谐波分量，其中以三次谐波为主。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电网设备监控实用技术》第四章第二节：励磁涌流含有很大的二次谐波，绝大多数涌流中二次谐波分量与基波分量的百分比大于30%，有的达80%甚至更大。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器油箱内部的各种短路故障的主保护是差动保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《变电运行现场技术问答》第十八章：瓦斯保护主要反映变压器绕组匝间短路及油面降低、铁芯过热等本体内任何故障。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "差动保护能够代替瓦斯保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《变电运行现场技术问答》第十八章:差动保护不能够代替瓦斯保护。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器短路故障的后备保护。主要是作为相邻元件及变压器内部故障的后备保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "变压器的后备保护既是变压器主保护的后备保护，又是相邻母线或线路的后备保护。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "防止继电保护“三误”是指防止继电保护的误校验、误接线、误碰。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《变电运行现场技术问答》第十八章:防止继电保护“三误”是指误整定、误接线、误碰。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "主变压器的复合电压闭锁过电流保护失去交流电压时，仅失去低压闭锁功能。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "主变压器的复合电压闭锁过电流保护失去交流电压时，失去低压及负序电压闭锁功能。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器的励磁涌流在空载投入时最大。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电网设备监控实用技术》第四章第二节：变压器投入前铁芯的剩余磁通与变压器投入时工作电压产生的磁通方向相同时，其总磁通量将远远超过铁芯的饱和磁通量，因此产生较大的涌流，其中最大峰值可达到变压器额定电流的6-8倍。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "在小接地电流系统各种故障情况中，单相接地故障对电力系统稳定运行的影响最小。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第一章：在中性点不直接接地电力系统中，单相接地不会造成跳闸，线电压仍保持不变，可允许运行一段时间。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "在运行的电流互感器二次回路上工作时，严禁短路。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电网设备监控实用技术》第三章第九节：电流互感器的二次绕组绝对不允许开路运行。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "在小电流接地电网中，电流保护常用的接线方式是两相两继电器，装同名相上。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统继电保护原理与实用技术》第十三章第二节：对于小电流接地系统，不完全星形接线不但节约了一相电流互感器的投资，在同一母线的不同出线发生异名相接地短路故障时，能使同时跳开两条线路的几率下降2/3。需要指出的是，同一母线上的电流互感器必须接在相同的相上，否则某些故障时保护将不能动作。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "电力系统无功电源不足时，必将引起系统电压普遍上升。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "无功功率不足，则将导致网络的电压水平降低。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器励磁涌流可达变压器额定电流的9-10倍。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电网设备监控实用技术》第四章第二节：变压器投入前铁芯的剩余磁通与变压器投入时工作电压产生的磁通方向相同时，其总磁通量将远远超过铁芯的饱和磁通量，因此产生较大的涌流，其中最大峰值可达到变压器额定电流的6-8倍。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "新安装或一、二次回路有变动的变压器差动保护，当被保护的变压器充电时，应将差动保护投入。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "新安装或一、二次回路有变动的变压器差动保护，当被保护的变压器充电时，应将差动保护投入，考核励磁涌流衰减初期是否造成差动保护误动。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "两台变压器之间定相（核相）是为了核定相位是否一致。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "相位或相序不同的交流电源并列或合环将产生很大的电流，对于新投产的变压器必须进行相位、相序核对后方可并入系统。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "继电保护装置是保证电力元件安全运行的基本装备，任何电力元件不得在无保护的状态下运行。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第十五章:继电保护装置是保证电力元件安全运行的基本装备，任何电力元件不得在无保护的状态下运行。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "继电保护灵敏性是指保护装置对于其保护范围内发生故障或不正常运行状态时的反应能力。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第十五章:继电保护灵敏性是指保护装置对于其保护范围内发生故障或不正常运行状态时的反应能力。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器在运行中补充油，应事先将重瓦斯保护改接信号位置，以防止误动跳闸。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第十八章：当现场进行注油和滤油时重瓦斯保护应由“跳闸”位置改为“信号”位置运行。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "处理直流接地时，应防止造成直流短路和另一点接地。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统继电保护原理与实用技术》第十章第三节：在查找接地点及处理时，应使用带绝缘的工具，以防造成直流短路或出现另一点接地。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "当直流发生接地时，禁止在二次回路上工作。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统继电保护原理与实用技术》第十章第二节：当直流系统发生一点接地之后，应立即进行检查和处理，以避免发生两点接地故障。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "对称三相电路Y连接时，线电压为相电压的√3倍。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第一章：正常情况下（Y接线），线电压的大小为相电压的√3倍。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "采用三相重合闸的双侧电源线路，先合侧要检查线路无电压，后合侧要检查线路与母线电压同步。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统继电保护原理与实用技术》第九章第二节110kV及以下双侧电源线路的自动重合闸装置，采用同期检定和无电压检定三相重合闸方式。第四节“检线无压母有压”方式，可用在双侧电源线路要求先重合闸的一侧。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "电流互感器变比越大，二次开路电压越大。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《《电力系统继电保护实用技术问答》》：电流互感器如果二次侧开路，二次电流的去磁作用消失，其一次电流完全变为励磁电流，引起铁芯磁通剧增，铁芯处于高度饱和状态，加之二次绕组的匝数很多，根据电磁感应定律E=4.44fNBS，就会在二次绕组两端产生很高的电压。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "继电保护速动性是指继电保护应以允许的可能最快速动作于断路器跳闸。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电网设备监控实用技术》第四章第一节：速动性是指保护装置应尽快地切除短路故障。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器并列运行的条件：（1）接线组别相同；（2）一、二次侧的额定电压分别相等（变比相等）；", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电力系统运行实用技术问答》第二章：并列运行的变压器必须满足下列条件，接线组别相同，变比差不得超过±0.5%，短路电压值相差不得超过±10%，两台变压器的容量比不宜超过3:1。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "在小电流接地系统中发生单相接地故障时，并不破坏系统线电压的对称性，系统还可继续运行1-2小时。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第一章：在中性点不直接接地电力系统中，单相接地不会造成故障，线电压仍保持不变，可允许运行一段时间（不超过2h）。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器的接线组别是表示高低压侧线电压之间相位关系的一种方法。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《变电运行现场技术问答》第二章:为了表明变压器各侧线电压的相位关系，将三相变压器的接线分为若干组，称为接线组别。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "电流互感器不完全星形接线，不能反应所有的接地故障。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统继电保护》电流保护的接线方式：两相不完全星形接线也能反应各种相间短路，但在没有装设电流互感器和相应的电流继电器的一相（B相）发生单相接地短路时，它不能反应。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "110千伏及以下电力设备的保护一般采用近后备保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《3-110kV电网继电保护装置运行整定规程》：3-110kV电网继电保护一般采用远后备原则。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "采用自动重合闸装置，在线路上发生永久性故障时，能迅速恢复供电，从而可提高供电的可靠性。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《电网设备监控实用技术》第四章第五节：架空线路绝大多数的故障都是瞬时性的，在继电保护动作后，电弧将自动熄灭，绝大多数情况下短路处的绝缘可以自动恢复。自动重合闸不仅提高了供电安全性，而且提高了电力系统的暂态稳定水平。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "三相重合闸方式即任何类型故障，保护动作三相跳闸三相重合，重合不成跳开三相。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "正确"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "线路保护定值的整定需考虑由于负荷转供及分布式电源接入引起的线路运行方式改变的影响。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "出自《国家电网公司配网方式计划管理规定》第二十条：外来电源通过变电站母线转供其他出线时，应考虑电源侧保护定值调整，被转供的线路重合闸停用、联络线开关进线保护及重合闸停用。培训教材第一部分第四章：适应分布式电源接入。随着智能电网建设，光伏发电、风电、小型燃气轮机、大容量 储能系统等分布式电源都有可能分散接入配电网，一方面对配电网的短路电流、潮流分布、 保护配合等带来一定影响。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "所有线路、变压器、母线的保护均需引入母线电压。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "距离保护、带方向元件的、带电压闭锁的保护需引入母线电压，电流三段式保护、非电量保护等不需引入母线电压。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "为提高保护动作的可靠性，不允许交、直流回路共用同一根电缆。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统继电保护原理与实用技术》第十章第四节：直流为不接地系统，而交流为接地系统。如果共用一根电缆，两者容易发生短路，造成干扰，影响电网安全运行。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器的瓦斯保护范围在差动保护范围内，这两种保护均为瞬动保护，所以能启动瓦斯动作的故障也能启动差动保护。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "《变电运行现场技术问答》第十八章：瓦斯保护主要反映变压器绕组匝间短路及油面降低、铁芯过热等本体内任何故障。纵差保护主要反映变压器绕组、引线的相间短路，及大接地电流系统侧的绕组，引出线的接地故障。差动保护不能替代瓦斯保护。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "变压器的主保护(包括重瓦斯、差动保护)同时动作跳闸，未经查明原因和消除故障之前，不得进行强送。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "《电力系统运行实用技术问答》13-22：凡变压器的主保护（气体、差动等）动作或虽未动作但跳闸时有明显的事故现象，未消除故障前不得送电。"}, {"category": "配电网继电保护及安自装置", "type": "判断题", "question": "过电流保护在系统运行方式变小时，保护范围将变大。", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "运行方式变小时，短路电流变小，过电流保护范围也变小。"}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "电力系统继电保护的基本任务是什么？", "options": [], "answer": "（1）自动、迅速、有选择地将故障元件从电力系统中地切除，使故障元件免于继续遭到损坏，其他无故障部分迅速恢复正常运行。（2）反应电力设备的不正常运行状态，并根据运行维护条件和设备的承受能力，发出报警信号或延时跳闸", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "配网35千伏及以下变压器保护如何配置？", "options": [], "answer": "（1）电气量保护：\n主保护：反应变压器绕组和引出线的多相短路及绕组匝间短路的纵联差动保护或电流速断保护。10kV以上、10MVA及以上的变压器，采用纵联差动保护作为主保护，10kV及以下、10MVA及以下的变压器，采用电流速断保护作为主保护。\n（2）非电量保护：反应变压器内部短路和油面降低的瓦斯保护。非电量保护包括重瓦斯和轻瓦斯保护，重瓦斯保护属于变压器的主保护动作变压器各侧开关跳闸，轻瓦斯保护动作发信号。\n（3）熔断器保护，是当电路中的电流过大时，能自动切断电路，它是利用了电流的热效应来工作的，故熔断器要用电阻率大、熔点低的合金制成。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述变压器纵联差动保护的保护范围？", "options": [], "answer": "变压器的纵联差动保护范围包括变压器绕组、引出线及套管上的各种短路故障", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述变压器过电流保护的配置原则？", "options": [], "answer": "（1）单侧电源的双绕组和三绕组变压器。相间短路的后备保护宜装于各侧。非电源侧保护带两段或三段时限，用第一时限断开本侧母联或分段断路器，缩小故障影响范围；用第二时限断开本侧断路器；用第三时限断开变压器各侧断路器。电源侧保护带一段时限，断开变压器各侧断路器。\n（2）对于两侧或三侧有电源的双绕组和三绕组变压器。后备保护应装设于变压器各侧，各侧相间短路后备保护可带两段或三段时限。相间短路后备保护可带方向，方向宜指向各侧母线，但断开变压器各侧断路器的后备保护不带方向。\n（3）低压侧有分支，并接至分开运行母线段的降压变压器，除在电源侧装设保护外，还应在每个分支装设相间短路后备保护。\n（4）对中性点直接接地（经小电阻接地）的电网中，对单相接地引起的变压器过电流，应装设零序过电流保护，保护可由两段组成，其动作电流与相关线路零序过电流保护相配合。每段保护可设两个时限，并以较短时限动作于缩小故障影响范围，或动作于本侧断路器，以较长时限动作于断开变压器各侧断路器。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述变压器后备保护如何实现对低压侧母线保护？", "options": [], "answer": "如果变压器低压侧母线无母线差动保护，变压器后备保护按下述原则考虑下级母线保护问题：\n①如变压器高压侧的过电流保护对低压母线的灵敏系数满足规程规定时，则在变压器的低压侧断路器与高压侧断路器上配置的过电流保护将成为该低压母线的主保护及后备保护。在此种情况下，要求这两套过流保护由不同的保护装置（或保护单元）提供。\n②如变压器高压侧的过电流保护对低压母线的灵敏系数不满足规程规定时，则在变压器的低压侧断路器上应配置两套完全独立的过电流保护作为该低压母线的主保护及后备保护。在此种情况下，要求这两套过流保护接于电流互感器不同的绕组，经不同的直流熔断器供电并以不同时限作用于低压侧断路器与高压侧断路器（或变压器各侧断路器）。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述变压器的瓦斯保护作用原理？", "options": [], "answer": "其作用原理是：变压器内部故障时，在故障点产生有电弧的短路电流，造成油箱内局部过热并使变压器油分解、产生气体（瓦斯），进而造成喷油、冲动气体继电器，瓦斯保护动作。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述配电变压器熔断器保护配置原则？", "options": [], "answer": "（1）熔断器保护常安装在变压器的高压侧，在10kV配电网中性点采用低电阻接地方式时，考虑到零序电流保护整定值很难与熔断器的熔断曲线配合，因此当配电变压器容量在630千伏安及以上时，配电变压器应配置反映相间故障的电流保护和反映接地故障的零序保护；当配电变压器容量为500千伏安及以下，当采用熔丝保护时，熔丝熔断特性应满足200安电流下，熔断时间小于60毫秒。否则应配置反映相间故障的电流保护和反映接地故障的零序保护。\n （2）熔断器的选择除满足上述条件外还需满足：①100kV·A以下的变压器，一次侧熔丝容量可按2～3倍额定电流选择，考虑到熔丝的机械强度，一般一次侧熔丝容量不小于10A,二次侧熔丝容量应按二次额定电流选择；②100kV·A及以上的变压器．一次侧熔丝容量可按1．5～2．0倍额定电流选择，二次侧熔丝容量应按二次侧额定电流选择。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述变压器纵联差动保护整定原则？", "options": [], "answer": "（1）应能躲过励磁涌流和外部短路产生的不平衡电流；\n（2）应能躲过励磁涌流和外部短路产生的不平衡电流；\n（3）在电流回路断线时应发生断线信号，电流回路断线允许差动保护动作跳闸；\n（4）在正常情况下，纵联差动保护的保护范围应包括变压器套管和引出线，如不能包括引出线时，应采取快速切除故障的辅助措施。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述变压器电流速断保护的整定原则？", "options": [], "answer": "以下两个条件计算，然后取其中较大者：\n（1）按大于变压器负荷侧母线上短路时流过保护的最大短路电流计算。\n（2）按大于变压器空载投入时的励磁涌流计算，通常取保护安装侧变压器额定电流的3～5倍。\n灵敏度不应小于2（按最小运行方式下保护安装处短路故障校验）。当灵敏度不满足要求时，若保护定值按躲过励磁涌流的条件决定，则可使电流速断保护带有少许延时（如带0.2秒延时），这样保护定值可按保护安装侧变压器额定电流的2～3倍取值，以提高保护的灵敏度。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "35kV及以下单侧电源线路保护配置原则？", "options": [], "answer": "35kV及以下县里一般采用远后备方式，单侧电源线路保护配置如下：\n（1）可装设两段过电流保护，第一段为不带时限的电流速断保护；第二段为带时限的过电流保护，保护可采用定时限或反时限特性。\n（2）经低电阻接地单侧电源线路，除配置相间故障保护外，还应配置一段或两段式零序电流保护，作为接地故障的主保护和后备保护。\n（3）必要时，如电网稳定问题、保护整定或配合困难，可配置光纤电流差动保护作为主保护，带时限的过电流保护作为后备保护。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述线路纵联保护基本原理及其构成。", "options": [], "answer": "利用线路两端的电气量在故障与非故障时的特征差异构成保护。当线路发生区内故障、区外故障时，电力线两端的电流波形、功率方向、电流相位以及两端的测量阻抗都具有明显的差异，利用这些差异可以构成不同原理的纵联保护，包括纵联电流差动保护、方向比较式纵联保护、电流相位比较式纵联保护、距离纵联保护等。\n一套完整的纵联保护包括两段保护装置、通信设备和通信通道。前在配电网纵联保护主要应用的是光纤纵联电流差动保护。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "配电线路多级级差保护基本配合关系是怎样的？", "options": [], "answer": "配电线路多级级差保护配合是指通过对变电站l0kV出线开关和10kV馈线开关设置不同的保护动作延时时间来实现保护配合。\n对于供电半径较长、分段数较少的开环运行的农村配电线路，在线路上发生故障时，若故障位置上游各个分段开关处的短路电流水平差异比较明显，可以采取电流定值与延时级差配合的方式(如三段式过流保护或反时限过流保护)实现多级保护配合，有选择性地快速切除故障。对于供电 半径较短的开环运行的城市配电线路，在线路上发生故障时，故障位置上游各个分段开关处的短路电流水平往往差异比较小，无法针对不同的开关设置不同的电流定值，此时仅能依靠保护动作延时时间级差配合实现故障有选择性的切除。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "常见电力电容器的保护类型有哪些？", "options": [], "answer": "熔丝保护、延时电流速断保护、过电流保护、过电压保护、低电压保护、单星形接线电容器组不平衡电压保护、单星形接线电容器组差压保护、双星型接线电容器组的中性线不平衡电流保护。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述电容器低电压保护的作用及整定原则？", "options": [], "answer": "变电站电力电容器作为储能元件并联在母线上，在交流电压作用下能“发”无功电力(电容电流)，低电压保护应能在电容器所接母线失压后可靠动作，使电容器脱离母线避免母线恢复供电时因电容器残余电荷造成谐振过电压，而在母线电压恢复正常后可靠返回；如该母线作为备用电源自投装置的工作电源，则低电压定值还应高于备自投装置的低电压元件定值，一般整定为0.2～0.5倍额定电压。保护的动作时间应与本侧出线后备保护时间配合。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "电容器单星形接线电容器组的开口三角电压保护的整定原则？", "options": [], "answer": "电容器组正常运行时的不平衡电压应满足厂家要求和安装规程的规定。开口三角电压定值按部分单台电容器（或单台电容器内小电容元件）切除或击穿后，故障相其余单台电容器所承受的电压（或单台电容器内小电容元件）不长期超过1.1倍额定电压的原则整定，同时，还应可靠躲过电容器组正常运行时的不平衡电压。动作时间一般整定为0.1s～0.2s。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "电容器单星形接线电容器组电压差动保护的整定原则？", "options": [], "answer": "差动电压定值按部份单台电容器（或单台电容器内小电容元件）切除或击穿后，故障相其余单台电容器所承受的电压不长期超过1.1倍额定电压的原则整定，同时，还应可靠躲过电容器组正常运行时的段间不平衡差电压。动作时间一般整定为0.1s～0.2s。电容器组正常运行时的不平衡电压应满足厂家要求和安装规程的规定。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "电抗器保护整定原则？", "options": [], "answer": "（1）电流速断保护：电流速断保护电流定值应躲过电抗器投入时的励磁涌流，一般整定为3~5倍的额定电流，在常见运行方式下，电抗器端部引线故障时灵敏系数不小于1.3。\n（2）过电流保护：过电流保护电流定值应可靠躲过电抗器额定电流，一般整定为1.5~2倍额定电流，动作时间一般整定为0.5s~1.0s。\n（3）过负荷保护：过负荷保护动作于信号，电流定值一般整定为1.1倍~1.2倍额定电流，动作时间一般整定为4s~6s。\n（4）零序电流保护（小电阻接地系统）：对本间隔单相接地故障有灵敏度，且与相邻元件零序电流保护配合。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述母线差动保护的原理和分类？", "options": [], "answer": "母线差动保护是利用母线上发生故障时，电流分布发生变化的特征设置的，一般情况下，各连接单元的电流流向母线；而在母线之外（线路上或变压器内部）发生故障时连接单元各的电流有流向母线的，有流出母线的。依据基尔霍夫定律判断流入、流出母线电流是否相等，当母线上故障时母差保护动作，母线外故障母差保护可靠不动作。\n母线差动保护根据保护范围分为大差与小差，总差动的保护范围涵盖了各段母线，总差动也常被称为“总差”或“大差”；分差动因其差动保护范围只是相应的一段母线，常称为“分差”或“小差”。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述分布式电源接入35kV或10kV电压等级送出线路继电保护配置原则？", "options": [], "answer": "（1）采用专线接入配电网\n分布式电源采用专用线路接入用户变电站或开关站母线等时，宜配置（方向）过流保护；接入配电网的分布式电源容量较大且可能导致电流保护不满足保护“四性”要求时，可配置距离保护；当上述两种保护无法整定或配合困难时，可增配纵联电流差动保护。\n（2）采用“T”接方式接入配电网\n分布式电源采用“T”接线路接入用户配电网时，为了保证用户其他负荷的供电可靠性，宜在分布式电源站侧配置电流速断保护反映内部故障。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述分布式电源接入系统防孤岛保护应满足的功能和要求？", "options": [], "answer": "（1）变流器必须具备快速检测孤岛且检测到孤岛后立即断开与电网连接的能力,其防孤岛保护方案应与分布式电源采用“T”接线路接入用户配电网时，为了保证用户其他负荷的供电可靠性，宜在分布式电源站侧配置电流速断保护反映内部故障。\n（2）接入35/10kV系统的变流器类型分布式电源应同时配置防孤岛保护装置,同步电机、感应电机类型分布式电源,无需专门设置防孤岛保护。\n（3）分布式电源切除时间应与线路保护、重合闸、备自投等配合,以避免非同期合闸。\n（4）变流器型分布式电源接入380/220V电压等级接入时,依靠变流器自身的防孤岛效应保护实现防孤岛功能，并在公共电网连接点并联防孤岛装置。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述配电网继电保护装置整定计算范围及要求？", "options": [], "answer": "（1）配调负责管辖范围内电网与设备的继电保护及安全自动装置整定工作；\n（2）配电网设备保护整定应满足地调下达的有关限额要求；\n（3）整定方案应遵循局部服从全局、下一级电压系统服从上一级电压系统，并兼顾局部或下一级电压系统的要求；\n（4）配调管辖范围变更，相关单位应提前一个月提供相关的继电保护和安全自动装置图纸、资料和整定单等，调控关系移交后一个月内由接管单位计算定值并重新下达。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述继电保护运行基本原则？", "options": [], "answer": "（1）任何电力设备（电力线路、母线、变压器等）都不允许无保护运行，主变瓦斯保护和差动保护不得同时退出运行。\n（2）继电保护与安全自动装置的整定、运行与电网运行方式密切相关。调度运行专业应与继电保护专业相互协调，密切配合，以保证充分发挥作用。\n（3）继电保护特殊运行方式应经所在单位分管领导批准，必要时应纳入电网安全风险管理，并备案说明。", "analysis": ""}, {"category": "配电网继电保护及安自装置", "type": "简答题", "question": "简述继电保护及安全自动装置启停管理要求？", "options": [], "answer": "(1)在电力设备由一种运行方式转为另一种运行方式的操作过程中，被操作的有关设备均应在保护范围内，允许部分保护装置在操作过程中失去选择性。\n（2）在保护装置上进行试验时，除了必须停用该保护装置外，还应断开保护装置启动其他系统保护装置和安全自动装置的相关回路。\n（3）运行中的设备更改保护定值或二次回路切换，保护可以短时停用。\n（4）邻盘上作业有较大的振动，以致可能引起某些瞬时动作的保护误动作时，保护可以短时停用。\n（5）变压器开始投运时重瓦斯保护就应投入跳闸位置。运行中的变压器主保护如需停用应由现场运维人员向值班调控员提出。变压器差动保护及重瓦斯保护不能同时停用。\n（6）电压互感器二次失压，可能引起某些保护或安全自动装置的误动，应在电压互感器二次回路停用期间，先停用有关保护和安全自动装置。\n（7）必须利用负荷电流进行接线正确性检验的保护装置(差动、方向保护等测量六角图)，在做好有关措施及气候正常的情况下允许短时停用。此类工作必须由现场事先向值班调控员提出申请，由值班调控员在设备带负荷前通知停用有关保护， 待试验正确后投入。\n（8）线路或设备上带电作业中及开关跳闸次数达到允许跳闸次数，需停用自动重合闸。", "analysis": ""}, {"category": "配电网自动化", "type": "单选题", "question": "以下哪项调度自动化的功能主要是保证电网的频率质量？（  ）", "options": [{"label": "A", "text": "SCADA"}, {"label": "B", "text": "EDC"}, {"label": "C", "text": "AGC"}, {"label": "D", "text": "DTS"}], "answer": "C", "analysis": "调度自动化中的AGC功能主要是保证电网的频率质量"}, {"category": "配电网自动化", "type": "单选题", "question": "EMS状态估计的数据源为（  ）？", "options": [{"label": "A", "text": "实时数据、历史数据、故障数据"}, {"label": "B", "text": "测量数据、开关数据、故障数据"}, {"label": "C", "text": "实时数据、历史数据、计划数据"}, {"label": "D", "text": "测量数据、历史数据、故障数据"}], "answer": "C", "analysis": "实时数据、历史数据、计划数据可以做为EMS状态估计的数据源"}, {"category": "配电网自动化", "type": "单选题", "question": "EMS通过厂站RTU或测控装置采集的数据反映了电网的稳态潮流情况，其实时性通常能达到（  ）。", "options": [{"label": "A", "text": "毫秒级"}, {"label": "B", "text": "秒级"}, {"label": "C", "text": "分钟级"}, {"label": "D", "text": "小时级"}], "answer": "B", "analysis": "厂站RTU或测控装置采集的数据，根据其硬件特性和传输速率，其实时性通常仅能达到秒级。"}, {"category": "配电网自动化", "type": "单选题", "question": "SCADA进行拓扑着色带电状态受什么因素影响？  （  ）", "options": [{"label": "A", "text": "遥测"}, {"label": "B", "text": "遥信"}, {"label": "C", "text": "档位"}, {"label": "D", "text": "遥控"}], "answer": "B", "analysis": "SCADA根据各元件的连接关系实现拓扑着色"}, {"category": "配电网自动化", "type": "单选题", "question": "调控员培训模拟系统（DTS）主要用于调控员培训，它可以提供一个电网的模拟系统，调控员通过它可以进行哪些操作，从而提高调控员培训效果，积累电网操作及事故处理的经验？（  ）", "options": [{"label": "A", "text": "实际现场操作及系统反事故演习"}, {"label": "B", "text": "模拟现场操作及系统反事故演习"}, {"label": "C", "text": "直接现场操作及系统反事故演习"}, {"label": "D", "text": "脱离现场操作及系统反事故演习"}], "answer": "B", "analysis": "调控员培训模拟系统（DTS）主要作用是模拟现场操作及系统反事故演习"}, {"category": "配电网自动化", "type": "单选题", "question": "调度自动化必须保证（  ），才能确保调控中心及时了解电力系统的运行状态，并做出正确的控制决策。", "options": [{"label": "A", "text": "可靠性、实时性、准确性"}, {"label": "B", "text": "安全性、实时性、稳定性"}, {"label": "C", "text": "可靠性、实用性、准确性"}, {"label": "D", "text": "安全性、稳定性、准确性"}], "answer": "A", "analysis": "可靠性、实时性、准确性是调度自动化系统稳定可靠运行的基础。"}, {"category": "配电网自动化", "type": "单选题", "question": "对运行中的自动化系统、设备、数据网络配置、软件或数据库等作重大修改后应经过（  ）个月的试运行，验收合格后方可正式投运。", "options": [{"label": "A", "text": "1-2"}, {"label": "B", "text": "2-3"}, {"label": "C", "text": "3-6"}, {"label": "D", "text": "6-9"}], "answer": "C", "analysis": "摘自DLT 516-2006 《电力调度自动化系统运行管理规程 》5.2.11条目"}, {"category": "配电网自动化", "type": "单选题", "question": "教员机模拟前置机向学员台发送仿真电网的遥测遥信数据，在学员台中仿真 SCADA/EMS 所有的（  ）功能。", "options": [{"label": "A", "text": "监视和控制"}, {"label": "B", "text": "监视和考核"}, {"label": "C", {"label": "错误", "text": "错误"}], "answer": "错误", "analysis": "手册第七节第三大点第2小点"}, {"category": "配电网自动化", "type": "判断题", "question": "应根据城市定位、供电可靠性需求、配电网规模、接入容量等条件合理配置主站功能。（  ）", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "配电网调控人员培训手册"}, {"category": "配电网自动化", "type": "判断题", "question": "实现配电网实时监控、自动故障隔离及恢复供电等功能，称为配电网运行自动化。（  ）", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "配电网调控人员培训手册"}, {"category": "配电网自动化", "type": "判断题", "question": "实现离线的或实时性不强的设备管理、停电管理等功能，称为配电网管理自动化。（  ）", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "配电网调控人员培训手册"}, {"category": "配电网自动化", "type": "判断题", "question": "配电终端宜优先直接接入主站；若需配置子站，应根据配电网结构、通信方式、终端数量等合理配置。（  ）", "options": [{"label": "正确", "text": "正确"}, {"label": "错误", "text": "错误"}], "answer": "正确", "analysis": "配电网调控人员培训手册"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化生产控制大区采集应用部分内部的安全防护方式是什么？", "options": [], "answer": "无论采用何种通信方式，生产控制大区采集应用部分主 机应采用经国家指定部门认证的安全加固的操作系统，采用用户名/强口令、动态口令、物理设备、生物识别、数字证书等 2 种或 2 种以上组合方式，实现用户身份认证及账号管理。", "analysis": "运检6号文附件2"}, {"category": "配电网自动化", "type": "简答题", "question": "什么是配电自动化（DA）？什么是配电自动化系统（DAS）？", "options": [], "answer": "配电自动化（Distribution Automation，简称DA）以一次网架和设备为基础，综合利用计算机、信息及通信等技术，以配电自动化系统为核心，实现对配电系统的监测、控制和快速故障隔离，并通过与相关应用系统的信息集成，实现配电系统的科学管理。\n配电自动化系统（Distribution Automation System，简称DAS）。实现配电网运行监视和控制的自动化系统，具备配电SCADA(supervisory control and data acquisition)、馈线自动化、电网分析应用及与相关应用系统互连等功能，主要由配电自动化系统主站、配电自动化系统子站（可选）、配电自动化终端和通信网络等部分组成。", "analysis": "手册"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化系统由哪几部分构成？各部分实现哪些功能？", "options": [], "answer": "配电自动化系统主要由主站、配电子站（可选）、配电终端和通信通道组成，通过信息交换总线实现与其它相关应用系统互连，实现数据共享和功能扩展。\n其中，配电主站是实现数据采集、处理及存储、人机联系和各种应用功能的核心；配电终端是安装在一次设备运行现场的自动化终端，根据具体应用对象选择不同的类型，直接采集一次系统的信息并进行处理，接收配电站子站或主站的命令并执行；配电子站是主站和终端连接的中间层设备，一般用于通信汇集，也可根据需要实现区域监控，配电子站通常根据配电自动化系统分层结构的情况而选用；通信通道是连接配电主站、配电子站和配电终端之间实现信息传输的通信网络。", "analysis": ""}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化的发展大致分为哪三个阶段？", "options": [], "answer": "第一阶段：通过自动化开关设备相互配合实现故障隔离和健全区域恢复供电，不需要建设通信网络和主站计算机系统。。\n第二阶段：基于通信网络、馈线终端单元和后台计算机网络的实时应用系统，兼备正常情况下的运行状况监视及故障时的故障处理功能。\n第三阶段：结合配电GIS（Geographic Information System）、OMS（Operation Management System）、电力故障抢修管理系统、WMS（Work Management System，工作管理系统），并与需求侧管理（DSM）相结合，覆盖配网调度、运行、生产的全过程，支持客户服务，实现配用电综合应用。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电网运行自动化功能有哪些？", "options": [], "answer": "1）数据采集与监控。数据采集与监控功能时“三遥”（遥测、遥信、遥控）的具体体现与扩展，实现配电网及设备的数据采集、运行状态监视和故障告警等功能并对相关电力设备进行远程操作。数据采集与监控是配电自动化的基础功能。\n2）故障自动隔离与恢复供电。在线路发生永久性故障后，配电自动化系统自动定位线路故障点，跳开故障点两侧的断路器，隔离故障区段，恢复非故障线路的供电，缩小故障停电范围，加快故障抢修速度，减少停电时间，提供电可靠性。\n3）电压及无功管理。配电自动化系统可以通过高级应用软件对配电网的无功分布进行全局优化，调整变压器分接头档位，控制无功补偿设备的投切，以保证供电电压合格、线损最小；也可以采用现场自动装置，以某控制点的电压及功率因数为控制参数，就地调整变压器分接头档位、投切无功补偿电容器。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电网管理自动化功能有哪些？", "options": [], "answer": "1）设备管理。配电网包含大量的设备，遍布于整个供电区域，传统的人工管理方式已不能满足日常管理工作的需要。设备管理功能可实现在地理信息系统平台上，应用自动绘图工具，以地理图形为背景绘出并分层显示网络接线、用户位置、配电设备及属性数据等。该功能还支持设备档案的计算机检索、调阅，并可查询、统计某区域设备数量、负荷、用电量等。\n2）检修管理。在设备管理的基础上，制定科学的检修计划，对检修工作票、倒闸操作票、检修过程进行计算机管理，提高检修水平和工作效率。\n3）停电管理。利用计算机和信息技术对故障停电以及计划停电处理过程进行科学管理。能够合理安排停电计划、避免重复性停电、减少停电范围、缩短停电时间，迅速响应用户报修、提高故障处理速度，以达到进一步提高供电可靠性、提升用户满意度的目的。\n4）规划与设计管理。配电自动化系统对配电网规划所需的地理、经济、负荷等数据进行集中存储、管理，并提供负荷预测、网络拓扑分析、短路电流计算等功能，不仅可以加速配电网规划与设计过程，而且还可使规划与设计方案更加经济、高效。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "什么是配电自动化主站系统？其建设原则是什么？", "options": [], "answer": "配电自动化主站系统（即配电网调度控制系统，简称配电主站），主要实现配电网数据采集与监控等基本功能和分析应用等扩展功能，为调度运行、生产及故障抢修指挥服务。\n配电主站应构建在标准、通用的软硬件基础平台上，具备可靠性、可用性、扩展性和安全性，并根据各地区的配电网规模、实际需求和配电自动化的应用基础等情况选择和配置软硬件。配电主站要根据各地区配电网规模和应用需求合理配置。配电主站支撑平台应一次性建设，功能选择应依据系统容量要求。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化主站系统有哪些基本功能？", "options": [], "answer": "1）配电SCADA功能。配电SCADA也称为DSCADA，它是由若干最基本的实时监控功能组成，通过人机交互，实现配电网的运行监视和远方控制，为配电网调度和生产指挥提供服务，是配电自动化主站系统必须首先实现的应用功能。其主要包括：数据采集、数据处理、数据记录、操作与控制、智能告警分析、网络拓扑着色、馈线故障处理。\n2）馈线故障处理自动化，配电主站根据接收到的故障信号启动故障处理模块，在故障判断和故障定位告警的基础上，提供故障处理及供电恢复方案。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化主站系统有哪些拓展功能？", "options": [], "answer": "1）配电网分析应用。配电网分析应用也称为高级应用，是配电自动化主站系统的扩展功能。它必须建立在配电SCADA等基本功能的基础上。并且对实时数据的完整性和准确性有较高的要求。其主要包括：拓扑分析、状态估计、潮流计算、解合环分析、负荷转供、网络重构、负荷预测。\n2）智能化应用。随着智能电网建设的开展，智能化应用也是配电自动化系统扩展功能的重要内容。其主要包括：分布式电源接入与控制、预警分析、配电网自愈、经济运行\n3）互动化应用。互动化是智能电网的重要特征之一，而智能电网的互动化更多地体现在配用电环节。随着配电自动化应用的深入和推广，在实现多系统信息交互的基础上可开展互动化应用。互动化应用的特点就是信息流来自多个系统，业务流贯穿于多个系统。其主要包括：故障研判、工单管理、计划停电范围分析、基于GIS的抢修调度综合展示（Ⅲ区功能）。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电终端分哪几种？其模拟量输入可采用哪两种采样方式？", "options": [], "answer": "根据应用的对象及功能，配电终端可分为馈线终端(FTU)、站所终端(DTU)、配变终端(TTU)和具备通信功能的故障指示器等。\n馈线终端 （feeder terminal unit）：安装在配电网架空线路杆塔等处的配电终端，按照功能分为“三遥”终端和“二遥”终端，其中“二遥”终端又可分为基本型终端、标准型终端和动作型终端。\n站所终端 （distribution terminal unit）：安装在配电网开关站、配电室、环网柜、箱式变电站等处的配电终端，依照功能分为“三遥”终端和“二遥”终端，其中“二遥”终端又可分为标准型终端和动作型终端。\n配变终端（ transformer terminal unit）：安装在配电变压器，用于监测配变各种运行参数的配电终端。\n远动终端的模拟量输入模式可分为：（1）直流采样；（2）交流采样。区别：直流采样使用变送器，信号处理电路采用多路转换开关，采样保持器和A/D转换器等；交流采样不使用变送器，信号经过隔离和降低幅值作用的中间TA和TV后，仍以交流模拟信号供A/D按一定规律进行直接采样，并加以处理。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电终端信息安全的原则是什么？", "options": [], "answer": "配电终端应满足电力二次安全防护有关规定，满足以下原则：\n（1）所有终端对于主站下发的遥控命令都应进行单向认证；\n（2）当应用配电子站时，终端对于主站下发的遥控命令也应满足单向认证要求。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化主站系统的故障处理功能有哪些特点？", "options": [], "answer": "（1）可自动设计非故障区段的恢复供电方案，避免恢复过程导致其他线路、主变等设备过负荷；\n（2）可灵活设置故障处理闭锁条件，避免保护调试、设备检修等人为操作的影响；\n（3）故障处理过中应具备必要的安全闭锁措施（如通信故障闭锁、设备状态异常闭锁等），保证故障处理过程不受其他操作干扰；\n（4）支持恢复方案人工干预与优化调整。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化主站系统的配置原则是什么？", "options": [], "answer": "（1）硬件配置\n主要设备应采用双机、双网冗余配置，满足可靠性和系统性能指标要求，具有扩展性、通用性。配电主站应有安全、可靠的供电电源保障。\n（2）软件配置\n1） 服务器与工作站宜采用UNIX/LINUX操作系统；\n2） 应采用成熟可靠的支撑和应用软件，满足相关技术标准和规范。\n（3）功能配置\n1） 配电主站应在具备基本功能的基础上，根据实际需要，合理配置扩展功能；\n2） 在相应区域具备完备的配电网络拓扑的前提下，可配置馈线故障处理功能；\n3） 在信息量的完整性和准确性满足要求的前提下，可配置电网分析应用功能；\n4） 在配电主站功能成熟应用的基础上，可结合本地区智能电网工作的开展，合理配置智能化功能。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "对于配电自动化系统的信息交互有哪些要求？", "options": [], "answer": "（1）配电自动化系统信息交互应符合电力企业整体信息集成交互构架体系。\n（2）信息交互应遵循图形、模型、数据来源及维护的唯一性原则和设备编码的统一性原则。\n（3）配电自动化系统应遵循IEC 61968标准，采用信息交换总线方式，实现各系统之间信息共享，满足业务集成应用需求。\n（4）信息交互必须满足电力二次系统安全防护规定，采取安全隔离措施，确保各系统及其信息的安全性。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化对通信网络的要求有哪些？", "options": [], "answer": "（1）配电通信网络应满足实时性、可靠性等要求。\n（2）骨干网（四级）宜采用光纤专网，终端通信接入网采用无源光网络时应使用专用纤芯。\n（3）接入网主要包括光纤专网、配电线载波、无线专网和无线公网等多种方式，应因地制宜，综合采用多种通信方式，并支持SDH、工业以太网与无源光网络混合组网通信。\n（4）终端通信接入网应规范接口、统一管理。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "对于配电自动化系统主站的信息安全有哪些要求？", "options": [], "answer": "（1）在信息安全Ⅰ、Ⅱ区之间安装国产硬件防火墙实施访问控制；\n（2）在生产控制大区与管理信息大区之间部署正、反向电力系统专用网络安全隔离装置进行电力系统专用网络安全隔离；\n（3）在信息安全Ⅲ、Ⅳ区之间安装国产硬件防火墙实施安全隔离；\n（4）配电主站下发的遥控命令应带有基于调度证书的数字签名;\n（5）主站前置机应采用经国家指定部门认证的安全加固的操作系统，并采取严格的访问控制措施。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化系统软件管理有哪些主要内容？", "options": [], "answer": "（1）应对配电自动化业务数据与应用系统进行备份确保在数据损坏或系统崩溃情况下快速恢复数据与系统，保证系统安全性、可靠性。（2）地市公司调度控制中心应及时对相关系统软件（操作系统、数据库系统、各种工具软件）漏洞发布信息，及时获得补救措施或软件补丁，对软件进行升级。（3）应部署、升级防病毒软件，并检查该软件检、杀病毒的情况，配电自动化系统安全防护应严格按照《电力二次系统安全防护规定》（国家电力监管委员会第5号令）和《中低压电网自动化系统安全防护补充规定（试行）》（国家电网调〔2011〕168号）要求执行。", "analysis": "配网调控实用技术问答"}, {"category": "配电网自动化", "type": "简答题", "question": "配电自动化的缺陷管理有哪些主要内容？", "options": [], "answer": "配电自动化系统缺陷应按照影响大小分为危急缺陷、严重缺陷、一般缺陷三个等级。危急缺陷是指威胁人身或设备安全，严重影响设备运行、使用寿命及可能造成配电自动化系统失效，危及电力系统安全、稳定和经济运行的缺陷。此类缺陷必须在24小时内消除。严重缺陷是指对设备功能、使用寿命及系统正常运行有一定影响或可能发展成为危急缺陷，但允许其带缺陷继续运行或动态跟踪一段时间的缺陷。此类缺陷时必须在5个工作日内消除。一般缺陷是指对人身和设备无威胁，对设备功能及系统稳定运行没有立即、明显的影响、且不至于发展为严重缺陷的缺陷。此类缺陷应列入检修计划尽快处理。当发生的缺陷威胁到其它系统或一次设备正常运行时，运维单位应及时采取有效的安全技术措施进行隔离
